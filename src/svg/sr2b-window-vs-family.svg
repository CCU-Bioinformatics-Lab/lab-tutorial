<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 402">
  <title>兩條家族被兩件東西綁在一起，所以拆不開</title>
  <desc>左右並排比較同一個連鎖視窗的兩種寫法。
        每一邊都畫成兩條泳道，上面一條是家族一，下面一條是家族二，泳道裡是該家族的 read。
        兩件把兩族綁在一起的東西都畫了出來。
        第一件是家族誤標：家族一的泳道裡混進一條顏色屬於家族二的 read，
        並有一支箭頭從家族二的泳道指過來，表示這條分子實際來自隔壁，只是標籤標錯了。
        第二件是方向開關：左邊只有一個開關，兩條接線分別接到兩條泳道，
        所以撥動它會同時翻轉兩族。
        左邊因此只輸出一個因子，方向也只被邊際化一次。
        右邊是錯誤的寫法：兩條泳道之間築了一道牆當成互相獨立，
        那條被誤標的分子於是在兩條泳道各留下一份，用紅圈標出「同一條算了兩次」；
        方向開關也變成各自獨立的兩個。
        右邊因此輸出兩個相乘的因子，證據量被高估，方向的不確定性也被算掉一半。</desc>

  <text class="ttl zh" x="20" y="40">兩族被兩件東西綁在一起，所以拆不開</text>

  <!-- ════════════ 左：正確 ════════════ -->
  <rect class="box ok" x="20" y="60" width="460" height="326" rx="12"/>
  <text class="lbl bold zh ok" x="40" y="92">✓ 綁在一起 → 一個因子</text>

  <!-- 泳道：家族 u₁ -->
  <rect class="box sunken" x="40" y="106" width="290" height="72" rx="8"/>
  <text class="lbl bold zh hp1" x="54" y="132">家族 u₁</text>
  <rect class="read hp1" x="150" y="114" width="158" height="14" rx="7"/>
  <rect class="read hp1" x="162" y="136" width="158" height="14" rx="7"/>
  <rect class="read hp2" x="150" y="158" width="158" height="14" rx="7"/>

  <!-- 泳道：家族 u₂ -->
  <rect class="box sunken" x="40" y="206" width="290" height="72" rx="8"/>
  <text class="lbl bold zh hp2" x="54" y="232">家族 u₂</text>
  <rect class="read hp2" x="150" y="214" width="158" height="14" rx="7"/>
  <rect class="read hp2" x="162" y="236" width="158" height="14" rx="7"/>
  <rect class="read hp2" x="150" y="258" width="158" height="14" rx="7"/>

  <!-- ① 誤標：一條分子從下面那條泳道被搬上來 -->
  <path class="conn warn thick" d="M262,206 C262,194 262,186 262,178" marker-end="url(#arrow-sm)"/>
  <text class="tick zh warn" x="54" y="200">① 誤標 ξ<tspan style="font-size:11px" dy="3">v</tspan><tspan dy="-3">：這條來自 u₂</tspan></text>

  <!-- ② 方向：一個開關，兩條接線 -->
  <path class="conn accent" d="M330,142 L358,142 L358,190"/>
  <path class="conn accent" d="M330,242 L358,242 L358,206"/>
  <rect class="box accent" x="358" y="184" width="58" height="28" rx="14"/>
  <rect class="bar ok" x="364" y="190" width="20" height="16" rx="8"/>
  <text class="lbl bold zh accent mid" x="410" y="248">σ<tspan style="font-size:15px" dy="4">v</tspan></text>
  <text class="tick zh mid" x="410" y="270">一個開關</text>
  <text class="tick zh mid" x="410" y="290">兩族共用</text>

  <path class="conn thick" d="M185,278 L185,306" marker-end="url(#arrow-sm)"/>

  <rect class="box ok" x="40" y="310" width="420" height="64" rx="10"/>
  <text class="lbl bold zh ok mid" x="250" y="340">P<tspan style="font-size:15px" dy="4">v</tspan><tspan dy="-4">(D</tspan><tspan style="font-size:15px" dy="4">v</tspan><tspan dy="-4"> ∣ Θ</tspan><tspan style="font-size:15px" dy="4">K</tspan><tspan dy="-4">)</tspan></text>
  <text class="tick zh mid" x="250" y="364">兩族一起算，方向只邊際化一次</text>


  <!-- ════════════ 右：錯誤 ════════════ -->
  <rect class="box bad" x="520" y="60" width="460" height="326" rx="12"/>
  <text class="lbl bold zh bad" x="540" y="92">✗ 當成獨立 → 兩個因子</text>

  <rect class="box sunken" x="540" y="106" width="290" height="72" rx="8"/>
  <text class="lbl bold zh hp1" x="554" y="132">家族 u₁</text>
  <rect class="read hp1" x="650" y="114" width="158" height="14" rx="7"/>
  <rect class="read hp1" x="662" y="136" width="158" height="14" rx="7"/>
  <rect class="read hp2" x="650" y="158" width="158" height="14" rx="7"/>

  <rect class="box sunken" x="540" y="206" width="290" height="72" rx="8"/>
  <text class="lbl bold zh hp2" x="554" y="232">家族 u₂</text>
  <rect class="read hp2" x="650" y="214" width="158" height="14" rx="7"/>
  <rect class="read hp2" x="662" y="236" width="158" height="14" rx="7"/>
  <rect class="read hp2 ghost" x="650" y="258" width="158" height="14" rx="7"/>

  <!-- 中間那道牆：假設兩族互相獨立 -->
  <line class="guide bad" x1="546" y1="192" x2="824" y2="192"/>

  <!-- 同一條分子在兩邊各留下一份 -->
  <rect class="box ghost bad" x="644" y="152" width="170" height="26" rx="8"/>
  <rect class="box ghost bad" x="644" y="252" width="170" height="26" rx="8"/>
  
  <text class="tick zh bad" x="836" y="205">同一條算了兩次</text>

  <!-- 兩個各自獨立的開關 -->
  <path class="conn bad" d="M830,128 L858,128"/>
  <rect class="box bad" x="858" y="114" width="58" height="28" rx="14"/>
  <rect class="bar bad" x="864" y="120" width="20" height="16" rx="8"/>

  <path class="conn bad" d="M830,228 L858,228"/>
  <rect class="box bad" x="858" y="214" width="58" height="28" rx="14"/>
  <rect class="bar bad" x="894" y="220" width="20" height="16" rx="8"/>

  
  <text class="tick zh bad mid" x="887" y="272">兩個獨立開關</text>

  <path class="conn thick bad" d="M685,278 L685,306" marker-end="url(#arrow-sm)"/>

  <rect class="box bad" x="540" y="310" width="420" height="64" rx="10"/>
  <text class="lbl bold zh bad mid" x="750" y="340">P<tspan style="font-size:15px" dy="4">u₁</tspan><tspan dy="-4"> × P</tspan><tspan style="font-size:15px" dy="4">u₂</tspan></text>
  <text class="tick zh mid" x="750" y="364">兩個因子各自獨立</text>

</svg>
