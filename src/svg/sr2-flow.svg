<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640">
  <title>實作流程：從 read 到全基因體的群與樹，以及每一步是沿用還是改寫</title>
  <desc>八個步驟由上而下，右欄註明每一步的狀態是沿用、改寫還是新增。
        第一步前處理，用現有的變異判定與單倍型標記，沿用。
        第二步切分析單位，一個連鎖區段是一個連鎖視窗乘一個單倍型家族，鍵值要含 phase set，沿用。
        第三步抽狀態表，除了完整的狀態之外還要留下每一條 read 的覆蓋遮罩與計數，
        這一步要改寫：現行流程把部分覆蓋的 read 併進判定，
        新的做法是把遮罩本身存下來，因為似然要用它。
        第四步是現行的最小成本候選列舉，沿用，它負責產生候選的局部拓撲與必要的潛在節點。
        第五步是改寫的重點：把原本用 read-AF 差值總和排序的分數，
        換成這個連鎖區段那張狀態表的似然，並且不再只留一個候選。
        第六步是新增的觀測通道，包含逐位點錯誤與整條分子的家族誤標，兩者形狀不同要分開估。
        第七步把九成五單變異連鎖視窗的頻率因子與百分之五多變異連鎖區段的狀態表因子相乘，
        接到同一組全域參數上，這是整條路線的核心。
        第八步輸出全基因體的群與樹，並且逐條標明支持度、
        沒看到的狀態各自的比例上界，以及跨 phase set 沒解決的對應關係。
        右下角標注一個由此消失的東西：原本的約束信心值不再需要，
        因為權重本來就是為了修補重複計數才存在的。
        最下方標注：分岔與不可同群這些分類仍然照樣產生，但它們是這條流程的輸出，
        不是再餵回去的證據。
        讀法是：八步裡有三步沿用，兩步改寫，兩步新增，
        而改寫的那兩步都是把「先挑一個」換成「全部留著，讓似然決定」。</desc>

  <text class="ttl zh" x="20" y="36">實作流程：把局部的狀態表接到全基因體那一層</text>

  <rect class="box" x="24" y="64" width="596" height="48" rx="8"/>
  <text class="lbl zh" x="44" y="94">① 前處理：變異判定 ＋ 單倍型標記</text>
  <text class="anno bold zh ok" x="656" y="94">沿用</text>

  <rect class="box" x="24" y="122" width="596" height="48" rx="8"/>
  <text class="lbl zh" x="44" y="152">② 切連鎖區段：染色體＋phase set＋連鎖視窗＋家族</text>
  <text class="anno bold zh ok" x="656" y="152">沿用</text>

  <rect class="box warn" x="24" y="180" width="596" height="56" rx="8"/>
  <text class="lbl zh" x="44" y="212">③ 抽狀態表，並保留每條 read 的<tspan class="bold">覆蓋遮罩</tspan></text>
  <text class="anno bold zh warn" x="656" y="204">改寫</text>
  <text class="tick zh" x="656" y="228">遮罩不再被併掉，似然要用</text>

  <rect class="box" x="24" y="246" width="596" height="56" rx="8"/>
  <text class="lbl zh" x="44" y="278">④ 列舉最小成本候選與潛在節點</text>
  <text class="anno bold zh ok" x="656" y="270">沿用</text>
  <text class="tick zh" x="656" y="294">現行的超立方體解法照用</text>

  <rect class="box accent" x="24" y="312" width="596" height="56" rx="8"/>
  <text class="lbl bold zh accent" x="44" y="344">⑤ 候選分數：read-AF 差值 → <tspan class="bold">狀態表似然</tspan></text>
  <text class="anno bold zh accent" x="656" y="336">改寫</text>
  <text class="tick zh" x="656" y="360">而且不再只留一個候選</text>

  <rect class="box bad" x="24" y="378" width="596" height="56" rx="8"/>
  <text class="lbl zh" x="44" y="410">⑥ 觀測通道：逐位點錯誤 ＋ 家族誤標</text>
  <text class="anno bold zh bad" x="656" y="402">新增</text>
  <text class="tick zh" x="656" y="426">兩者形狀不同，要分開估</text>

  <rect class="box accent" x="24" y="444" width="596" height="56" rx="8"/>
  <text class="lbl bold zh accent" x="44" y="476">⑦ 兩類因子<tspan class="bold">相乘</tspan>，接到同一組全域參數</text>
  <text class="anno bold zh accent" x="656" y="468">新增</text>
  <text class="tick zh" x="656" y="492">這是整條路線的核心</text>

  <rect class="box accent" x="24" y="510" width="596" height="56" rx="8"/>
  <text class="lbl zh" x="44" y="542">⑧ 輸出：群 ＋ 樹 ＋ 支持度 ＋ 未解對應</text>
  <text class="anno bold zh accent" x="656" y="534">新增</text>
  <text class="tick zh" x="656" y="558">含「沒看到的狀態」比例上界</text>

  <path class="conn" d="M322,112 L322,120" marker-end="url(#arrow-sm)"/>
  <path class="conn" d="M322,170 L322,178" marker-end="url(#arrow-sm)"/>
  <path class="conn" d="M322,236 L322,244" marker-end="url(#arrow-sm)"/>
  <path class="conn" d="M322,302 L322,310" marker-end="url(#arrow-sm)"/>
  <path class="conn" d="M322,368 L322,376" marker-end="url(#arrow-sm)"/>
  <path class="conn" d="M322,434 L322,442" marker-end="url(#arrow-sm)"/>
  <path class="conn" d="M322,500 L322,508" marker-end="url(#arrow-sm)"/>

  <rect class="box ghost" x="656" y="600" width="326" height="0" rx="8"/>
  <text class="anno bold zh ok" x="24" y="600">由此消失的一步：約束的信心值。權重本來就是為了修補重複計數才存在的。</text>
  <text class="tick zh" x="24" y="626">分岔／不可同群這些分類照樣產生 —— 但它們是這條流程的<tspan class="bold">輸出</tspan>，不是再餵回去的證據。</text>
</svg>
