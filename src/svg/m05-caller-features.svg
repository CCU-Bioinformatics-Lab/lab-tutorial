<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470">
  <title>僅依 read 計數不足；caller 可整合多類特徵</title>
  <desc>左半部示意僅依兩種鹼基的 read 數量判斷：30 比 28 只能提出候選，不能單獨定案；
        錯誤率較高的平台可能在支持數中包含定序錯誤。右半部示意模型可整合多類特徵，
        例如鹼基數量、鹼基品質、比對品質、鄰近序列脈絡、比對型式，以及正反股向的平衡，
        再輸出候選類別與信心分數；實際特徵依 caller 與版本而異。</desc>

  <!-- ══ 左：僅依計數的簡化做法 ═════════════════════════════════ -->
  <rect class="box bad" x="16" y="16" width="452" height="240" rx="10"/>
  <text class="lbl bold zh" x="38" y="48">限制：僅依 read 計數</text>

  <!-- 兩堆 read -->
  <text class="tick zh" x="38" y="82">某個位置上：</text>

  <rect class="bar" x="38" y="96" width="240" height="26" rx="4"/>
  <text class="anno mid bold" x="158" y="115">30 條支持 A</text>

  <rect class="bar" x="38" y="132" width="224" height="26" rx="4"/>
  <text class="anno mid bold" x="150" y="151">28 條支持 G</text>

  <text class="anno zh" x="300" y="118">30 比 28</text>
  <text class="anno zh" x="300" y="146">觀測數接近</text>

  <rect class="box plain" x="38" y="178" width="410" height="60" rx="6"/>
  <text class="anno zh" x="58" y="204">可提出 heterozygous 候選</text>
  <text class="tick zh bad bold" x="58" y="228">—— 不能單獨判定</text>

  <!-- 問題所在 -->
  <text class="lbl bold zh bad" x="38" y="292">限制</text>
  <text class="anno zh" x="38" y="322">部分支持可能來自錯誤觀測：</text>

  <rect class="bar" x="38" y="338" width="112" height="22" rx="4"/>
  <text class="tick mid" x="94" y="354">14 個正確觀測</text>
  <rect class="bar artifact" x="152" y="338" width="112" height="22" rx="4"/>
  <text class="tick mid" x="208" y="354">14 個錯誤觀測</text>

  <text class="anno zh bad bold" x="38" y="390">僅依數量無法區分這兩種情況。</text>

  <!-- ══ 右：實際做法 ══════════════════════════════════════════ -->
  <rect class="box accent" x="492" y="16" width="492" height="374" rx="10"/>
  <text class="lbl bold zh" x="514" y="48">示意：整合多類特徵</text>

  <!-- 六個特徵方塊 -->
  <rect class="box plain" x="514" y="72" width="216" height="54" rx="6"/>
  <text class="tick bold zh" x="530" y="96">每個鹼基的 read 數</text>
  <text class="tick zh" x="530" y="116">基本特徵之一</text>

  <rect class="box plain" x="746" y="72" width="216" height="54" rx="6"/>
  <text class="tick bold zh" x="762" y="96">鹼基品質</text>
  <text class="tick zh" x="762" y="116">該鹼基觀測的不確定性</text>

  <rect class="box plain" x="514" y="136" width="216" height="54" rx="6"/>
  <text class="tick bold zh" x="530" y="160">比對品質</text>
  <text class="tick zh" x="530" y="180">read 對應此位置的可靠度</text>

  <rect class="box plain" x="746" y="136" width="216" height="54" rx="6"/>
  <text class="tick bold zh" x="762" y="160">周圍序列脈絡</text>
  <text class="tick zh" x="762" y="180">是否造成重複或其他對齊歧義</text>

  <rect class="box plain" x="514" y="200" width="216" height="54" rx="6"/>
  <text class="tick bold zh" x="530" y="224">比對的形狀</text>
  <text class="tick zh" x="530" y="244">附近有沒有插入或缺失</text>

  <rect class="box plain" x="746" y="200" width="216" height="54" rx="6"/>
  <text class="tick bold zh" x="762" y="224">正反股是否平衡</text>
  <text class="tick zh" x="762" y="244">單股偏高：可能有 strand bias</text>

  <!-- 匯入模型 -->
  <path class="flow" d="M622,258 L622,282" marker-end="url(#arrow)"/>
  <path class="flow" d="M854,258 L854,282" marker-end="url(#arrow)"/>

  <rect class="box accent" x="558" y="288" width="360" height="56" rx="8"/>
  <text class="anno mid bold zh" x="738" y="322">模型整合判斷</text>

  <path class="flow" d="M738,346 L738,364" marker-end="url(#arrow)"/>
  <text class="anno mid zh bold" x="738" y="382">候選類別與信心分數</text>

  <!-- ══ 底部 ══════════════════════════════════════════════════ -->
  <line class="axis" x1="20" y1="412" x2="980" y2="412"/>
  <text class="anno zh bold" x="20" y="444">在腫瘤資料中，還可加入一項 haplotype 分布訊息 ——</text>
  <text class="anno zh bold somatic" x="20" y="464">「支持這個候選的 read 是否集中於同一 haplotype」。</text>
</svg>
