<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650">
  <title>頻率的單位換掉：從單一位點的 VAF 換成多位點的單倍型頻率</title>
  <desc>兩邊都是頻率直方圖，橫軸都是頻率，差別只在「一個數字代表什麼」。
        左邊是傳統的 VAF 頻率譜，每一個數字來自一個 somatic 位點，是該位點 ALT read 的佔比。
        圖上把零點一五那一格標出來：S2 與 S3 的 VAF 都是零點一五，所以落進同一格。
        但這兩個變異其實分屬完全不同的譜系，直方圖把它們併在一起了。
        另外 S1 的 VAF 是零點三五，那是兩群細胞加起來的結果，不對應任何單一一群細胞。
        右邊是單倍型頻率譜，每一個數字來自一條單倍型：
        HP1 佔零點三零，它底下的 HP1-1 佔零點二零，再底下的 HP1-1-1 佔零點一五；
        另一側 HP2 佔零點二零，底下的 HP2-1 佔零點一五。
        同樣有兩個零點一五，但它們的標籤不同，分別屬於 HP1 與 HP2 兩個分支。
        一條單倍型是一組變異的特定組合，所以它的頻率只數帶著那個組合的分子，
        那是聯合而不是邊際；而且標籤本身帶著層級，先後關係跟著頻率一起出來。
        最下方是這條路線要回答的研究問題：把頻率的單位從單一位點換成多位點的單倍型，
        重建出來的演化樹會不會不一樣。
        讀法是：兩張圖的橫軸都是頻率，換掉的是「被數的那個東西」。</desc>

  <text class="ttl zh" x="20" y="36">頻率的單位換掉會怎樣？</text>
  <text class="anno zh" x="20" y="64">兩邊都是頻率直方圖，橫軸都是頻率。換掉的是<tspan class="bold">「一個數字代表什麼」</tspan>。</text>

  <!-- ══ 左：VAF 頻率譜 ══ -->
  <rect class="box ghost" x="24" y="84" width="468" height="436" rx="8"/>
  <text class="lbl bold zh mid" x="258" y="116">VAF 頻率譜</text>
  <text class="tick zh mid" x="258" y="142">一個數字 ＝ 一個 somatic 位點的 ALT 佔比</text>

  <rect class="bar" x="62" y="204" width="28" height="96"/>
  <rect class="bar" x="95" y="220" width="28" height="80"/>
  <rect class="bar" x="128" y="232" width="28" height="68"/>
  <rect class="bar somatic" x="161" y="242" width="28" height="58"/>
  <rect class="bar" x="194" y="250" width="28" height="50"/>
  <rect class="bar" x="227" y="256" width="28" height="44"/>
  <rect class="bar" x="260" y="260" width="28" height="40"/>
  <rect class="bar" x="293" y="248" width="28" height="52"/>
  <rect class="bar" x="326" y="224" width="28" height="76"/>
  <rect class="bar" x="359" y="256" width="28" height="44"/>
  <rect class="bar" x="392" y="274" width="28" height="26"/>
  <rect class="bar" x="425" y="286" width="28" height="14"/>
  <line class="axis" x1="56" y1="300" x2="462" y2="300"/>

  <text class="tick mid" x="62" y="320">0</text>
  <text class="tick mid somatic" x="161" y="320">0.15</text>
  <text class="tick mid" x="260" y="320">0.3</text>
  <text class="tick mid" x="359" y="320">0.45</text>
  <text class="tick mid" x="458" y="320">0.6</text>

  <text class="tick zh mid somatic" x="258" y="350">↑ S2 與 S3 的 VAF 都是 0.15，落進同一格</text>

  <line class="guide" x1="48" y1="372" x2="468" y2="372"/>

  <text class="anno bold zh" x="48" y="400">位點的 VAF 是<tspan class="bad">邊際</tspan></text>
  <text class="tick zh" x="48" y="428">它把所有帶這個變異的細胞混在一起，</text>
  <text class="tick zh" x="48" y="450">不管那些細胞還帶了什麼。</text>

  <text class="tick zh bad" x="48" y="480">分群會把 S2 與 S3 判成同一群 ——</text>
  <text class="tick zh bad" x="48" y="502">但它們其實分屬完全不同的譜系。</text>

  <!-- ══ 右：單倍型頻率譜 ══ -->
  <rect class="box ghost ok" x="508" y="84" width="468" height="436" rx="8"/>
  <text class="lbl bold zh mid" x="742" y="116">單倍型頻率譜</text>
  <text class="tick zh mid" x="742" y="142">一個數字 ＝ 一條單倍型佔的分子比例</text>

  <text class="tick mono" x="532" y="188">HP1</text>
  <text class="tick mono end" x="716" y="188">0.30</text>
  <rect class="bar hp1" x="730" y="178" width="108" height="13" rx="2"/>

  <text class="tick mono" x="552" y="216">└ HP1-1</text>
  <text class="tick mono end" x="716" y="216">0.20</text>
  <rect class="bar hp1" x="730" y="206" width="72" height="13" rx="2"/>

  <text class="tick mono" x="572" y="244">└ HP1-1-1</text>
  <text class="tick mono end somatic" x="716" y="244">0.15</text>
  <rect class="bar hp1" x="730" y="234" width="54" height="13" rx="2"/>

  <text class="tick mono" x="532" y="280">HP2</text>
  <text class="tick mono end" x="716" y="280">0.20</text>
  <rect class="bar hp2" x="730" y="270" width="72" height="13" rx="2"/>

  <text class="tick mono" x="552" y="308">└ HP2-1</text>
  <text class="tick mono end somatic" x="716" y="308">0.15</text>
  <rect class="bar hp2" x="730" y="298" width="54" height="13" rx="2"/>

  <text class="tick zh mid somatic" x="742" y="350">同樣有兩個 0.15，但分屬 HP1 與 HP2 兩個分支</text>

  <line class="guide" x1="532" y1="372" x2="952" y2="372"/>

  <text class="anno bold zh" x="532" y="400">單倍型的頻率是<tspan class="ok">聯合</tspan></text>
  <text class="tick zh" x="532" y="428">一條單倍型是一組變異的特定組合，</text>
  <text class="tick zh" x="532" y="450">所以它只數帶著那個組合的分子。</text>

  <text class="tick zh ok" x="532" y="480">標籤本身帶著層級：HP1-1-1 ⊂ HP1-1 ⊂ HP1，</text>
  <text class="tick zh ok" x="532" y="502">每個數字對應一群真實的細胞。</text>

  <!-- ══ 研究問題 ══ -->
  <rect class="box accent" x="24" y="544" width="952" height="90" rx="8"/>
  <text class="anno bold zh" x="48" y="576">研究問題：把頻率的單位從<tspan class="bad">單一位點</tspan>換成<tspan class="ok">多位點的單倍型</tspan>，重建出來的樹會不會不一樣？</text>
  <text class="anno zh" x="48" y="604">左邊那一格裡的兩個 0.15 會被分開嗎？分開之後，樹的形狀會不會跟著變？</text>
  <text class="tick zh" x="48" y="626">同一顆腫瘤兩種都算得出來，所以這件事是可以直接比的。</text>
</svg>
