<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700">
  <title>同一組 SNV，兩種頻率譜：VAF 譜留下兩棵樹，單倍型頻率譜只剩一棵</title>
  <desc>同一個區域、同一組六個 somatic SNV，兩種把它們整理成直方圖的方式，橫軸都是頻率。
        這個區域的分子組成是：四成五沒有任何體細胞變異，三成五帶著 A、B、C 三個變異，
        兩成帶著 D、E、F 三個變異，而且沒有任何一條分子同時帶著這兩組。
        左邊是 VAF 頻率譜：每一個數字來自一個位點，所以六個 SNV 給出六個點。
        A、B、C 的 VAF 都是零點三五，D、E、F 都是零點二，於是得到兩根高度為三的長條。
        讀出來是「有兩群，各佔零點三五與零點二」，
        但這兩個數字同時相容於兩棵樹：零點二可以是零點三五的後代，也可以是它的兄弟，
        因為兩種都通過那條算術檢查，所以分不出來。
        右邊是單倍型頻率譜：每一個數字來自一條單倍型，所以只有三個點，每根長條高度都是一。
        三根分別是 HP1-2 佔零點二、HP1-1 佔零點三五、HP1 佔零點四五。
        注意零點四五那一根在左邊完全不存在，因為那群細胞在這個區域沒有任何變異，
        沒有變異就沒有 VAF。
        而且標籤說明 HP1-1 與 HP1-2 都直接掛在 HP1 底下，是兄弟不是祖孫，
        於是分支那棵樹是唯一解。
        最下方點出兩個根本差別：左邊每根長條數的是變異，右邊數的是細胞群；
        左邊的頻率是邊際，右邊的頻率帶著隸屬關係。
        讀法是：同一組 SNV，換掉頻率的單位之後，連樹的形狀都跟著定下來了。</desc>

  <text class="ttl zh" x="20" y="36">同一組 SNV，兩種頻率譜</text>
  <text class="anno zh" x="20" y="64">一個區域、六個 somatic SNV。組成：<tspan class="mono">45%</tspan> 沒有變異、<tspan class="mono">35%</tspan> 帶 A B C、<tspan class="mono">20%</tspan> 帶 D E F，且沒有分子同時帶兩組。</text>

  <!-- ══ 左：VAF 頻率譜 ══ -->
  <rect class="box ghost" x="24" y="84" width="468" height="530" rx="8"/>
  <text class="lbl bold zh mid" x="258" y="116">VAF 頻率譜</text>
  <text class="tick zh mid" x="258" y="140">每一根：有幾個<tspan class="bold">變異</tspan>落在這個頻率</text>

  <text class="tick mono mid" x="218" y="180">D E F</text>
  <text class="tick mono mid" x="329" y="180">A B C</text>
  <rect class="bar somatic" x="203" y="188" width="30" height="102"/>
  <rect class="bar somatic" x="314" y="188" width="30" height="102"/>
  <line class="axis" x1="62" y1="290" x2="450" y2="290"/>

  <text class="tick mid" x="70" y="310">0</text>
  <text class="tick mid" x="218" y="310">0.2</text>
  <text class="tick mid" x="329" y="310">0.35</text>
  <text class="tick mid" x="403" y="310">0.45</text>

  <text class="tick zh mid" x="258" y="338">六個 SNV → 六個點，堆成兩根</text>

  <line class="guide" x1="48" y1="358" x2="468" y2="358"/>

  <text class="anno bold zh" x="48" y="386">讀出來：有兩群，0.35 與 0.20</text>
  <text class="tick zh" x="48" y="414">但這兩個數字同時相容於兩棵樹 ——</text>
  <text class="tick mono" x="48" y="438">0.20 ≤ 0.35 ✓　　0.35 + 0.20 ≤ 1 ✓</text>

  <text class="tick zh mid" x="150" y="472">後代</text>
  <circle class="mark ref" cx="150" cy="492" r="8"/>
  <line class="conn" x1="150" y1="500" x2="150" y2="516"/>
  <circle class="mark somatic" cx="150" cy="524" r="8"/>
  <line class="conn" x1="150" y1="532" x2="150" y2="548"/>
  <circle class="mark somatic" cx="150" cy="556" r="8"/>
  <text class="lbl bold ok" x="184" y="528">✓</text>

  <text class="tick zh mid" x="370" y="472">兄弟</text>
  <circle class="mark ref" cx="370" cy="492" r="8"/>
  <line class="conn" x1="362" y1="500" x2="342" y2="518"/>
  <line class="conn" x1="378" y1="500" x2="398" y2="518"/>
  <circle class="mark somatic" cx="336" cy="526" r="8"/>
  <circle class="mark somatic" cx="404" cy="526" r="8"/>
  <text class="lbl bold ok" x="428" y="528">✓</text>

  <text class="anno zh bad mid" x="258" y="594">兩棵都通過 —— 分不出來</text>

  <!-- ══ 右：單倍型頻率譜 ══ -->
  <rect class="box ghost ok" x="508" y="84" width="468" height="530" rx="8"/>
  <text class="lbl bold zh mid" x="742" y="116">單倍型頻率譜</text>
  <text class="tick zh mid" x="742" y="140">每一根：有幾<tspan class="bold">條單倍型</tspan>落在這個頻率</text>

  <text class="tick mono mid" x="702" y="248">HP1-2</text>
  <text class="tick mono mid" x="813" y="248">HP1-1</text>
  <text class="tick mono mid" x="887" y="248">HP1</text>
  <rect class="bar hp1" x="687" y="256" width="30" height="34"/>
  <rect class="bar hp1" x="798" y="256" width="30" height="34"/>
  <rect class="bar hp1" x="872" y="256" width="30" height="34"/>
  <line class="axis ok" x1="546" y1="290" x2="934" y2="290"/>

  <text class="tick mid" x="554" y="310">0</text>
  <text class="tick mid" x="702" y="310">0.2</text>
  <text class="tick mid" x="813" y="310">0.35</text>
  <text class="tick mid" x="887" y="310">0.45</text>

  <text class="tick zh mid" x="742" y="338">三條單倍型 → 三個點，每根高度都是 1</text>

  <line class="guide" x1="532" y1="358" x2="952" y2="358"/>

  <text class="anno bold zh" x="532" y="386">讀出來：三條，0.45 / 0.35 / 0.20</text>
  <text class="tick zh" x="532" y="414">標籤說明 HP1-1 與 HP1-2 都掛在 HP1 底下，</text>
  <text class="tick zh" x="532" y="438">而且沒有分子同時帶 A B C 與 D E F。</text>

  <text class="tick zh mid" x="634" y="472">後代</text>
  <circle class="mark ref" cx="634" cy="492" r="8"/>
  <line class="conn bad" x1="634" y1="500" x2="634" y2="516"/>
  <circle class="mark somatic" cx="634" cy="524" r="8"/>
  <line class="conn bad" x1="634" y1="532" x2="634" y2="548"/>
  <circle class="box ghost bad" cx="634" cy="556" r="8"/>
  <text class="lbl bold bad" x="668" y="528">✗</text>

  <text class="tick zh mid" x="854" y="472">兄弟</text>
  <circle class="mark ref" cx="854" cy="492" r="8"/>
  <line class="conn" x1="846" y1="500" x2="826" y2="518"/>
  <line class="conn" x1="862" y1="500" x2="882" y2="518"/>
  <circle class="mark somatic" cx="820" cy="526" r="8"/>
  <circle class="mark somatic" cx="888" cy="526" r="8"/>
  <text class="lbl bold ok" x="912" y="528">✓</text>

  <text class="anno zh ok mid" x="742" y="594">只剩一棵 —— 樹定下來了</text>

  <!-- ══ 兩個根本差別 ══ -->
  <rect class="box accent" x="24" y="634" width="952" height="60" rx="8"/>
  <text class="anno zh" x="48" y="662">① 左側每根長條計數的是<tspan class="bold">變異</tspan>，右側計數的是<tspan class="bold">細胞群</tspan>。0.45 一根在左側無法繪出 —— 無變異即無 VAF。</text>
  <text class="anno zh" x="48" y="686">② 左邊的頻率是邊際，右邊的頻率<tspan class="bold">帶著隸屬關係</tspan>，所以「兄弟還是祖孫」不必再猜。</text>
</svg>
