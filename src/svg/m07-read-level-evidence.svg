  <line class="axis" x1="20" y1="592" x2="980" y2="592"/>
  <text class="anno zh bold" x="20" y="620">這個判準不需要配對正常樣本，只需要 read 夠長 —— 所以它是 tumour-only 拿得到的替代證據。</text>
  <text class="anno zh" x="20" y="648">但它有例外：真的發生兩次獨立突變，或 phasing 本身出錯時都會失效，所以只能當補充證據。</text>
  <text class="anno zh" x="20" y="676">LongPhase-S 把它實作成 read-level 與 haplotype origin 兩個過濾器，門檻與細節見 M12。</text>
