  <text class="base g mono" x="170" y="393" font-size="15">G</text>
  <text class="base g mono" x="265" y="393" font-size="15">G</text>
  <text class="base a mono" x="360" y="393" font-size="15">A</text>
  <text class="tick end bold hp1" x="102" y="238">HP1</text>
  <text class="tick end bold hp2" x="102" y="346">HP2</text>
  <text class="tick end zh" x="102" y="260">6 條</text>
  <text class="tick end zh" x="102" y="368">6 條</text>
  <text class="tick zh" x="44" y="418">支持這個候選的 read：4 條，VAF = 4/12 = 0.33</text>
  <text class="tick zh bold" x="44" y="440">其中 HP1：4 條　　HP2：0 條</text>
  <rect class="box ok" x="44" y="456" width="422" height="48" rx="8"/>
  <text class="anno mid bold zh ok" x="255" y="486">所有支持 read 都在同一條 haplotype 上</text>
  <text class="tick zh" x="44" y="526">一次體細胞突變只會發生在一條染色體上，</text>
  <text class="tick zh" x="44" y="548">所以這個分布跟真的 somatic 相容。</text>

