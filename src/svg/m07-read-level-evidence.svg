<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700">
  <title>沒有正常組織時，改看支持 read 落在哪一條 haplotype 上</title>
  <desc>兩欄的支持 read 總數刻意設成完全一樣：12 條 read 裡有 4 條帶著這個候選變異，
        VAF 都是 0.33。光看數量分不出來，要看這 4 條落在哪裡。
        左欄的 4 條全部同時帶著 HP1 的 germline allele，也就是這個變異只出現在一條染色體上 ——
        跟「一次體細胞突變從一條既有 haplotype 長出來」相容。
        右欄的 4 條有 2 條帶 HP1 的 allele、2 條帶 HP2 的 allele，等於同一個位置在兩條染色體上
        各獨立發生了一次一樣的突變，機率極低，更像比對或定序造成的問題。
        這個判準不需要配對正常樣本，只需要同一條 read 上同時看得到 germline 錨點與候選位置，
        所以它是 long read 才拿得到的證據。但它有例外：真的發生兩次獨立突變，或 phasing 本身出錯時，
        判斷都會失效，因此只能作為補充證據。</desc>

  <text class="lbl bold zh" x="16" y="36">兩邊的支持 read 一樣多 —— 分得出來的是它們的分布</text>
  <text class="anno zh" x="16" y="60">同一條 long read 上同時看得到 germline 錨點與候選位置，才問得出「這個變異在哪一條上」。</text>

  <!-- 真的 somatic 變異 -->
  <rect class="box ok" x="20" y="76" width="470" height="484" rx="10"/>
  <text class="anno bold zh somatic" x="44" y="106">真的 somatic 變異</text>
  <text class="anno zh" x="44" y="128">4 條支持 read 全在 HP1</text>
  <circle class="mark somatic" cx="265" cy="140" r="8"/>
  <text class="tick mid zh" x="170" y="164">germline 錨點</text>
  <text class="tick mid zh" x="265" y="164">候選位置</text>
  <text class="tick mid zh" x="360" y="164">germline 錨點</text>
  <rect class="read hp1" x="110" y="190" width="310" height="12" rx="6"/>
