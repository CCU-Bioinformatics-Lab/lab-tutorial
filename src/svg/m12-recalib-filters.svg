<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 780">
  <title>purity 感知的四個重校準過濾器</title>
  <desc>四個過濾器各看一種證據。
        第一個 TINC 過濾器看這個位點在 normal 樣本裡的變異頻率：真 somatic 幾乎是零，
        偏高的多半是 germline 變異，門檻隨 purity 調整。
        第二個 read 一致性過濾器看每條支持 read 兩側的 germline allele：
        若一條 read 同時帶有 HP1 與 HP2 的 allele，就是混合 read，混合比例太高就丟掉。
        第三個 haplotype 背景過濾器統計支持 read 分別來自哪一條 germline haplotype：
        真變異集中在其中一邊，兩邊都超過門檻就丟掉。
        第四個變異叢集過濾器看密集區間內的變異是否共同出現在同一批 read 上，
        需要同時滿足低變異頻率、低支持數、區間內變異數足夠多與統計異常四個條件才丟掉。
        四個過濾器的門檻都不是固定值，而是在每個 purity 級距上各自搜出一組。</desc>

  <text class="lbl bold zh" x="20" y="32">四個過濾器，各看一種證據</text>
  <text class="tick zh" x="20" y="58">共同點：都在問「支持這個候選的 read，來源夠不夠一致」。任何一個沒過就丟掉。</text>

  <rect class="box plain" x="16" y="80" width="480" height="290" rx="10"/>
  <text class="anno bold zh" x="40" y="110">① TINC 過濾器</text>
  <text class="tick zh" x="40" y="134">看這個位點在 <tspan class="bold">normal 樣本</tspan>裡的 VAF</text>
  <line class="axis" x1="60" y1="250" x2="452" y2="250"/>
  <text class="tick" x="60" y="272">0</text>
  <text class="tick mid" x="256" y="272">0.25</text>
  <text class="tick end" x="452" y="272">0.5</text>
  <circle class="pt tp" cx="66" cy="236" r="5"/>
  <circle class="pt tp" cx="72" cy="236" r="5"/>
  <circle class="pt tp" cx="78" cy="236" r="5"/>
  <circle class="pt tp" cx="86" cy="212" r="5"/>
  <circle class="pt tp" cx="94" cy="224" r="5"/>
  <circle class="pt tp" cx="100" cy="224" r="5"/>
  <circle class="pt fp" cx="300" cy="236" r="5"/>
  <circle class="pt fp" cx="330" cy="216" r="5"/>
  <circle class="pt fp" cx="352" cy="236" r="5"/>
  <circle class="pt fp" cx="380" cy="236" r="5"/>
  <circle class="pt fp" cx="408" cy="236" r="5"/>
  <circle class="pt fp" cx="436" cy="236" r="5"/>
  <line class="guide" x1="180" y1="164" x2="180" y2="250" style="stroke-dasharray:6 4"/>
  <text class="tick zh somatic bold" x="190" y="178">門檻（隨 purity 動）</text>
  <text class="tick zh somatic" x="60" y="300">真 somatic：normal 幾乎沒有</text>
  <text class="tick zh artifact" x="60" y="324">偏高的多半是 germline</text>
  <text class="tick zh bold" x="60" y="352">normal VAF 低於門檻 → 留下</text>

  <rect class="box plain" x="504" y="80" width="480" height="290" rx="10"/>
  <text class="anno bold zh" x="528" y="110">② read 一致性過濾器</text>
  <text class="tick zh" x="528" y="134">看支持 read 兩側的 germline allele</text>
  <text class="tick zh ok bold" x="528" y="164">真變異：每條 read 只帶一邊的 allele</text>
  <rect class="read hp1" x="548" y="176" width="180" height="13" rx="6.5"/>
  <text class="base t mono mid" x="574" y="186" style="font-size:13px">T</text>
  <text class="base c mono mid" x="702" y="186" style="font-size:13px">C</text>
  <circle class="mark somatic" cx="638" cy="182.5" r="5"/>
  <rect class="read hp1" x="548" y="198" width="180" height="13" rx="6.5"/>
  <text class="base t mono mid" x="574" y="208" style="font-size:13px">T</text>
  <text class="base c mono mid" x="702" y="208" style="font-size:13px">C</text>
  <circle class="mark somatic" cx="638" cy="204.5" r="5"/>
  <rect class="read hp1" x="548" y="220" width="180" height="13" rx="6.5"/>
  <text class="base t mono mid" x="574" y="230" style="font-size:13px">T</text>
  <text class="base c mono mid" x="702" y="230" style="font-size:13px">C</text>
  <circle class="mark somatic" cx="638" cy="226.5" r="5"/>
  <text class="tick mono ok" x="742" y="200">Rmix ≈ 0</text>
  <text class="tick zh bad bold" x="528" y="268">假訊號：同一條 read 兩邊的 allele 都有</text>
  <rect class="read hp0" x="548" y="280" width="180" height="13" rx="6.5"/>
  <text class="base t mono mid" x="574" y="290" style="font-size:13px">T</text>
  <text class="base g mono mid" x="702" y="290" style="font-size:13px">G</text>
  <circle class="mark artifact" cx="638" cy="286.5" r="5"/>
  <rect class="read hp0" x="548" y="302" width="180" height="13" rx="6.5"/>
  <text class="base t mono mid" x="574" y="312" style="font-size:13px">T</text>
  <text class="base g mono mid" x="702" y="312" style="font-size:13px">G</text>
  <circle class="mark artifact" cx="638" cy="308.5" r="5"/>
  <rect class="read hp0" x="548" y="324" width="180" height="13" rx="6.5"/>
  <text class="base t mono mid" x="574" y="334" style="font-size:13px">T</text>
  <text class="base g mono mid" x="702" y="334" style="font-size:13px">G</text>
  <circle class="mark artifact" cx="638" cy="330.5" r="5"/>
  <text class="tick mono bad" x="742" y="304">Rmix 很高</text>
  <text class="tick zh bold" x="528" y="352">混合 read 的比例低於門檻 → 留下</text>

  <rect class="box plain" x="16" y="390" width="480" height="300" rx="10"/>
  <text class="anno bold zh" x="40" y="420">③ haplotype 背景過濾器</text>
  <text class="tick zh" x="40" y="444">支持 read 分別來自哪一條 germline haplotype</text>
  <line class="axis" x1="120" y1="640" x2="330" y2="640"/>
  <line class="axis" x1="120" y1="640" x2="120" y2="470"/>
  <text class="tick zh hp1" x="180" y="662">來自 HP1 的支持數 →</text>
  <text class="tick zh hp2" x="40" y="466">↑ 來自 HP2</text>
  <line class="guide" x1="120" y1="560" x2="330" y2="560" style="stroke-dasharray:6 4"/>
  <line class="guide" x1="220" y1="470" x2="220" y2="640" style="stroke-dasharray:6 4"/>
  <circle class="pt tp" cx="150" cy="634" r="5"/>
  <circle class="pt tp" cx="180" cy="630" r="5"/>
  <circle class="pt tp" cx="210" cy="636" r="5"/>
  <circle class="pt tp" cx="260" cy="632" r="5"/>
  <circle class="pt tp" cx="300" cy="628" r="5"/>
  <circle class="pt tp" cx="126" cy="600" r="5"/>
  <circle class="pt tp" cx="128" cy="560" r="5"/>
  <circle class="pt tp" cx="126" cy="520" r="5"/>
  <circle class="pt tp" cx="130" cy="490" r="5"/>
  <circle class="pt fp" cx="256" cy="540" r="5"/>
  <circle class="pt fp" cx="280" cy="512" r="5"/>
  <circle class="pt fp" cx="300" cy="530" r="5"/>
  <circle class="pt fp" cx="270" cy="496" r="5"/>
  <text class="tick zh ok" x="350" y="620">真變異貼在軸上：</text>
  <text class="tick zh ok" x="350" y="644">只有一邊有支持</text>
  <text class="tick zh bad" x="350" y="520">假訊號落在中間：</text>
  <text class="tick zh bad" x="350" y="544">兩邊都有支持</text>
  <text class="tick zh bold" x="40" y="686">兩邊都超過門檻 → 丟掉</text>

  <rect class="box plain" x="504" y="390" width="480" height="300" rx="10"/>
  <text class="anno bold zh" x="528" y="420">④ 變異叢集過濾器</text>
  <text class="tick zh" x="528" y="444">看密集區間內的變異是否擠在同一批 read 上</text>
  <line class="axis" x1="548" y1="612" x2="944" y2="612"/>
  <text class="tick mid zh" x="686" y="634">同一個密集區間（預設 100 bp 內）</text>
  <rect class="read hp0" x="548" y="470" width="300" height="13" rx="6.5"/>
  <circle class="mark artifact" cx="620" cy="476.5" r="4.5"/>
  <circle class="mark artifact" cx="680" cy="476.5" r="4.5"/>
  <circle class="mark artifact" cx="740" cy="476.5" r="4.5"/>
  <rect class="read hp0" x="548" y="492" width="300" height="13" rx="6.5"/>
  <circle class="mark artifact" cx="620" cy="498.5" r="4.5"/>
  <circle class="mark artifact" cx="680" cy="498.5" r="4.5"/>
  <circle class="mark artifact" cx="740" cy="498.5" r="4.5"/>
  <rect class="read hp0" x="548" y="514" width="300" height="13" rx="6.5"/>
  <circle class="mark artifact" cx="620" cy="520.5" r="4.5"/>
  <circle class="mark artifact" cx="680" cy="520.5" r="4.5"/>
  <circle class="mark artifact" cx="740" cy="520.5" r="4.5"/>
  <rect class="read hp0" x="548" y="536" width="300" height="13" rx="6.5"/>
  <circle class="mark artifact" cx="620" cy="542.5" r="4.5"/>
  <circle class="mark artifact" cx="680" cy="542.5" r="4.5"/>
  <circle class="mark artifact" cx="740" cy="542.5" r="4.5"/>
  <text class="tick zh bad" x="864" y="490">同一批 read 上</text>
  <text class="tick zh bad" x="864" y="514">同時帶好幾個</text>
  <rect class="read hp1" x="548" y="566" width="300" height="13" rx="6.5"/>
  <circle class="mark somatic" cx="680" cy="572.5" r="4.5"/>
  <rect class="read hp1" x="568" y="588" width="300" height="13" rx="6.5"/>
  <circle class="mark somatic" cx="680" cy="594.5" r="4.5"/>
  <text class="tick zh ok" x="878" y="578">真變異散在</text>
  <text class="tick zh ok" x="878" y="602">不同 read 上</text>
  <rect class="region bad" x="596" y="462" width="180" height="150" rx="4"/>
  <text class="tick zh bold" x="528" y="660">四個條件同時成立才丟：VAF 低、支持數少、</text>
  <text class="tick zh bold" x="528" y="684">區間內變異夠多、共現統計異常</text>

  <line class="axis" x1="20" y1="712" x2="980" y2="712"/>
  <text class="lbl bold zh" x="20" y="744">四個門檻都不是固定值。</text>
  <text class="anno zh" x="20" y="772">每個 purity 級距各自搜一組：先全域隨機取樣找大概位置，再用網格搜尋在附近細調。</text>
</svg>
