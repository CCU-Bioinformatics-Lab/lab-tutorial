<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 990">
  <title>三份證據如何把相容的候選樹砍到只剩一棵：頻率譜給一棵部分決定的樹，兩個單位各給一個局部拓撲</title>
  <desc>本圖延續前一個數值例，純度零點六、二倍體，A、B、C 的細胞比例是一點零零、
        零點四零、零點四零，另加第四群 D，細胞比例零點二零，是 B 的後代。
        上排是三份證據各自說了什麼。
        第一份是 VAF 頻率譜。換算後只得到三群：一點零零、零點四零、零點二零，
        其中零點四零那一群可能是兩群被併起來的。
        依 pigeonhole 檢查，這三群能排出的樹有兩棵，圖上並排畫出：
        一棵是 A 到 X 再到 D 的線性樹，一棵是 A 同時接到 X 與 D 的分支樹，兩棵都合法。
        取兩棵的共同部分，就是頻率譜真正確定的東西：A 是根，X 在 A 之下。
        未定的有兩件：D 掛在 A 之下還是掛在 X 之下，以及 X 是一群還是兩群。
        所以頻率譜給的是一棵部分決定的樹，不是一棵完整的樹。
        第二份是單位甲。它含有兩個變異 i 與 j，觀測到沒有分子同時帶有兩者，
        所以兩者分屬兩群 P 與 Q，而且兩群互不包含。
        這同時做了兩件事：把群數由三修正為四，並指出 P 與 Q 誰都不是誰的祖先。
        第三份是單位乙。它含有兩個變異 p 與 q，觀測到帶 q 的分子全部也帶 p，
        所以 q 所在的群巢狀於 p 所在的群之內，另附零點五零的比值。
        中排說明目標函數的兩項各自負責什麼、又各自不負責什麼。
        左邊是 beta 二項混合這一項，圖上畫的是三根峰各自的成分曲線：
        中心由細胞比例決定，寬度是用途二量出來的常數，高度是該群所佔的變異比例。
        這一項回答的是某個變異的讀數比較像哪一根峰，
        它對峰與峰之間誰在誰之下完全沒有意見。
        右邊是約束這一項，它把甲寫成兩個變異不可同群，把乙寫成樹上的一條有向邊。
        這一項回答的是哪些變異不能同群、以及誰在誰之下，
        它對峰落在哪裡完全沒有意見。
        兩項回答的問題不重疊，這正是合起來能補齊、而任一邊單獨補不齊的原因。
        下排是候選樹的數量如何被砍下來。只用頻率譜時群數估成三，候選兩棵，
        而且群數本身是錯的。加入甲之後群數修正為四；在四群的狀態空間裡
        若沒有任何關係約束，候選會有七棵，甲的互不包含把它砍成三棵。
        再加入乙的巢狀關係，候選只剩一棵，也就是最右邊那棵樹。
        最後標注：樹的形狀是唯一的，但那兩群頻率相同，
        所以它們的標號可以整組對調，編號本來就是任意的。</desc>

  <text class="ttl zh" x="20" y="38">三份證據，各補上樹的一部分</text>
  <text class="anno zh" x="20" y="66">延續前例：ρ ＝ 0.60、二倍體、μ ＝ 1；A ＝ 1.00、B ＝ C ＝ 0.40，另加 D ＝ 0.20（B 的後代）。</text>
  <line class="axis" x1="20" y1="86" x2="980" y2="86"/>

  <!-- ═══════════ ① 頻率譜 → 部分決定的樹 ═══════════ -->
  <text class="lbl bold zh bad" x="20" y="118">① 頻率譜給的：<tspan class="bold">部分</tspan>的樹</text>
  <rect class="box bad" x="20" y="134" width="310" height="330" rx="8"/>

  <text class="tick zh" x="36" y="164">換算後得到三群：</text>
  <text class="tick mono" x="36" y="190">c ＝ 1.00 ／ 0.40 ／ 0.20</text>
  <text class="tick zh bad" x="36" y="212">（0.40 那一群可能是兩群併起來的）</text>

  <text class="tick zh" x="36" y="244">pigeonhole 檢查後，<tspan class="bold">兩棵都合法</tspan>：</text>

  <circle class="mark germline" cx="95" cy="272" r="13"/><text class="tick mid" x="95" y="278">A</text>
  <path class="conn" d="M95,285 L95,301" marker-end="url(#arrow-sm)"/>
  <circle class="mark ref" cx="95" cy="312" r="13"/><text class="tick mid" x="95" y="318">X</text>
  <path class="conn" d="M95,325 L95,341" marker-end="url(#arrow-sm)"/>
  <circle class="mark artifact" cx="95" cy="352" r="13"/><text class="tick mid" x="95" y="358">D</text>
  <text class="tick bold mid" x="95" y="380">線性</text>

  <line class="guide muted" x1="170" y1="260" x2="170" y2="368"/>

  <circle class="mark germline" cx="245" cy="272" r="13"/><text class="tick mid" x="245" y="278">A</text>
  <path class="conn" d="M236,282 L222,302" marker-end="url(#arrow-sm)"/>
  <path class="conn" d="M254,282 L268,302" marker-end="url(#arrow-sm)"/>
  <circle class="mark ref" cx="215" cy="314" r="13"/><text class="tick mid" x="215" y="320">X</text>
  <circle class="mark artifact" cx="275" cy="314" r="13"/><text class="tick mid" x="275" y="320">D</text>
  <text class="tick bold mid" x="245" y="380">分支</text>

  <text class="tick bold zh ok" x="36" y="410">✓ 已定：A 是根、X 在 A 之下</text>
  <text class="tick bold zh bad" x="36" y="432">✗ 未定：D 掛在 A 還是 X 之下</text>
  <text class="tick bold zh bad" x="36" y="454">✗ 未定：X 是一群，還是兩群</text>

  <!-- ═══════════ ② 單位甲 ═══════════ -->
  <text class="lbl bold zh ok" x="350" y="118">② 單位甲給的：<tspan class="bold">分岔</tspan></text>
  <rect class="box ok" x="350" y="134" width="310" height="330" rx="8"/>

  <text class="tick zh" x="366" y="164">兩個變異 i、j 落在同一個單位</text>
  <rect class="read hp1" x="366" y="178" width="112" height="13" rx="6"/>
  <circle class="mark somatic" cx="390" cy="184" r="5"/>
  <rect class="read hp2" x="366" y="198" width="112" height="13" rx="6"/>
  <circle class="mark somatic" cx="454" cy="204" r="5"/>
  <text class="tick" x="488" y="189">帶 i 不帶 j</text>
  <text class="tick" x="488" y="209">帶 j 不帶 i</text>
  <rect class="box ghost bad" x="362" y="220" width="286" height="30" rx="6"/>
  <text class="tick bold zh mid bad" x="505" y="240">沒有任何分子同時帶有兩者</text>

  <text class="tick zh" x="366" y="286">局部拓撲：</text>
  <text class="tick mid bad" x="515" y="286">互不包含</text>
  <circle class="mark hp1" cx="470" cy="316" r="15"/><text class="tick mid" x="470" y="322">P</text>
  <circle class="mark hp2" cx="560" cy="316" r="15"/><text class="tick mid" x="560" y="322">Q</text>
  <path class="conn bad" d="M488,316 L542,316"/>
  <path class="conn bad" d="M505,306 L525,326"/>

  <text class="tick bold zh ok" x="366" y="378">它同時做了兩件事：</text>
  <text class="tick zh" x="366" y="410">① 把 0.40 那一群拆開 → 群數 3 修正為 <tspan class="bold">4</tspan></text>
  <text class="tick zh" x="366" y="440">② 指出 P 與 Q <tspan class="bold">誰都不是誰的祖先</tspan></text>

  <!-- ═══════════ ③ 單位乙 ═══════════ -->
  <text class="lbl bold zh ok" x="680" y="118">③ 單位乙給的：<tspan class="bold">一條線</tspan></text>
  <rect class="box ok" x="680" y="134" width="300" height="330" rx="8"/>

  <text class="tick zh" x="696" y="164">兩個變異 p、q 落在同一個單位</text>
  <rect class="read hp1" x="696" y="178" width="112" height="13" rx="6"/>
  <circle class="mark somatic" cx="720" cy="184" r="5"/>
  <rect class="read hp1" x="696" y="198" width="112" height="13" rx="6"/>
  <circle class="mark somatic" cx="720" cy="204" r="5"/>
  <circle class="mark artifact" cx="784" cy="204" r="5"/>
  <text class="tick" x="818" y="189">只帶 p</text>
  <text class="tick" x="818" y="209">p、q 都帶</text>
  <rect class="box ghost ok" x="692" y="220" width="276" height="30" rx="6"/>
  <text class="tick bold zh mid ok" x="830" y="240">帶 q 的分子<tspan class="bold">全部</tspan>也帶 p</text>

  <text class="tick zh" x="696" y="286">局部拓撲：</text>
  <circle class="mark hp1" cx="830" cy="292" r="15"/><text class="tick mid" x="830" y="298">P</text>
  <path class="conn thick" d="M830,308 L830,332" marker-end="url(#arrow-sm)"/>
  <circle class="mark artifact" cx="830" cy="346" r="15"/><text class="tick mid" x="830" y="352">D</text>

  <text class="tick bold zh ok" x="696" y="410">D <tspan class="bold">巢狀</tspan>在 0.40 的其中一群之內</text>
  <text class="tick zh" x="696" y="440">另附比值 ϱ ＝ 0.50（不需純度）</text>

  <!-- ═══════════ 目標函數的兩項 ═══════════ -->
  <line class="axis" x1="20" y1="496" x2="980" y2="496"/>
  <text class="lbl bold zh" x="20" y="530">目標函數的兩項，各自只回答一半的問題</text>

  <rect class="box sunken" x="20" y="546" width="470" height="204" rx="8"/>
  <text class="lbl bold zh" x="40" y="578">第一項｜beta-binomial 混合</text>

  <line class="axis" x1="52" y1="656" x2="316" y2="656"/>
  <path class="conn muted" d="M70,656 C80,618 90,618 100,656"/>
  <path class="conn muted" d="M120,656 C136,584 154,584 170,656"/>
  <path class="conn muted" d="M232,656 C244,602 256,602 268,656"/>
  <text class="tick mono mid" x="85"  y="674">0.06</text>
  <text class="tick mono mid" x="145" y="674">0.12</text>
  <text class="tick mono mid" x="250" y="674">0.30</text>
  <circle class="mark somatic" cx="152" cy="656" r="6"/>
  <text class="tick mid somatic" x="176" y="696">某個變異 a／d ＝ 6／50</text>

  <text class="tick" x="332" y="606">中心 ＝ ρ·c／2</text>
  <text class="tick" x="332" y="630">寬度 ＝ 用途二量到的</text>
  <text class="tick" x="332" y="654">高度 ＝ 該群的變異占比</text>

  <text class="tick bold zh bad" x="40" y="716">它<tspan class="bold">只</tspan>回答：這個變異的讀數比較像哪一根峰。</text>
  <text class="tick bold zh bad" x="40" y="738">峰之間誰在誰之下，它<tspan class="bold">沒有意見</tspan>。</text>

  <rect class="box sunken" x="510" y="546" width="470" height="204" rx="8"/>
  <text class="lbl bold zh" x="530" y="578">第二項｜約束</text>

  <text class="tick zh" x="530" y="616">甲 → 不可同群</text>
  <circle class="mark hp1" cx="566" cy="654" r="14"/><text class="tick mid" x="566" y="660">i</text>
  <text class="lbl mid bad" x="606" y="661">≠</text>
  <circle class="mark hp2" cx="646" cy="654" r="14"/><text class="tick mid" x="646" y="660">j</text>

  <text class="tick zh" x="726" y="616">乙 → 一條有向邊</text>
  <circle class="mark hp1" cx="790" cy="638" r="13"/><text class="tick mid" x="790" y="644">P</text>
  <path class="conn thick" d="M790,652 L790,672" marker-end="url(#arrow-sm)"/>
  <circle class="mark artifact" cx="790" cy="684" r="13"/><text class="tick mid" x="790" y="690">D</text>

  <text class="tick bold zh bad" x="530" y="716">它<tspan class="bold">只</tspan>回答：哪些不能同群、誰在誰之下。</text>
  <text class="tick bold zh bad" x="530" y="738">峰落在哪裡，它<tspan class="bold">沒有意見</tspan>。</text>

  <rect class="box ghost accent" x="20" y="762" width="960" height="32" rx="6"/>
  <text class="tick bold zh mid" x="500" y="783">兩項回答的問題<tspan class="bold">不重疊</tspan> —— 這正是合起來補得齊、任一邊單獨補不齊的原因。</text>

  <!-- ═══════════ 候選樹被砍到只剩一棵 ═══════════ -->
  <line class="axis" x1="20" y1="820" x2="980" y2="820"/>
  <text class="lbl bold zh" x="20" y="854">合起來：相容的候選樹被砍到只剩一棵</text>

  <rect class="box bad" x="20" y="870" width="190" height="96" rx="8"/>
  <text class="tick bold zh mid bad" x="115" y="894">只用頻率譜</text>
  <text class="lbl bold mid bad" x="115" y="926">2 棵</text>
  <text class="tick zh mid" x="115" y="952">而且 K ＝ 3 是錯的</text>

  <path class="conn thick" d="M216,918 L272,918" marker-end="url(#arrow)"/>
  <text class="tick bold zh mid" x="244" y="894">＋甲</text>

  <rect class="box warn" x="278" y="870" width="222" height="96" rx="8"/>
  <text class="tick bold zh mid warn" x="389" y="894">K 修正為 4，P ⊥ Q</text>
  <text class="lbl bold mid warn" x="389" y="926">3 棵</text>
  <text class="tick zh mid" x="389" y="952">（不加約束會是 7 棵）</text>

  <path class="conn thick" d="M506,918 L562,918" marker-end="url(#arrow)"/>
  <text class="tick bold zh mid" x="534" y="894">＋乙</text>

  <rect class="box ok" x="568" y="870" width="176" height="96" rx="8"/>
  <text class="tick bold zh mid ok" x="656" y="894">再加巢狀關係</text>
  <text class="lbl bold mid ok" x="656" y="926">1 棵</text>
  <text class="tick zh mid" x="656" y="952">唯一解</text>

  <rect class="box ok" x="762" y="870" width="218" height="96" rx="8"/>
  <circle class="mark germline" cx="812" cy="890" r="12"/><text class="tick mid" x="812" y="895">A</text>
  <path class="conn thick" d="M804,900 L786,912" marker-end="url(#arrow-sm)"/>
  <path class="conn thick" d="M820,900 L838,912" marker-end="url(#arrow-sm)"/>
  <circle class="mark hp1" cx="778" cy="921" r="12"/><text class="tick mid" x="778" y="926">P</text>
  <circle class="mark hp2" cx="846" cy="921" r="12"/><text class="tick mid" x="846" y="926">Q</text>
  <path class="conn thick" d="M778,933 L778,944" marker-end="url(#arrow-sm)"/>
  <circle class="mark artifact" cx="778" cy="952" r="12"/><text class="tick mid" x="778" y="957">D</text>
  <text class="tick zh" x="866" y="916">形狀唯一；</text>
  <text class="tick zh" x="866" y="938">P、Q 標號</text>
  <text class="tick zh" x="866" y="960">可整組對調</text>
</svg>
