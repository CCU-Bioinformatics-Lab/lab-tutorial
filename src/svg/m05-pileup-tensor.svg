  <text class="base a mono" x="208" y="210" font-size="15">A</text>
  <text class="base g mono" x="236" y="210" font-size="15">G</text>
  <text class="base c mono" x="264" y="210" font-size="15">C</text>
  <text class="base t mono" x="292" y="210" font-size="15">T</text>

  <text class="base c mono" x="124" y="234" font-size="15">C</text>
