  <text class="base c mono" x="124" y="258" font-size="15">C</text>
  <text class="base t mono" x="152" y="258" font-size="15">T</text>
  <text class="base a mono" x="180" y="258" font-size="15">A</text>
  <text class="base a mono" x="208" y="258" font-size="15">A</text>
  <text class="base g mono" x="236" y="258" font-size="15">G</text>
  <text class="base c mono" x="264" y="258" font-size="15">C</text>
  <text class="base t mono" x="292" y="258" font-size="15">T</text>

  <text class="base c mono" x="124" y="282" font-size="15">C</text>
  <text class="base t mono" x="152" y="282" font-size="15">T</text>
  <text class="base a mono" x="180" y="282" font-size="15">A</text>
  <text class="base g mono" x="208" y="282" font-size="15">G</text>
  <text class="base g mono" x="236" y="282" font-size="15">G</text>
  <text class="base c mono" x="264" y="282" font-size="15">C</text>
