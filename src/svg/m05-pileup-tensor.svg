  <text class="tick zh" x="390" y="336">深淺＝數值大小。實際通道數與定義</text>
  <text class="tick zh" x="390" y="358">依 caller 與版本而異，這裡只取四層示意</text>

  <path class="flow" d="M684,214 L704,214" marker-end="url(#arrow)"/>

  <!-- ══════════════ ③ 模型判定 ══════════════ -->
  <text class="lbl bold zh" x="712" y="44">③ 模型輸出基因型機率</text>
  <rect class="box accent" x="712" y="60" width="272" height="310" rx="10"/>

  <rect class="box plain" x="744" y="88" width="208" height="30" rx="6"/>
  <text class="tick mid zh" x="848" y="108">卷積層：找局部樣態</text>
