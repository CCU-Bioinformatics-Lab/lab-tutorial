  <text class="base t mono" x="292" y="138" font-size="15">T</text>

  <text class="base c mono" x="124" y="162" font-size="15">C</text>
  <text class="base t mono" x="152" y="162" font-size="15">T</text>
  <text class="base a mono" x="180" y="162" font-size="15">A</text>
