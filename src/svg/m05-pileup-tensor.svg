  <text class="tick zh" x="34" y="336">一列是一條 read，一欄是一個位置</text>
  <text class="tick zh" x="34" y="358">每個格子還帶著品質與股向</text>

  <path class="flow" d="M344,214 L364,214" marker-end="url(#arrow)"/>

  <!-- ══════════════ ② 多層數值 ══════════════ -->
