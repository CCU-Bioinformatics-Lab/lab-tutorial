  <text class="tick end mono" x="796" y="294">0/1</text>
  <rect class="bar germline" x="804" y="282" width="116" height="16" rx="2"/>
  <text class="tick" x="928" y="294">0.97</text>

  <text class="tick end mono" x="796" y="324">1/1</text>
