<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470">
  <title>caller 把一個位置的 read 堆疊變成多層數值，再由模型判定基因型</title>
  <desc>由左而右三步。第一步：把候選位置周圍的參考序列與覆蓋此處的 read 排成一張表，
        每一列是一條 read，每一欄是一個位置，中間那一欄是待判定的候選。
        第二步：同一張表被編碼成好幾層數值，每一層記錄一種資訊 ——
        鹼基種類、鹼基品質、比對品質、read 落在哪一股；深淺代表數值大小。
        第三步：這疊數值送進神經網路，輸出三種基因型的機率：
        兩條都是參考、一條有變異、兩條都有變異。此例的機率集中在一條有變異，即 heterozygous。
        不同 caller 的通道定義與模型結構並不相同，此圖為示意。</desc>

  <!-- ══════════════ ① read 堆疊 ══════════════ -->
  <text class="lbl bold zh" x="16" y="44">① 這個位置的 read 堆疊</text>
  <rect class="box plain" x="16" y="60" width="324" height="310" rx="10"/>

  <text class="tick mid somatic bold" x="208" y="86">候選</text>
  <text class="tick end zh" x="112" y="112">參考</text>

  <rect class="read hp0" x="118" y="126" width="204" height="14" rx="7"/>
  <rect class="read hp0" x="118" y="150" width="204" height="14" rx="7"/>
  <rect class="read hp0" x="118" y="174" width="204" height="14" rx="7"/>
  <rect class="read hp0" x="118" y="198" width="204" height="14" rx="7"/>
  <rect class="read hp0" x="118" y="222" width="204" height="14" rx="7"/>
  <rect class="read hp0" x="118" y="246" width="204" height="14" rx="7"/>
  <rect class="read hp0" x="118" y="270" width="204" height="14" rx="7"/>
  <rect class="read hp0" x="118" y="294" width="204" height="14" rx="7"/>

  <rect class="region" x="194" y="96" width="28" height="216"/>
  <rect class="box ghost" x="194" y="96" width="28" height="216" rx="4"/>

  <!-- 參考序列 -->
  <text class="base c mono" x="124" y="112" font-size="15">C</text>
  <text class="base t mono" x="152" y="112" font-size="15">T</text>
  <text class="base a mono" x="180" y="112" font-size="15">A</text>
  <text class="base a mono" x="208" y="112" font-size="15">A</text>
  <text class="base g mono" x="236" y="112" font-size="15">G</text>
  <text class="base c mono" x="264" y="112" font-size="15">C</text>
  <text class="base t mono" x="292" y="112" font-size="15">T</text>

  <!-- 八條 read：奇數列帶 G（alt），偶數列與參考相同 -->
