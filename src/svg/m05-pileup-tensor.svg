  <text class="tick" x="820" y="324">0.02</text>

  <text class="tick zh bold" x="732" y="356">此例判為 heterozygous（0/1）</text>

  <!-- ══════════════ 結論 ══════════════ -->
  <line class="axis" x1="20" y1="400" x2="980" y2="400"/>
  <text class="anno zh bold" x="20" y="432">模型看的不是「幾比幾」，而是整張帶著品質與比對資訊的畫面。</text>
  <text class="anno zh" x="20" y="460">Clair3 與 DeepVariant 都屬於這種做法，但兩者的通道定義、模型結構與訓練資料並不相同。</text>
</svg>
