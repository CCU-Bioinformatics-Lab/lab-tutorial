<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 590">
  <title>從 GHIR 分布估計 tumor purity：兩個特徵與一條迴歸曲線</title>
  <desc>上排是五個已知 purity 的合成樣本，各自把全基因體所有候選位點的 GHIR 畫成直方圖。
        purity 0.2 時分布集中在 0.5 附近；purity 越高，中位數往 1 移動；
        中間的 purity 分布最分散，purity 1.0 時又重新集中在接近 1 的高值。
        中排說明只從每個分布取兩個數字當特徵：中位數與四分位距。
        下排把這兩個數字送進二次多項式迴歸，輸出一個 purity 估計值。
        模型用七個資料集訓練、一個資料集測試，並以 leave-k-out 交叉驗證評估，
        報告的平均 R 平方約 0.96。
        限制是這條曲線只在訓練資料涵蓋的範圍內可信，
        換癌別、換 basecaller 或換覆蓋度都可能落在訓練分布之外。</desc>

  <text class="lbl bold zh" x="20" y="32">從 GHIR 分布，變成一個 purity 數字</text>
  <text class="tick zh" x="20" y="58">下面五個樣本的 purity 是已知的（用純腫瘤與正常 BAM 依比例混出來的），拿來當訓練資料。</text>

  <!-- purity 0.2 -->
  <rect class="box plain" x="16" y="76" width="176" height="176" rx="8"/>
  <text class="anno bold mid" x="104" y="102">purity 0.2</text>
  <rect class="bar hp1" x="32" y="206" width="10" height="16"/>
  <rect class="bar hp1" x="44" y="150" width="10" height="72"/>
  <rect class="bar hp1" x="56" y="126" width="10" height="96"/>
  <rect class="bar hp1" x="68" y="166" width="10" height="56"/>
  <rect class="bar hp1" x="80" y="198" width="10" height="24"/>
  <rect class="bar hp1" x="92" y="206" width="10" height="16"/>
  <rect class="bar hp1" x="104" y="214" width="10" height="8"/>
  <rect class="bar hp1" x="116" y="214" width="10" height="8"/>
  <rect class="bar hp1" x="128" y="214" width="10" height="8"/>
  <rect class="bar hp1" x="140" y="214" width="10" height="8"/>
  <rect class="bar hp1" x="152" y="214" width="10" height="8"/>
  <rect class="bar hp1" x="164" y="206" width="10" height="16"/>
  <line class="axis" x1="28" y1="222" x2="180" y2="222"/>
  <text class="tick" x="28" y="242" style="font-size:12px">0.5</text>
  <text class="tick end" x="180" y="242" style="font-size:12px">1.0</text>

  <!-- purity 0.4 -->
  <rect class="box plain" x="212" y="76" width="176" height="176" rx="8"/>
  <text class="anno bold mid" x="300" y="102">purity 0.4</text>
  <rect class="bar hp1" x="228" y="214" width="10" height="8"/>
  <rect class="bar hp1" x="240" y="182" width="10" height="40"/>
  <rect class="bar hp1" x="252" y="150" width="10" height="72"/>
  <rect class="bar hp1" x="264" y="142" width="10" height="80"/>
  <rect class="bar hp1" x="276" y="166" width="10" height="56"/>
  <rect class="bar hp1" x="288" y="190" width="10" height="32"/>
  <rect class="bar hp1" x="300" y="198" width="10" height="24"/>
  <rect class="bar hp1" x="312" y="206" width="10" height="16"/>
  <rect class="bar hp1" x="324" y="206" width="10" height="16"/>
  <rect class="bar hp1" x="336" y="214" width="10" height="8"/>
  <rect class="bar hp1" x="348" y="214" width="10" height="8"/>
  <rect class="bar hp1" x="360" y="206" width="10" height="16"/>
  <line class="axis" x1="224" y1="222" x2="376" y2="222"/>
  <text class="tick" x="224" y="242" style="font-size:12px">0.5</text>
  <text class="tick end" x="376" y="242" style="font-size:12px">1.0</text>

  <!-- purity 0.6 -->
  <rect class="box plain" x="408" y="76" width="176" height="176" rx="8"/>
  <text class="anno bold mid" x="496" y="102">purity 0.6</text>
  <rect class="bar hp1" x="424" y="214" width="10" height="8"/>
  <rect class="bar hp1" x="436" y="206" width="10" height="16"/>
  <rect class="bar hp1" x="448" y="190" width="10" height="32"/>
  <rect class="bar hp1" x="460" y="174" width="10" height="48"/>
  <rect class="bar hp1" x="472" y="166" width="10" height="56"/>
  <rect class="bar hp1" x="484" y="166" width="10" height="56"/>
  <rect class="bar hp1" x="496" y="174" width="10" height="48"/>
  <rect class="bar hp1" x="508" y="182" width="10" height="40"/>
  <rect class="bar hp1" x="520" y="190" width="10" height="32"/>
  <rect class="bar hp1" x="532" y="198" width="10" height="24"/>
  <rect class="bar hp1" x="544" y="198" width="10" height="24"/>
  <rect class="bar hp1" x="556" y="190" width="10" height="32"/>
  <line class="axis" x1="420" y1="222" x2="572" y2="222"/>
  <text class="tick" x="420" y="242" style="font-size:12px">0.5</text>
  <text class="tick end" x="572" y="242" style="font-size:12px">1.0</text>

  <!-- purity 0.8 -->
  <rect class="box plain" x="604" y="76" width="176" height="176" rx="8"/>
  <text class="anno bold mid" x="692" y="102">purity 0.8</text>
  <rect class="bar hp1" x="620" y="214" width="10" height="8"/>
  <rect class="bar hp1" x="632" y="214" width="10" height="8"/>
  <rect class="bar hp1" x="644" y="206" width="10" height="16"/>
  <rect class="bar hp1" x="656" y="198" width="10" height="24"/>
  <rect class="bar hp1" x="668" y="190" width="10" height="32"/>
  <rect class="bar hp1" x="680" y="182" width="10" height="40"/>
  <rect class="bar hp1" x="692" y="174" width="10" height="48"/>
  <rect class="bar hp1" x="704" y="166" width="10" height="56"/>
  <rect class="bar hp1" x="716" y="158" width="10" height="64"/>
  <rect class="bar hp1" x="728" y="158" width="10" height="64"/>
  <rect class="bar hp1" x="740" y="166" width="10" height="56"/>
  <rect class="bar hp1" x="752" y="174" width="10" height="48"/>
  <line class="axis" x1="616" y1="222" x2="768" y2="222"/>
  <text class="tick" x="616" y="242" style="font-size:12px">0.5</text>
  <text class="tick end" x="768" y="242" style="font-size:12px">1.0</text>

  <!-- purity 1.0 -->
  <rect class="box plain" x="800" y="76" width="176" height="176" rx="8"/>
  <text class="anno bold mid" x="888" y="102">purity 1.0</text>
  <rect class="bar hp1" x="816" y="214" width="10" height="8"/>
  <rect class="bar hp1" x="828" y="214" width="10" height="8"/>
  <rect class="bar hp1" x="840" y="214" width="10" height="8"/>
  <rect class="bar hp1" x="852" y="214" width="10" height="8"/>
  <rect class="bar hp1" x="864" y="214" width="10" height="8"/>
  <rect class="bar hp1" x="876" y="206" width="10" height="16"/>
  <rect class="bar hp1" x="888" y="206" width="10" height="16"/>
  <rect class="bar hp1" x="900" y="198" width="10" height="24"/>
  <rect class="bar hp1" x="912" y="190" width="10" height="32"/>
  <rect class="bar hp1" x="924" y="166" width="10" height="56"/>
  <rect class="bar hp1" x="936" y="134" width="10" height="88"/>
  <rect class="bar hp1" x="948" y="126" width="10" height="96"/>
  <line class="axis" x1="812" y1="222" x2="964" y2="222"/>
  <text class="tick" x="812" y="242" style="font-size:12px">0.5</text>
  <text class="tick end" x="964" y="242" style="font-size:12px">1.0</text>

  <text class="tick zh" x="20" y="272">橫軸是 GHIR（0.5～1.0），縱軸是有多少個位點落在該區間。</text>
  <text class="tick zh bold somatic" x="600" y="272">purity 越高，整個分布越往右。</text>

  <rect class="box accent" x="16" y="292" width="452" height="170" rx="10"/>
  <text class="anno bold zh" x="40" y="320">每個分布只取兩個數字當特徵</text>
  <text class="tick mid zh bold" x="180" y="356">中位數</text>
  <rect class="box plain" x="130" y="362" width="100" height="36" rx="4"/>
  <line class="axis" x1="180" y1="362" x2="180" y2="398" style="stroke-width:3"/>
  <line class="axis" x1="80" y1="380" x2="130" y2="380"/>
  <line class="axis" x1="230" y1="380" x2="280" y2="380"/>
  <text class="tick mid zh" x="180" y="420">四分位距（盒子的寬度）</text>
  <text class="tick zh" x="40" y="448">中位數說「整體偏到哪」，四分位距說「有多分散」。</text>

  <rect class="box accent" x="490" y="292" width="494" height="170" rx="10"/>
  <text class="anno bold zh" x="514" y="320">二次多項式迴歸</text>
  <text class="tick mono" x="514" y="348">purity = f( median, IQR )</text>
  <text class="tick zh" x="514" y="386">兩個特徵進去，</text>
  <text class="tick zh" x="514" y="410">一個 purity 值出來。</text>
  <line class="axis" x1="740" y1="432" x2="740" y2="352"/>
  <line class="axis" x1="740" y1="432" x2="962" y2="432"/>
  <path class="flow" d="M746,426 C790,414 820,388 848,370 C876,356 912,354 956,356"/>
  <circle class="pt tp" cx="780" cy="408" r="4"/>
  <circle class="pt tp" cx="820" cy="384" r="4"/>
  <circle class="pt tp" cx="860" cy="366" r="4"/>
  <circle class="pt tp" cx="908" cy="356" r="4"/>
  <circle class="pt tp" cx="950" cy="354" r="4"/>
  <text class="tick zh" x="748" y="346">↑ purity</text>
  <text class="tick mid zh" x="850" y="452">GHIR 特徵 →</text>

  <line class="axis" x1="20" y1="486" x2="980" y2="486"/>
  <text class="anno bold zh" x="20" y="516">模型怎麼訓練、能信到哪裡</text>
  <text class="tick zh" x="20" y="542">七個資料集訓練、一個資料集測試，並以 leave-k-out 交叉驗證；報告的平均 R² 約 0.96。</text>
  <text class="tick zh warn bold" x="20" y="566">但曲線只在訓練資料涵蓋的範圍內可信：換癌別、換 basecaller、換覆蓋度都可能落在分布之外。</text>
</svg>
