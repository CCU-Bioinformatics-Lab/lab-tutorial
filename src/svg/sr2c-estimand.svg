<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 800">
  <title>同一批變異，做成一棵全域樹，或做成幾百棵局部小樹</title>
  <desc>由上而下三層，說明估計目標的改動。
        最上層是同一批觀測：一條全基因體的長條，上面散布著體細胞變異；
        其中四段用虛線框起來，那是有讀序把兩個以上變異連鎖起來的連鎖視窗，依序標為 R1 到 R4；
        框外還有許多變異沒有被任何讀序連鎖起來。
        中間一層是既有做法：把全基因體所有變異匯集成每個變異的邊際等位頻率，
        輸出<b>一棵</b>細胞層級的樹。這棵樹的一個節點是一群細胞，
        解析度的連鎖區段是一個全基因體共用的細胞比例位置，
        所以細胞比例相同的兩支 lineage 必然被併成同一個節點。
        最下層是本規格：每一個框起來的連鎖視窗，各自依兩條染色體拷貝再切成兩個連鎖區段，
        每個連鎖區段各輸出一棵小樹，因此圖上有八棵彼此獨立的小樹。
        八棵的形狀各不相同：有的只有一條邊，有的是一條鏈，有的分岔，
        而且同一個連鎖視窗的兩個家族可以是不同的形狀 —— 這是資料決定的輸出，不是設定。
        沒有被連鎖起來的變異不產生任何小樹。
        最下方的結論是：兩邊看的是同一批讀序，差別只在把它們摘要成什麼。
        左邊是每個變異的邊際計數，右邊是同一條分子上的共現。
        而那些小樹不接成一棵大樹，因為局部標籤只在連鎖區段內有定義。</desc>

  <text class="ttl zh" x="20" y="36">同一批變異：匯集成一棵樹，或留成幾百棵小樹</text>

  <!-- ── 同一批觀測 ── -->
  <rect class="box" x="18" y="56" width="964" height="94" rx="8"/>
  <text class="lbl bold zh" x="34" y="86">同一批 read、同一批體細胞變異</text>

  <rect class="box sunken" x="34" y="96" width="932" height="26" rx="4"/>
  <rect class="box ghost" x="110" y="92" width="70" height="34" rx="4"/>
  <rect class="box ghost" x="330" y="92" width="60" height="34" rx="4"/>
  <rect class="box ghost" x="550" y="92" width="75" height="34" rx="4"/>
  <rect class="box ghost" x="790" y="92" width="70" height="34" rx="4"/>

  <circle class="mark somatic" cx="122" cy="109" r="5"/>
  <circle class="mark somatic" cx="145" cy="109" r="5"/>
  <circle class="mark somatic" cx="168" cy="109" r="5"/>
  <circle class="mark somatic" cx="342" cy="109" r="5"/>
  <circle class="mark somatic" cx="378" cy="109" r="5"/>
  <circle class="mark somatic" cx="562" cy="109" r="5"/>
  <circle class="mark somatic" cx="587" cy="109" r="5"/>
  <circle class="mark somatic" cx="612" cy="109" r="5"/>
  <circle class="mark somatic" cx="802" cy="109" r="5"/>
  <circle class="mark somatic" cx="825" cy="109" r="5"/>
  <circle class="mark somatic" cx="848" cy="109" r="5"/>
  <circle class="mark somatic" cx="60" cy="109" r="5"/>
  <circle class="mark somatic" cx="230" cy="109" r="5"/>
  <circle class="mark somatic" cx="270" cy="109" r="5"/>
  <circle class="mark somatic" cx="440" cy="109" r="5"/>
  <circle class="mark somatic" cx="480" cy="109" r="5"/>
  <circle class="mark somatic" cx="672" cy="109" r="5"/>
  <circle class="mark somatic" cx="710" cy="109" r="5"/>
  <circle class="mark somatic" cx="740" cy="109" r="5"/>
  <circle class="mark somatic" cx="900" cy="109" r="5"/>
  <circle class="mark somatic" cx="940" cy="109" r="5"/>

  <text class="tick mono mid" x="145" y="144">R₁</text>
  <text class="tick mono mid" x="360" y="144">R₂</text>
  <text class="tick mono mid" x="587" y="144">R₃</text>
  <text class="tick mono mid" x="825" y="144">R₄</text>

  <!-- ── 既有做法：一棵 ── -->
  <rect class="box" x="18" y="170" width="964" height="220" rx="8"/>
  <text class="lbl bold zh" x="34" y="204">既有做法：全部匯集成邊際 VAF，輸出一棵樹</text>

  <text class="tick zh" x="34" y="270">全基因體所有變異的邊際計數匯在一起</text>
  <text class="tick zh" x="34" y="298">位置資訊在匯集時就沒了</text>

  <line class="conn" x1="500" y1="278" x2="458" y2="294"/>
  <line class="conn" x1="500" y1="278" x2="542" y2="294"/>
  <line class="conn" x1="450" y1="324" x2="450" y2="338"/>
  <circle class="cell normal" cx="500" cy="262" r="16"/>
  <circle class="cell tumor" cx="450" cy="308" r="16"/>
  <circle class="cell tumor" cx="550" cy="308" r="16"/>
  <circle class="cell tumor" cx="450" cy="354" r="16"/>

  <text class="tick zh" x="640" y="270">一個節點 ＝ 一群細胞</text>
  <text class="tick zh" x="640" y="298">解析度：全基因體共用的 CCF</text>
  <text class="tick zh bad" x="640" y="326">CCF 相同的兩支必然併成一個節點</text>

  <!-- ── 本規格：每個連鎖視窗 × 每條拷貝各一棵 ── -->
  <rect class="box accent" x="18" y="410" width="964" height="272" rx="8"/>
  <text class="lbl bold zh" x="34" y="444">本規格：每個連鎖視窗 × 每條染色體拷貝各一棵</text>

  <text class="tick mono mid" x="145" y="472">R₁</text>
  <text class="tick mono mid" x="360" y="472">R₂</text>
  <text class="tick mono mid" x="587" y="472">R₃</text>
  <text class="tick mono mid" x="825" y="472">R₄</text>

  <text class="tick mono" x="34" y="500">HP1</text>
  <line class="conn" x1="145" y1="503" x2="145" y2="511"/>
  <circle class="cell normal" cx="145" cy="494" r="9"/>
  <circle class="cell tumor" cx="145" cy="520" r="9"/>

  <line class="conn" x1="360" y1="503" x2="360" y2="511"/>
  <line class="conn" x1="360" y1="529" x2="360" y2="537"/>
  <circle class="cell normal" cx="360" cy="494" r="9"/>
  <circle class="cell tumor" cx="360" cy="520" r="9"/>
  <circle class="cell tumor" cx="360" cy="546" r="9"/>

  <line class="conn" x1="587" y1="503" x2="587" y2="511"/>
  <circle class="cell normal" cx="587" cy="494" r="9"/>
  <circle class="cell tumor" cx="587" cy="520" r="9"/>

  <line class="conn" x1="825" y1="503" x2="825" y2="511"/>
  <circle class="cell normal" cx="825" cy="494" r="9"/>
  <circle class="cell tumor" cx="825" cy="520" r="9"/>

  <text class="tick mono" x="34" y="586">HP2</text>
  <line class="conn" x1="145" y1="589" x2="145" y2="597"/>
  <line class="conn" x1="145" y1="615" x2="145" y2="623"/>
  <circle class="cell normal" cx="145" cy="580" r="9"/>
  <circle class="cell tumor" cx="145" cy="606" r="9"/>
  <circle class="cell tumor" cx="145" cy="632" r="9"/>

  <line class="conn" x1="354" y1="588" x2="338" y2="598"/>
  <line class="conn" x1="366" y1="588" x2="382" y2="598"/>
  <circle class="cell normal" cx="360" cy="580" r="9"/>
  <circle class="cell tumor" cx="334" cy="606" r="9"/>
  <circle class="cell tumor" cx="386" cy="606" r="9"/>

  <line class="conn" x1="587" y1="589" x2="587" y2="597"/>
  <line class="conn" x1="581" y1="614" x2="565" y2="624"/>
  <line class="conn" x1="593" y1="614" x2="609" y2="624"/>
  <circle class="cell normal" cx="587" cy="580" r="9"/>
  <circle class="cell tumor" cx="587" cy="606" r="9"/>
  <circle class="cell tumor" cx="561" cy="632" r="9"/>
  <circle class="cell tumor" cx="613" cy="632" r="9"/>

  <line class="conn" x1="825" y1="589" x2="825" y2="597"/>
  <line class="conn" x1="825" y1="615" x2="825" y2="623"/>
  <circle class="cell normal" cx="825" cy="580" r="9"/>
  <circle class="cell tumor" cx="825" cy="606" r="9"/>
  <circle class="cell tumor" cx="825" cy="632" r="9"/>

  <text class="tick zh" x="34" y="664">形狀各不相同，同一個連鎖視窗的兩個家族也可以不同；沒有連鎖的變異不產生小樹。</text>

  <!-- ── 結論 ── -->
  <rect class="box sunken" x="18" y="702" width="964" height="88" rx="8"/>
  <text class="anno bold zh" x="34" y="736">兩邊看的是同一批 read，差別只在摘要成什麼。</text>
  <text class="anno zh" x="34" y="768">左是每個變異的邊際計數；右是同一條分子上的共現。小樹不接成一棵大樹 —— 標籤只在連鎖區段內有定義。</text>
</svg>
