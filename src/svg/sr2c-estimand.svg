<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 692">
  <title>兩種估計目標：全域細胞層級的 clone tree 與局部分子層級的系譜</title>
  <desc>左右兩欄並列，比較兩個不同的估計目標。
        左欄是既有做法的目標：一棵細胞層級的 clone tree。
        它的估計對象是全基因體上的細胞群數、各群比例與樹的形狀。
        觀測以每個變異的邊際 VAF 加上拷貝數的形式進入似然。
        一個「群」的定義是全基因體共用的一個 CCF 位置，
        所以它分不出細胞比例相同的兩支 lineage，
        而且要數千個變異才撐得起一群。
        右欄是本規格的目標：一個視窗內的分子系譜。
        它的估計對象是單位內各個局部狀態的比例與先後關係。
        觀測以同一條分子上多個位點的共現形式進入似然。
        一個「節點」只在這個單位內有定義，
        所以它分不出跨越 read 距離以外的任何關係，
        但數十條跨越分子就有判別力。
        最下方是結論：兩欄不是好壞之分，而是解析度的層級不同。
        左欄回答整個腫瘤有幾群細胞，右欄回答這一段 DNA 上分子的先後長什麼樣。</desc>

  <text class="ttl zh" x="20" y="36">估計目標換掉了，不是同一個目標換一個方法</text>

  <!-- 左欄：全域細胞層級 -->
  <rect class="box" x="18" y="58" width="470" height="510" rx="8"/>
  <text class="lbl bold zh" x="34" y="92">既有做法的目標</text>
  <text class="tick zh" x="34" y="118">一棵細胞層級的 clone tree</text>

  <circle class="cell tumor" cx="80" cy="152" r="15"/>
  <circle class="cell clone1" cx="60" cy="212" r="15"/>
  <circle class="cell clone2" cx="122" cy="212" r="15"/>
  <line class="conn" x1="80" y1="167" x2="62" y2="197"/>
  <line class="conn" x1="80" y1="167" x2="120" y2="197"/>

  <text class="tick zh" x="170" y="152">一群 ＝ 全基因體共用的 CCF</text>
  <text class="tick zh" x="170" y="180">數千個變異一起撐起一群</text>
  <text class="tick zh" x="170" y="208">圖上的節點是一個細胞群</text>

  <text class="tick bold zh" x="34" y="266">估計對象</text>
  <text class="tick zh" x="34" y="292">全基因體的細胞群數、比例與樹</text>

  <text class="tick bold zh" x="34" y="328">觀測進入似然的形式</text>
  <text class="tick zh" x="34" y="354">每個變異的邊際 VAF ＋ 拷貝數</text>

  <text class="tick bold zh" x="34" y="390">解析度的單位</text>
  <text class="tick zh" x="34" y="416">一個全基因體共用的 CCF 位置</text>

  <text class="tick bold zh bad" x="34" y="452">永遠分不出來的</text>
  <text class="tick zh" x="34" y="478">CCF 相同的兩支 lineage</text>

  <text class="tick bold zh" x="34" y="514">撐起一個結論要多少證據</text>
  <text class="tick zh" x="34" y="540">數千個變異</text>

  <!-- 右欄：局部分子層級 -->
  <rect class="box accent" x="512" y="58" width="470" height="510" rx="8"/>
  <text class="lbl bold zh" x="528" y="92">本規格的目標</text>
  <text class="tick zh" x="528" y="118">一個視窗內的分子系譜</text>

  <rect class="read hp1" x="528" y="140" width="200" height="14" rx="6"/>
  <rect class="read hp1" x="528" y="162" width="200" height="14" rx="6"/>
  <rect class="read hp1" x="528" y="184" width="200" height="14" rx="6"/>
  <rect class="read hp1" x="528" y="206" width="200" height="14" rx="6"/>
  <circle class="mark somatic" cx="576" cy="147" r="6"/>
  <circle class="mark somatic" cx="648" cy="147" r="6"/>
  <circle class="mark somatic" cx="576" cy="169" r="6"/>
  <circle class="mark somatic" cx="576" cy="191" r="6"/>

  <text class="tick zh" x="748" y="152">同一條分子上的共現</text>
  <text class="tick zh" x="748" y="180">節點只在這個單位內有定義</text>
  <text class="tick zh" x="748" y="208">圖上的節點是一類分子狀態</text>

  <text class="tick bold zh" x="528" y="266">估計對象</text>
  <text class="tick zh" x="528" y="292">單位內各局部狀態的比例與先後</text>

  <text class="tick bold zh" x="528" y="328">觀測進入似然的形式</text>
  <text class="tick zh" x="528" y="354">同一條分子上多個位點的共現</text>

  <text class="tick bold zh" x="528" y="390">解析度的單位</text>
  <text class="tick zh" x="528" y="416">一個視窗、一條染色體拷貝</text>

  <text class="tick bold zh bad" x="528" y="452">永遠分不出來的</text>
  <text class="tick zh" x="528" y="478">跨越 read 距離以外的任何關係</text>

  <text class="tick bold zh" x="528" y="514">撐起一個結論要多少證據</text>
  <text class="tick zh" x="528" y="540">數十條跨越分子</text>

  <!-- 結論 -->
  <rect class="box sunken" x="18" y="588" width="964" height="90" rx="8"/>
  <text class="anno bold zh" x="34" y="620">兩欄不是好壞之分，是解析度的層級不同。</text>
  <text class="anno zh" x="34" y="654">左欄回答「整個腫瘤有幾群細胞」；右欄回答「這一段 DNA 上，分子的先後長什麼樣」。</text>
</svg>
