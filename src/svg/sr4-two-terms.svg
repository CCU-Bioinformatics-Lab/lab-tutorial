<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500">
  <title>同一個 GHIR 值的兩種成因：somatic 掏空與拷貝數失衡</title>
  <desc>兩欄的單倍型失衡比刻意設成完全相同的零點六六七，細胞比例也同樣是零點五，
        差別只在成因。
        左欄的兩個等位各一份，失衡完全來自體細胞掏空：
        單倍型一的腫瘤分子帶著體細胞等位而被搬走，剩下五份，單倍型二有十份。
        右欄這個位置沒有體細胞變異，失衡完全來自拷貝數：
        單倍型一在腫瘤細胞裡一份、單倍型二三份，
        算下來單倍型一收到十份、單倍型二收到二十份，比值同樣是零點六六七。
        兩欄的長條高度比刻意畫成一樣，因為重點正是「光看這個數字分不出來」。
        下方指出分開兩者的方法：
        體細胞掏空只出現在體細胞變異的位置上，
        拷貝數失衡則在整段區域的生殖系異型合子位點上都看得到。
        所以要分開，就得在不同的位置分別量。
        讀法是：現行流程把這兩項壓在同一個數字裡，然後用兩個矩去概括它。</desc>

  <text class="ttl zh" x="20" y="36">同一個 GHIR，兩種成因</text>
  <text class="anno zh" x="20" y="66">兩欄的純度同為 <tspan class="mono">0.50</tspan>，GHIR 同為 <tspan class="mono">0.667</tspan>。差別只在偏移的來源。</text>

  <!-- ══ 左：somatic 掏空 ══ -->
  <rect class="box ghost" x="20" y="88" width="468" height="286" rx="8"/>
  <text class="lbl bold zh mid" x="254" y="118">成因一：somatic 掏空</text>
  <text class="tick mono mid" x="254" y="142">拷貝數 1 + 1，此處有 clonal 變異</text>

  <text class="tick zh" x="44" y="182">H1</text>
  <rect class="bar hp1" x="90" y="164" width="100" height="26"/>
  <text class="tick mono" x="198" y="184">5</text>

  <text class="tick zh" x="44" y="228">H2</text>
  <rect class="bar hp2" x="90" y="210" width="200" height="26"/>
  <text class="tick mono" x="298" y="230">10</text>

  <text class="tick somatic zh" x="44" y="274">H1-1</text>
  <rect class="bar somatic" x="90" y="256" width="100" height="26"/>
  <text class="tick mono" x="198" y="276">5</text>

  <text class="tick zh" x="44" y="312">單倍型一原有 10 份，其中 5 份被搬走</text>
  <text class="anno bold mono mid" x="254" y="348">GHIR = 10 ÷ 15 = 0.667</text>

  <!-- ══ 右：拷貝數失衡 ══ -->
  <rect class="box ghost" x="512" y="88" width="468" height="286" rx="8"/>
  <text class="lbl bold zh mid" x="746" y="118">成因二：拷貝數失衡</text>
  <text class="tick mono mid" x="746" y="142">拷貝數 1 + 3，此處無 somatic 變異</text>

  <text class="tick zh" x="536" y="182">H1</text>
  <rect class="bar hp1" x="582" y="164" width="100" height="26"/>
  <text class="tick mono" x="690" y="184">10</text>

  <text class="tick zh" x="536" y="228">H2</text>
  <rect class="bar hp2" x="582" y="210" width="200" height="26"/>
  <text class="tick mono" x="790" y="230">20</text>

  <text class="tick zh" x="536" y="274">H1-1</text>
  <rect class="box ghost" x="582" y="256" width="100" height="26" rx="4"/>
  <text class="tick mono" x="690" y="276">0</text>

  <text class="tick zh" x="536" y="312">單倍型二在腫瘤細胞裡有三份</text>
  <text class="anno bold mono mid" x="746" y="348">GHIR = 20 ÷ 30 = 0.667</text>

  <!-- ══ 分開的方法 ══ -->
  <rect class="box accent" x="20" y="386" width="960" height="100" rx="8"/>
  <text class="anno zh" x="40" y="414">兩欄的長條<tspan class="bold">高度比刻意畫成相同</tspan> —— 重點正是「只看這一個數字分不出來」。</text>
  <text class="anno zh" x="40" y="442">分開的依據是<tspan class="bold">量測位置</tspan>：somatic 掏空只出現在 somatic 位點上；</text>
  <text class="anno zh" x="40" y="470">拷貝數失衡在整段區域的 <tspan class="bold">germline heterozygous 位點</tspan>上都看得到，且該處沒有掏空。</text>
</svg>
