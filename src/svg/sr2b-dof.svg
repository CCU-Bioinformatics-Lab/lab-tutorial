<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470">
  <title>兩種寫純度的方式，自由度相同</title>
  <desc>圖並排比較兩種參數化。左邊是本頁採用的寫法：把正常細胞當成第 0 項，
        和各個 clone 一起放進同一個總和為一的比例向量，
        因此有 K 加一個分量、扣掉一條總和限制，自由度是 K，而純度是推導出來的 1 減 w0。
        右邊是另一種常見寫法：純度單獨算一個參數，腫瘤內部的比例再自成一個總和為一的向量，
        因此是一加上 K 減一，同樣是 K。
        中間的等號說明兩者其實是同一個自由度的兩種切法，
        純度與正常細胞比例不是兩個獨立的量。
        下方列出兩個常見的數錯法：把純度和正常細胞比例各算一次會多算一個，
        只數腫瘤內部的比例則會少算一個。</desc>

  <text class="ttl zh" x="20" y="38">ρ 與 w₀ 是同一個自由度的兩種寫法</text>

  <!-- ── 左：本頁採用 ───────────────────────────────────────────── -->
  <rect class="box ok" x="20" y="62" width="420" height="238" rx="10"/>
  <text class="lbl bold zh ok" x="40" y="94">寫法 A（本頁採用）</text>

  <rect class="box sunken" x="40" y="110" width="380" height="104" rx="8"/>
  <text class="tick zh" x="58" y="138">正常細胞與各 clone 放在同一個向量裡：</text>
  <text class="lbl zh" x="58" y="172">w₀, w₁, …, w_K</text>
  <text class="tick zh" x="58" y="200">受一條限制：總和 ＝ 1</text>

  <text class="lbl bold zh ok" x="40" y="248">自由度 ＝ K</text>
  <text class="tick zh" x="40" y="276">純度是推導量：ρ ＝ 1 − w₀</text>

  <!-- ── 中：等號 ───────────────────────────────────────────────── -->
  <text class="ttl zh accent mid" x="500" y="192">＝</text>

  <!-- ── 右：等價寫法 ───────────────────────────────────────────── -->
  <rect class="box" x="560" y="62" width="420" height="238" rx="10"/>
  <text class="lbl bold zh" x="580" y="94">寫法 B（等價）</text>

  <rect class="box sunken" x="580" y="110" width="380" height="104" rx="8"/>
  <text class="tick zh" x="598" y="138">純度單獨一個，腫瘤內部再自成一個向量：</text>
  <text class="lbl zh" x="598" y="172">ρ　＋　w₁, …, w_K</text>
  <text class="tick zh" x="598" y="200">後者受一條限制：總和 ＝ 1</text>

  <text class="lbl bold zh" x="580" y="248">自由度 ＝ 1 ＋ (K − 1) ＝ K</text>
  <text class="tick zh" x="580" y="276">兩種寫法交出同一組預測</text>

  <!-- ── 底部：兩個常見的數錯法 ─────────────────────────────────── -->
  <rect class="box bad" x="20" y="322" width="960" height="128" rx="10"/>
  <text class="lbl bold zh bad" x="40" y="354">K ＝ 5 時，連續自由度是 5</text>

  <rect class="box ghost bad" x="44" y="370" width="450" height="62" rx="8"/>
  <text class="tick zh" x="62" y="396">數成 6：把 ρ 與 w₀ 各算一次</text>
  <text class="tick zh" x="62" y="420">—— 它們是同一個量</text>

  <rect class="box ghost bad" x="506" y="370" width="450" height="62" rx="8"/>
  <text class="tick zh" x="524" y="396">數成 4：只數腫瘤內部的 K − 1</text>
  <text class="tick zh" x="524" y="420">—— 漏掉了純度那一格</text>
</svg>
