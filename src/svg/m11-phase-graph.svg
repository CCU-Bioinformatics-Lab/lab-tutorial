<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520">
  <title>phasing 基本圖模型：位點作為節點、read 支持作為邊</title>
  <desc>上半部：每個可區分兩條染色體的位置變成圖上的一個節點。
        兩個節點之間如果有 read 同時跨過，就連一條邊，
        邊的粗細代表有幾條 read 支持這個連結。
        中間：三種邊的狀況 —— 支持一致的強邊、read 證據互相衝突的弱邊，以及沒有 read 跨過的斷邊。
        下半部：在圖上尋找彼此一致的指派，連通區段形成一個 phase block。</desc>

  <!-- ══ 步驟 1：把位點變成節點 ══ -->
  <text class="lbl bold zh" x="20" y="32">① 每個可區分兩條染色體的位置 → 一個節點</text>

  <!-- read 層 -->
  <line class="guide" x1="180" y1="48" x2="180" y2="118"/>
  <line class="guide" x1="340" y1="48" x2="340" y2="118"/>
  <line class="guide" x1="500" y1="48" x2="500" y2="118"/>
  <line class="guide" x1="660" y1="48" x2="660" y2="118"/>
  <line class="guide" x1="820" y1="48" x2="820" y2="118"/>

  <rect class="read hp0" x="140" y="56" width="240" height="12" rx="6"/>
  <rect class="read hp0" x="300" y="72" width="240" height="12" rx="6"/>
  <rect class="read hp0" x="460" y="88" width="240" height="12" rx="6"/>
  <rect class="read hp0" x="620" y="104" width="240" height="12" rx="6"/>
  <text class="tick zh" x="20" y="86">多條互相重疊的 read</text>

  <!-- 節點層 -->
  <circle class="mark germline" cx="180" cy="152" r="13"/>
  <circle class="mark germline" cx="340" cy="152" r="13"/>
  <circle class="mark germline" cx="500" cy="152" r="13"/>
  <circle class="mark germline" cx="660" cy="152" r="13"/>
  <circle class="mark germline" cx="820" cy="152" r="13"/>
  <text class="tick mid" x="180" y="182">①</text>
  <text class="tick mid" x="340" y="182">②</text>
  <text class="tick mid" x="500" y="182">③</text>
  <text class="tick mid" x="660" y="182">④</text>
  <text class="tick mid" x="820" y="182">⑤</text>

  <path class="guide" d="M180,124 L180,136" marker-end="url(#arrow-sm)"/>
  <path class="guide" d="M340,124 L340,136" marker-end="url(#arrow-sm)"/>
  <path class="guide" d="M500,124 L500,136" marker-end="url(#arrow-sm)"/>
  <path class="guide" d="M660,124 L660,136" marker-end="url(#arrow-sm)"/>
  <path class="guide" d="M820,124 L820,136" marker-end="url(#arrow-sm)"/>

  <!-- ══ 步驟 2：邊的三種狀況 ══ -->
  <line class="axis" x1="20" y1="206" x2="980" y2="206"/>
  <text class="lbl bold zh" x="20" y="238">② 有 read 跨過兩個節點 → 連一條邊，粗細代表證據強度</text>

  <!-- 強邊 -->
  <rect class="box ok" x="20" y="256" width="306" height="130" rx="8"/>
  <circle class="mark germline" cx="80" cy="300" r="12"/>
  <circle class="mark germline" cx="266" cy="300" r="12"/>
  <line class="conn thick ok" x1="92" y1="300" x2="254" y2="300" style="stroke-width:7"/>
  <text class="anno mid bold zh ok" x="173" y="336">強邊</text>
  <text class="tick mid zh" x="173" y="360">多條 read 支持一致</text>
  <text class="tick mid zh" x="173" y="378">方向明確</text>

  <!-- 弱邊 -->
  <rect class="box warn" x="346" y="256" width="306" height="130" rx="8"/>
  <circle class="mark germline" cx="406" cy="300" r="12"/>
  <circle class="mark germline" cx="592" cy="300" r="12"/>
  <line class="conn warn" x1="418" y1="300" x2="580" y2="300" stroke-dasharray="6 4"/>
  <text class="anno mid bold zh warn" x="499" y="336">弱邊</text>
  <text class="tick mid zh" x="499" y="360">read 證據彼此衝突</text>
  <text class="tick mid zh" x="499" y="378">可能有定序錯誤</text>

  <!-- 斷邊 -->
  <rect class="box bad" x="672" y="256" width="308" height="130" rx="8"/>
  <circle class="mark germline" cx="732" cy="300" r="12"/>
  <circle class="mark germline" cx="920" cy="300" r="12"/>
  <text class="lbl mid bad bold" x="826" y="308">✕</text>
  <text class="anno mid bold zh bad" x="826" y="336">沒有邊</text>
  <text class="tick mid zh" x="826" y="360">沒有任何 read 同時跨過</text>
  <text class="tick mid zh" x="826" y="378">phase block 在這裡斷開</text>

  <!-- ══ 步驟 3：找一致的指派 ══ -->
  <line class="axis" x1="20" y1="408" x2="980" y2="408"/>
  <text class="lbl bold zh" x="20" y="440">③ 在圖上尋找彼此一致的指派 —— 連通區段形成一個 phase block</text>

  <circle class="mark hp1" cx="180" cy="480" r="13"/>
  <circle class="mark hp1" cx="340" cy="480" r="13"/>
  <circle class="mark hp1" cx="500" cy="480" r="13"/>
  <line class="conn hp1" x1="193" y1="480" x2="327" y2="480" style="stroke-width:5"/>
  <line class="conn hp1" x1="353" y1="480" x2="487" y2="480" style="stroke-width:5"/>

  <text class="lbl bad bold" x="570" y="488">✕</text>

  <circle class="mark hp2" cx="660" cy="480" r="13"/>
  <circle class="mark hp2" cx="820" cy="480" r="13"/>
  <line class="conn hp2" x1="673" y1="480" x2="807" y2="480" style="stroke-width:5"/>

  <rect class="region" x="150" y="458" width="380" height="44" rx="6"/>
  <rect class="region" x="630" y="458" width="220" height="44" rx="6"/>
  <text class="tick mid zh bold" x="340" y="514">phase block 1</text>
  <text class="tick mid zh bold" x="740" y="514">phase block 2</text>
</svg>
