<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 710">
  <title>一條邊的方向與去留，由四個加權計數決定</title>
  <desc>兩個變異之間的一條邊，其實是四個加權計數。每條跨過兩個位置的 read
        會落進 rr、ra、ar、aa 之一：rr 表示兩邊都看到 ref，aa 表示兩邊都看到 alt，
        依此類推。程式把它們併成兩個數字 —— para = rr + aa（平行），cross = ra + ar（交叉），
        再算 ESR = 兩者的小除以大。para 大就平行連接，cross 大就交叉連接。
        ESR 越小代表兩種組合差得越開、證據越乾淨；ESR 大到超過 edgeThreshold（預設 0.7）
        就代表兩種組合幾乎一樣多，這條邊會被整個丟掉，不參與後面的定相。
        另外兩條規則：任一端的 base quality 低於 baseQuality（預設 12）時，該條 read
        只算 edgeWeight（預設 0.1）而不是 1；SNP 與甲基化之間的邊門檻收緊到 0.3。</desc>

  <text class="lbl bold zh" x="16" y="34">一條邊其實是四個計數</text>

  <!-- 左上：read 怎麼落進 rr / ra / ar / aa -->
  <rect class="box plain" x="16" y="52" width="470" height="310" rx="10"/>
  <text class="anno bold zh" x="34" y="82">① 每條跨過兩個位置的 read 投進一個格子</text>
  <text class="tick mid zh" x="120" y="108">位置 i</text>
  <text class="tick mid zh" x="330" y="108">位置 j</text>
  <circle class="mark ref" cx="120" cy="130" r="9"/>
  <circle class="mark ref" cx="330" cy="130" r="9"/>
  <rect class="read hp0" x="80" y="158" width="290" height="14" rx="7"/>
  <rect class="read hp0" x="80" y="182" width="290" height="14" rx="7"/>
  <rect class="read hp0" x="80" y="206" width="290" height="14" rx="7"/>
  <rect class="read hp0" x="80" y="230" width="290" height="14" rx="7"/>
  <text class="tick mid mono" x="120" y="169">0</text>
  <text class="tick mid mono" x="330" y="169">0</text>
  <text class="tick mono bold" x="384" y="169">rr</text>
  <text class="tick mid mono" x="120" y="193">1</text>
  <text class="tick mid mono" x="330" y="193">1</text>
  <text class="tick mono bold" x="384" y="193">aa</text>
  <text class="tick mid mono" x="120" y="217">0</text>
  <text class="tick mid mono" x="330" y="217">1</text>
  <text class="tick mono bold" x="384" y="217">ra</text>
  <text class="tick mid mono" x="120" y="241">1</text>
  <text class="tick mid mono" x="330" y="241">0</text>
  <text class="tick mono bold" x="384" y="241">ar</text>
  <text class="tick zh" x="34" y="268">rr／aa ＝ 兩邊一致 → 支持<tspan class="bold">平行</tspan></text>
  <text class="tick zh" x="34" y="288">ra／ar ＝ 兩邊相反 → 支持<tspan class="bold">交叉</tspan></text>
  <rect class="box warn" x="34" y="302" width="434" height="48" rx="6"/>
  <text class="tick zh" x="48" y="324">任一端 base quality &lt; 12（-p）時，</text>
  <text class="tick zh" x="48" y="344">這條 read 只算 0.1（-e），不算 1</text>

  <!-- 右上：para / cross / ESR -->
  <rect class="box accent" x="502" y="52" width="482" height="310" rx="10"/>
  <text class="anno bold zh" x="520" y="82">② 併成兩個數字，再看它們差多少</text>
  <text class="lbl mono" x="520" y="126">para  = rr + aa</text>
  <text class="tick zh" x="520" y="150">平行的證據量</text>
  <text class="lbl mono" x="520" y="192">cross = ra + ar</text>
  <text class="tick zh" x="520" y="216">交叉的證據量</text>
  <line class="guide" x1="520" y1="240" x2="966" y2="240"/>
  <text class="lbl mono bold" x="520" y="278">ESR = min / max</text>
  <text class="tick zh" x="520" y="306">ESR 小 ＝ 兩種組合差得開 ＝ 證據乾淨</text>
  <text class="tick zh" x="520" y="330">ESR 大 ＝ 兩種組合差不多 ＝ 分不出來</text>

  <!-- 下半：同一條邊在三種證據強度下的結果 -->
  <text class="anno bold zh" x="16" y="400">③ 三種證據強度，三種結果</text>

  <rect class="box ok" x="16" y="416" width="308" height="228" rx="10"/>
  <text class="anno bold zh" x="34" y="444">證據乾淨</text>
  <text class="tick mid mono" x="76" y="474">rr</text>
  <text class="tick mid mono" x="126" y="474">aa</text>
  <text class="tick mid mono" x="194" y="474">ra</text>
  <text class="tick mid mono" x="244" y="474">ar</text>
  <text class="lbl mid mono bold" x="76" y="502">9</text>
  <text class="lbl mid mono bold" x="126" y="502">8</text>
  <text class="lbl mid mono bold" x="194" y="502">0</text>
  <text class="lbl mid mono bold" x="244" y="502">1</text>
  <text class="tick mid zh" x="101" y="524">para = 17</text>
  <text class="tick mid zh" x="219" y="524">cross = 1</text>
  <line class="guide" x1="34" y1="538" x2="306" y2="538"/>
  <text class="anno mono bold ok" x="34" y="568" style="font-size:20px">ESR = 0.06</text>
  <text class="anno bold zh ok" x="34" y="596">平行連接</text>
  <text class="tick zh" x="34" y="620">ESR ≤ 0.1 → 這一票的權重</text>
  <text class="tick zh" x="34" y="640">拉到 20（正常是 1）</text>

  <rect class="box plain" x="340" y="416" width="308" height="228" rx="10"/>
  <text class="anno bold zh" x="358" y="444">證據普通</text>
  <text class="tick mid mono" x="400" y="474">rr</text>
  <text class="tick mid mono" x="450" y="474">aa</text>
  <text class="tick mid mono" x="518" y="474">ra</text>
  <text class="tick mid mono" x="568" y="474">ar</text>
  <text class="lbl mid mono bold" x="400" y="502">7</text>
  <text class="lbl mid mono bold" x="450" y="502">6</text>
  <text class="lbl mid mono bold" x="518" y="502">3</text>
  <text class="lbl mid mono bold" x="568" y="502">3</text>
  <text class="tick mid zh" x="425" y="524">para = 13</text>
  <text class="tick mid zh" x="543" y="524">cross = 6</text>
  <line class="guide" x1="358" y1="538" x2="630" y2="538"/>
  <text class="mono bold " x="358" y="568" font-size="20">ESR = 0.46</text>
  <text class="anno bold zh " x="358" y="596">平行連接</text>
  <text class="tick zh" x="358" y="620">ESR 沒有低到 0.1，</text>
  <text class="tick zh" x="358" y="640">這一票權重就是 1</text>

  <rect class="box bad" x="664" y="416" width="308" height="228" rx="10"/>
  <text class="anno bold zh" x="682" y="444">兩種組合差不多</text>
  <text class="tick mid mono" x="724" y="474">rr</text>
  <text class="tick mid mono" x="774" y="474">aa</text>
  <text class="tick mid mono" x="842" y="474">ra</text>
  <text class="tick mid mono" x="892" y="474">ar</text>
  <text class="lbl mid mono bold" x="724" y="502">6</text>
  <text class="lbl mid mono bold" x="774" y="502">5</text>
  <text class="lbl mid mono bold" x="842" y="502">5</text>
  <text class="lbl mid mono bold" x="892" y="502">5</text>
  <text class="tick mid zh" x="749" y="524">para = 11</text>
  <text class="tick mid zh" x="867" y="524">cross = 10</text>
  <line class="guide" x1="682" y1="538" x2="954" y2="538"/>
  <text class="anno mono bold bad" x="682" y="568" style="font-size:20px">ESR = 0.91</text>
  <text class="anno bold zh bad" x="682" y="596">整條邊丟掉</text>
  <text class="tick zh" x="682" y="620">ESR 超過門檻 0.7（-1）→</text>
  <text class="tick zh" x="682" y="640">分不出來，不參與定相</text>

  <line class="axis" x1="16" y1="668" x2="984" y2="668"/>
  <text class="anno zh" x="16" y="698">SNP 與甲基化之間的邊門檻另外收緊到 0.3 —— 甲基化訊號比較吵，要求更乾淨才採信。</text>
</svg>
