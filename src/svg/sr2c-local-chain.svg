<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520">
  <title>局部生成鏈：由這個單位的狀態比例，長到一條 read 上看到的字母</title>
  <desc>由左到右四格，說明一條讀序上的字母是怎麼產生的。
        第一格是這個單位的狀態比例：四種局部狀態各佔多少分子，畫成四條長短不同的長條。
        這組比例是自由參數，先驗來自階段 G。
        第二格是從這組比例抽出一條分子，它有一個真實狀態，圖中畫的是帶第一與第二個變異、
        不帶第三個，也就是 110；實心圓代表帶有變異，空心圓代表參考型。
        第三格是覆蓋遮罩：這條讀序其實只跨得到前兩個位點，第三個位點沒有覆蓋到，
        以虛線空心圓畫在讀序之外。沒覆蓋到的位點必須邊際化，不可以填成參考型。
        第四格是兩個錯誤通道：逐位點錯誤一次只改一個字母，
        整條分子的家族誤標則一次把整條分子搬到另一個家族；
        通過這兩道之後看到的字母才是真正的資料。
        最下方是與前一篇的唯一結構差異，而且只差在第一格。
        左邊是前一篇：全域的 clone tree 以一個確定函數決定局部比例，局部沒有任何自由度。
        右邊是本規格：同一棵全域樹只以虛線箭頭提供先驗，局部比例是自由參數。
        這就是「提高局部解析度」在技術上的全部內容。</desc>

  <text class="ttl zh" x="20" y="36">一條 read 上的字母是怎麼來的</text>

  <!-- ① 狀態比例 -->
  <rect class="box accent" x="18" y="60" width="222" height="240" rx="8"/>
  <text class="tick bold zh" x="34" y="92">① 這個單位的狀態比例</text>
  <text class="tick mono" x="34" y="126">000</text>
  <rect class="bar somatic" x="100" y="114" width="110" height="16" rx="4"/>
  <text class="tick mono" x="34" y="156">100</text>
  <rect class="bar somatic" x="100" y="144" width="62" height="16" rx="4"/>
  <text class="tick mono" x="34" y="186">110</text>
  <rect class="bar somatic" x="100" y="174" width="37" height="16" rx="4"/>
  <text class="tick mono" x="34" y="216">101</text>
  <rect class="bar somatic" x="100" y="204" width="37" height="16" rx="4"/>
  <text class="tick bold zh ok" x="34" y="262">自由參數</text>
  <text class="tick zh" x="34" y="286">先驗來自階段 G</text>

  <line class="conn thick" x1="246" y1="170" x2="264" y2="170" marker-end="url(#arrow)"/>

  <!-- ② 抽一條分子 -->
  <rect class="box" x="270" y="60" width="210" height="240" rx="8"/>
  <text class="tick bold zh" x="286" y="92">② 抽一條分子</text>
  <rect class="read hp1" x="296" y="150" width="160" height="14" rx="6"/>
  <circle class="mark somatic" cx="326" cy="157" r="6"/>
  <circle class="mark somatic" cx="376" cy="157" r="6"/>
  <circle class="mark ref" cx="426" cy="157" r="6"/>
  <text class="tick zh" x="286" y="262">它的真實狀態</text>
  <text class="tick mono" x="286" y="286">110</text>

  <line class="conn thick" x1="486" y1="170" x2="504" y2="170" marker-end="url(#arrow)"/>

  <!-- ③ 覆蓋遮罩 -->
  <rect class="box" x="510" y="60" width="210" height="240" rx="8"/>
  <text class="tick bold zh" x="526" y="92">③ 覆蓋遮罩</text>
  <rect class="read hp1" x="536" y="150" width="110" height="14" rx="6"/>
  <circle class="mark somatic" cx="566" cy="157" r="6"/>
  <circle class="mark somatic" cx="616" cy="157" r="6"/>
  <circle class="mark ref" cx="666" cy="157" r="6" style="stroke-dasharray:3 2"/>
  <text class="tick zh" x="526" y="262">第三個位點沒覆蓋到</text>
  <text class="tick zh bad" x="526" y="286">要邊際化，不可填成 0</text>

  <line class="conn thick" x1="726" y1="170" x2="744" y2="170" marker-end="url(#arrow)"/>

  <!-- ④ 錯誤通道 -->
  <rect class="box warn" x="750" y="60" width="232" height="240" rx="8"/>
  <text class="tick bold zh" x="766" y="92">④ 兩個錯誤通道</text>
  <rect class="read hp1" x="776" y="128" width="130" height="14" rx="6"/>
  <circle class="mark somatic" cx="800" cy="135" r="6"/>
  <circle class="mark artifact" cx="846" cy="135" r="6"/>
  <text class="tick zh" x="766" y="166">逐位點：改一個字母</text>
  <rect class="read hp2" x="776" y="188" width="130" height="14" rx="6"/>
  <circle class="mark somatic" cx="800" cy="195" r="6"/>
  <circle class="mark somatic" cx="846" cy="195" r="6"/>
  <text class="tick zh" x="766" y="226">誤標：整條搬走</text>
  <text class="tick bold zh" x="766" y="262">過完這兩道之後</text>
  <text class="tick zh" x="766" y="286">看到的字母才是資料</text>

  <!-- 與前一篇的差別 -->
  <text class="lbl bold zh" x="34" y="364">與前一篇的唯一結構差異，就只差在第 ① 格</text>

  <rect class="box sunken" x="34" y="382" width="450" height="100" rx="8"/>
  <text class="tick bold zh" x="50" y="408">前一篇</text>
  <line class="conn" x1="140" y1="438" x2="126" y2="450"/>
  <line class="conn" x1="140" y1="438" x2="154" y2="450"/>
  <circle class="cell normal" cx="140" cy="432" r="8"/>
  <circle class="cell tumor" cx="122" cy="456" r="8"/>
  <circle class="cell tumor" cx="158" cy="456" r="8"/>
  <line class="conn" x1="180" y1="443" x2="238" y2="443" marker-end="url(#arrow)"/>
  <text class="tick zh mid" x="209" y="430">確定函數</text>
  <rect class="bar" x="250" y="436" width="120" height="14" rx="4"/>
  <text class="tick zh" x="250" y="470">ν 沒有自由度</text>

  <rect class="box accent" x="506" y="382" width="450" height="100" rx="8"/>
  <text class="tick bold zh" x="522" y="408">本規格</text>
  <line class="conn" x1="612" y1="438" x2="598" y2="450"/>
  <line class="conn" x1="612" y1="438" x2="626" y2="450"/>
  <circle class="cell normal" cx="612" cy="432" r="8"/>
  <circle class="cell tumor" cx="594" cy="456" r="8"/>
  <circle class="cell tumor" cx="630" cy="456" r="8"/>
  <line class="guide somatic" x1="652" y1="443" x2="710" y2="443" marker-end="url(#arrow)"/>
  <text class="tick zh mid" x="681" y="430">只當先驗</text>
  <rect class="bar ok" x="722" y="436" width="120" height="14" rx="4"/>
  <text class="tick bold zh ok" x="722" y="470">ν 是自由參數</text>
</svg>
