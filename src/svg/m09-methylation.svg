<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400">
  <title>同一分子上的序列與甲基化資訊</title>
  <desc>上半部區分同一段 DNA 的序列（A、C、G、T 四種鹼基）與甲基化資訊。
        示意中的修飾標記位於 C 後接 G 的 CpG 位點，且不改變序列字母。
        下半部示範：在完成修飾辨識且保留相應 tags 時，奈米孔定序可在同一分子上關聯序列變異與甲基化狀態，
        進而比較帶有與不帶有變異的分子之甲基化模式。</desc>

  <!-- ══ 上：兩個層次 ══ -->
  <text class="lbl bold zh" x="20" y="28">同一段 DNA 的序列與甲基化資訊</text>

  <!-- 序列層 -->
  <text class="anno zh" x="20" y="66">第一層　序列本身</text>
  <g class="base mono" font-size="26">
    <text class="base a" x="240" y="74">A</text>
    <text class="base c" x="280" y="74">C</text>
    <text class="base g" x="320" y="74">G</text>
    <text class="base t" x="360" y="74">T</text>
    <text class="base c" x="400" y="74">C</text>
    <text class="base g" x="440" y="74">G</text>
    <text class="base a" x="480" y="74">A</text>
    <text class="base t" x="520" y="74">T</text>
    <text class="base c" x="560" y="74">C</text>
    <text class="base g" x="600" y="74">G</text>
    <text class="base t" x="640" y="74">T</text>
    <text class="base a" x="680" y="74">A</text>
    <text class="base c" x="720" y="74">C</text>
    <text class="base c" x="760" y="74">C</text>
    <text class="base g" x="800" y="74">G</text>
  </g>
  <text class="tick zh" x="840" y="74">← 四種鹼基</text>

  <!-- CpG 標示 -->
  <rect class="region" x="270" y="52" width="82" height="34" rx="5"/>
  <rect class="region" x="390" y="52" width="82" height="34" rx="5"/>
  <rect class="region" x="550" y="52" width="82" height="34" rx="5"/>
  <rect class="region" x="750" y="52" width="82" height="34" rx="5"/>
  <text class="tick zh accent" x="240" y="104">框線標示 C 後接 G 的 CpG 位點</text>

  <!-- 甲基層 -->
  <text class="anno zh" x="20" y="152">第二層　甲基化標記</text>
  <circle class="cpg met"   cx="296" cy="146" r="9"/>
  <circle class="cpg unmet" cx="416" cy="146" r="9"/>
  <circle class="cpg met"   cx="576" cy="146" r="9"/>
  <circle class="cpg met"   cx="776" cy="146" r="9"/>
  <line class="guide" x1="296" y1="90" x2="296" y2="134"/>
  <line class="guide" x1="416" y1="90" x2="416" y2="134"/>
  <line class="guide" x1="576" y1="90" x2="576" y2="134"/>
  <line class="guide" x1="776" y1="90" x2="776" y2="134"/>

  <text class="tick zh" x="840" y="146">← 示意中的修飾標記</text>
  <text class="tick zh" x="240" y="182">實心 = 已甲基化　空心 = 未甲基化。<tspan class="bold">序列鹼基仍為 C</tspan>，差異在修飾狀態。</text>

  <!-- ══ 下：同一條分子上兩層一起讀到 ══ -->
  <line class="axis" x1="20" y1="206" x2="980" y2="206"/>
  <text class="lbl bold zh" x="20" y="232">奈米孔定序：在同一分子上關聯序列與修飾資訊</text>

  <!-- 三條 read，帶變異與甲基 -->
  <line class="guide" x1="470" y1="262" x2="470" y2="376"/>
  <text class="tick mid somatic bold" x="470" y="256">變異位置</text>

  <rect class="read hp1" x="120" y="266" width="740" height="14" rx="7"/>
  <circle class="mark somatic" cx="470" cy="273" r="7"/>
  <circle class="cpg met" cx="300" cy="273" r="5"/>
  <circle class="cpg met" cx="380" cy="273" r="5"/>
  <circle class="cpg met" cx="600" cy="273" r="5"/>
  <circle class="cpg met" cx="700" cy="273" r="5"/>
  <text class="tick somatic" x="874" y="278">有變異</text>

  <rect class="read hp1" x="140" y="296" width="720" height="14" rx="7"/>
  <circle class="mark somatic" cx="470" cy="303" r="7"/>
  <circle class="cpg met" cx="300" cy="303" r="5"/>
  <circle class="cpg met" cx="380" cy="303" r="5"/>
  <circle class="cpg met" cx="600" cy="303" r="5"/>
  <circle class="cpg met" cx="700" cy="303" r="5"/>
  <text class="tick somatic" x="874" y="308">有變異</text>

  <rect class="read hp2" x="110" y="326" width="740" height="14" rx="7"/>
  <circle class="mark ref" cx="470" cy="333" r="7"/>
  <circle class="cpg unmet" cx="300" cy="333" r="5"/>
  <circle class="cpg unmet" cx="380" cy="333" r="5"/>
  <circle class="cpg unmet" cx="600" cy="333" r="5"/>
  <circle class="cpg met" cx="700" cy="333" r="5"/>
  <text class="tick" x="874" y="338">沒有變異</text>

  <rect class="read hp2" x="130" y="356" width="730" height="14" rx="7"/>
  <circle class="mark ref" cx="470" cy="363" r="7"/>
  <circle class="cpg unmet" cx="300" cy="363" r="5"/>
  <circle class="cpg unmet" cx="380" cy="363" r="5"/>
  <circle class="cpg unmet" cx="600" cy="363" r="5"/>
  <circle class="cpg unmet" cx="700" cy="363" r="5"/>
  <text class="tick" x="874" y="368">沒有變異</text>

  <text class="anno zh bold" x="20" y="392">序列與修飾資訊可在同一分子上配對，便能比較帶有與不帶有變異的分子之甲基化模式。</text>
</svg>
