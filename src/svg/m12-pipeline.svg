<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430">
  <title>LongPhase-S 的五個階段</title>
  <desc>從 tumor 與 normal 的定序資料開始，依序經過初步 variant calling、
        normal variant phasing、初步 somatic haplotagging、tumor purity 估計、
        purity 感知的 somatic variant 過濾，最後產生 germline 與 somatic haplotype。
        圖中特別標出 purity 估計排在 variant 過濾之前，因為過濾參數會參考 purity。</desc>

  <!-- 輸入 -->
  <rect class="box plain" x="20" y="60" width="150" height="52" rx="8"/>
  <text class="anno mid" x="95" y="82">Tumor BAM</text>
  <text class="tick mid" x="95" y="102">50×</text>

  <rect class="box plain" x="20" y="130" width="150" height="52" rx="8"/>
  <text class="anno mid" x="95" y="152">Normal BAM</text>
  <text class="tick mid" x="95" y="172">25×</text>

  <!-- 階段 1 -->
  <path class="flow" d="M172,86 L206,86" marker-end="url(#arrow)"/>
  <path class="flow" d="M172,156 L206,156" marker-end="url(#arrow)"/>
  <rect class="box" x="208" y="52" width="146" height="68" rx="8"/>
  <text class="tick mid bold" x="281" y="78">ClairS</text>
  <text class="tick mid zh" x="281" y="98">tumor variants</text>
  <text class="tick mid" x="281" y="114">①</text>

  <rect class="box" x="208" y="130" width="146" height="68" rx="8"/>
  <text class="tick mid bold" x="281" y="156">Clair3</text>
  <text class="tick mid zh" x="281" y="176">normal variants</text>
  <text class="tick mid" x="281" y="192">①</text>

  <!-- 階段 2 -->
  <path class="flow" d="M356,164 L392,164" marker-end="url(#arrow)"/>
  <rect class="box" x="394" y="130" width="150" height="68" rx="8"/>
  <text class="tick mid bold zh" x="469" y="156">Normal phasing</text>
  <text class="tick mid zh" x="469" y="176">建立 HP1 / HP2</text>
  <text class="tick mid" x="469" y="192">②</text>

  <!-- 階段 3 -->
  <path class="flow" d="M356,86 L580,86 L580,120" marker-end="url(#arrow)"/>
  <path class="flow" d="M546,164 L580,164 L580,140" marker-end="url(#arrow)"/>
  <rect class="box accent" x="506" y="204" width="150" height="68" rx="8"/>
  <text class="tick mid bold zh" x="581" y="230">初步 somatic</text>
  <text class="tick mid bold zh" x="581" y="248">haplotagging</text>
  <text class="tick mid" x="581" y="264">③</text>
  <path class="flow" d="M580,140 L580,200" marker-end="url(#arrow)"/>

  <!-- 階段 4：purity -->
  <path class="flow" d="M658,238 L694,238" marker-end="url(#arrow)"/>
  <rect class="box accent" x="696" y="204" width="150" height="68" rx="8"/>
  <text class="tick mid bold" x="771" y="228">GHIR → 迴歸</text>
  <text class="tick mid bold zh somatic" x="771" y="248">估計 purity</text>
  <text class="tick mid" x="771" y="264">④</text>

  <!-- purity 回饋到過濾 -->
  <path class="conn somatic thick" d="M771,200 L771,150 L700,150" marker-end="url(#arrow)"/>
  <text class="tick zh somatic bold" x="704" y="128">purity 用於調整</text>
  <text class="tick zh somatic bold" x="704" y="144">過濾有多嚴格</text>

  <!-- 階段 5：過濾 -->
  <rect class="box" x="530" y="20" width="166" height="110" rx="8"/>
  <text class="tick mid bold zh" x="613" y="44">purity 感知過濾</text>
  <text class="tick mid" x="613" y="66">TINC filter</text>
  <text class="tick mid" x="613" y="84">read-level filter</text>
  <text class="tick mid" x="613" y="102">haplotype origin</text>
  <text class="tick mid" x="613" y="120">variant cluster　⑤</text>

  <!-- 輸出 -->
  <path class="flow" d="M698,75 L860,75 L860,200" marker-end="url(#arrow)"/>
  <rect class="box ok" x="850" y="290" width="130" height="100" rx="8"/>
  <text class="tick mid bold zh" x="915" y="314">輸出</text>
  <text class="tick mid hp1" x="915" y="336">HP1 / HP2</text>
  <text class="tick mid somatic" x="915" y="356">HP1-1 / HP2-1</text>
  <text class="tick mid" x="915" y="376">tumor purity</text>
  <path class="flow" d="M860,200 L860,286" marker-end="url(#arrow)"/>

  <!-- 重點註記 -->
  <line class="guide" x1="20" y1="300" x2="820" y2="300"/>
  <text class="anno bold zh" x="20" y="330">為什麼順序是這樣？</text>
  <text class="tick zh" x="20" y="356">在低 purity 樣本中，真 somatic 變異的支持 read 可能較少。</text>
  <text class="tick zh" x="20" y="378">固定門檻可能增加漏檢風險，仍需以驗證資料評估。</text>
  <text class="tick zh somatic bold" x="20" y="400">因此先估 purity，再依設定調整過濾參數。</text>
</svg>
