<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 790">
  <title>怎麼找出「只剩一條染色體」的區段：先切邊界，再算雜合比例，最後跳過小事件</title>
  <desc>第一層：read 的兩端如果對不上參考序列就會被剪掉，而斷點附近會有很多 read 在同一個位置被剪。
        左端被剪與右端被剪各算一種訊號。兩個方向相反、距離又很近的訊號會被配成一對，
        代表中間夾著一個小事件；配不成對的落單訊號則當成大區段的邊界。
        第二層：對每個區段統計雜合位點佔所有變異的比例。
        一條染色體整段消失時，原本一邊 A 一邊 G 的位置會只剩一種 allele，比例因此掉到門檻以下。
        圖中一段真正連續的 LOH 被中間兩個小事件墊高了比例，於是被切成三段。
        第三層：算比例時把小事件區間裡的變異先扣掉，三段就併回成一段連續的 LOH，
        寫進 LOH.bed，第三步定相時會用到。
        這一整套只用 read 與參考的對應關係，以及變異本身是雜合還是同型，不需要正常樣本。</desc>

  <!-- ══════════ ① 用被剪斷的 read 切出邊界 ══════════ -->
  <text class="lbl bold zh" x="20" y="32">① read 被剪斷的位置，就是切區段的地方</text>
  <text class="tick zh" x="20" y="58">read 的一端對不上參考序列時會被剪掉。同一個位置擠了很多剪痕，代表那裡有斷點。</text>

  <rect class="box plain" x="20" y="72" width="960" height="176" rx="10"/>

  <text class="tick end zh" x="132" y="106">read</text>
  <rect class="read hp0" x="148" y="96" width="200" height="14" rx="7"/>
  <rect class="read hp0" x="176" y="116" width="172" height="14" rx="7"/>
  <rect class="read hp0" x="160" y="136" width="188" height="14" rx="7"/>
  <rect class="read hp0" x="352" y="96" width="176" height="14" rx="7"/>
  <rect class="read hp0" x="352" y="116" width="150" height="14" rx="7"/>
  <rect class="read hp0" x="352" y="136" width="196" height="14" rx="7"/>
  <rect class="read hp0" x="576" y="96" width="180" height="14" rx="7"/>
  <rect class="read hp0" x="576" y="116" width="204" height="14" rx="7"/>
  <rect class="read hp0" x="620" y="136" width="160" height="14" rx="7"/>
  <rect class="read hp0" x="784" y="96" width="164" height="14" rx="7"/>
  <rect class="read hp0" x="784" y="116" width="140" height="14" rx="7"/>
  <rect class="read hp0" x="800" y="136" width="148" height="14" rx="7"/>

  <line class="conn bad" x1="350" y1="92" x2="350" y2="154" style="stroke-width:5"/>
  <line class="conn bad" x1="574" y1="92" x2="574" y2="154" style="stroke-width:5"/>
  <line class="conn bad" x1="782" y1="92" x2="782" y2="154" style="stroke-width:5"/>

  <text class="tick mid zh" x="350" y="176">右端被剪</text>
  <text class="tick mid zh" x="574" y="176">左端被剪</text>
  <text class="tick mid zh" x="782" y="176">右端被剪</text>

  <text class="tick end zh" x="132" y="212">配成對</text>
  <path class="conn ok" d="M350,206 L574,206" style="stroke-width:4"/>
  <circle class="mark ref" cx="782" cy="206" r="7"/>
  <text class="anno mid zh ok bold" x="462" y="200">方向相反又很近 → 中間夾著一個小事件</text>
  <text class="anno mid zh" x="800" y="234">落單 → 大區段的邊界</text>

  <!-- ══════════ ② 算雜合比例 ══════════ -->
  <line class="axis" x1="20" y1="268" x2="980" y2="268"/>
  <text class="lbl bold zh" x="20" y="300">② 每個區段算一個數字：雜合位點佔多少</text>
  <text class="tick zh" x="20" y="326">一條染色體整段不見了，原本能分出兩邊的位置只剩一種 allele，這個比例就會掉到門檻以下。</text>

  <text class="anno end zh" x="140" y="352">高</text>
  <text class="anno end zh" x="140" y="466">低</text>
  <line class="guide" x1="148" y1="346" x2="948" y2="346"/>
  <line class="axis" x1="148" y1="460" x2="948" y2="460"/>
  <line class="guide bad" x1="148" y1="428" x2="948" y2="428" style="stroke-dasharray:5 4"/>
  <text class="anno bad bold zh" x="954" y="426">門檻</text>

  <path class="conn thick" d="M148,364 L300,364 L300,440 L420,440 L420,372 L470,372
                              L470,440 L640,440 L640,372 L700,372 L700,440 L860,440
                              L860,364 L948,364"/>

  <text class="tick mid zh" x="224" y="404">正常</text>
  <text class="tick mid zh" x="904" y="404">正常</text>
  <text class="anno mid zh bold" x="445" y="396">小事件</text>
  <text class="anno mid zh bold" x="670" y="396">小事件</text>

  <text class="anno mid zh" x="548" y="486">門檻以下的<tspan class="bold">三段</tspan>各自被標成 LOH</text>

  <rect class="box bad" x="148" y="500" width="800" height="42" rx="6"/>
  <text class="anno mid zh" x="548" y="527">問題：本來是<tspan class="bold">一段連續</tspan>的 LOH，被兩個小事件切成三塊。</text>

  <!-- ══════════ ③ 跳過小事件重算 ══════════ -->
  <line class="axis" x1="20" y1="570" x2="980" y2="570"/>
  <text class="lbl bold zh" x="20" y="602">③ 算比例時，先把小事件區間裡的變異扣掉</text>

  <line class="guide" x1="148" y1="626" x2="948" y2="626"/>
  <line class="axis" x1="148" y1="690" x2="948" y2="690"/>
  <line class="guide bad" x1="148" y1="662" x2="948" y2="662" style="stroke-dasharray:5 4"/>

  <path class="conn thick ok" d="M148,638 L300,638 L300,676 L860,676 L860,638 L948,638"/>

  <path class="guide muted" d="M420,676 Q445,650 470,676"/>
  <path class="guide muted" d="M640,676 Q670,650 700,676"/>
  <text class="tick mid zh" x="445" y="662">跳過</text>
  <text class="tick mid zh" x="670" y="662">跳過</text>

  <line class="axis ok" x1="300" y1="712" x2="860" y2="712" style="stroke-width:6"/>
  <text class="anno mid zh bold ok" x="580" y="740">併回成一段：這一整段只剩一條染色體</text>
  <text class="tick mid zh" x="580" y="766">寫進 <tspan class="mono">&lt;prefix&gt;_LOH.bed</tspan>，第三步定相時會用到</text>
</svg>
