<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 618">
  <title>頻率譜要分開兩群需要幾個變異，以及同一批分子只要幾條就夠</title>
  <desc>上半是一組橫向長條，回答一個問題：要說服頻率譜「這裡是兩群不是一群」，需要幾個變異。
        答案取決於兩群的期望變異等位頻率差多少。
        兩群是 0.20 對 0.10 時，大約四個變異就夠；
        0.20 對 0.15 時要約二十個；0.20 對 0.18 時要約一百二十個；
        而兩群相同時，長條直接衝出畫面 —— 永遠不夠。
        最後一列不是「很難」而是沒有答案：兩群的期望頻率相同時，
        把任何一個變異在兩群之間改指派，直方圖完全不變，
        所以加深度、加樣本、換更好的演算法都不會把它們分開。
        下半是同一批讀序換一種看法。
        假設那三個突變並不共存，那麼在二十條跨越它們的分子裡，
        同時帶三個突變的分子預期只有錯誤地板那麼多，
        也就是百分之一乘以二十條，約零點二條。
        而實際觀測到五條。
        預期零點二、實際五 —— 這裡不需要任何門檻，也不需要統計檢定，結論就出來了。</desc>

  <text class="ttl zh" x="20" y="36">要說服頻率譜多開一群，需要幾個變異？</text>

  <!-- 需要幾個變異 -->
  <rect class="box" x="18" y="56" width="964" height="292" rx="8"/>
  <text class="lbl bold zh" x="34" y="90">兩群靠得越近，需要的變異越多 —— 而且不是慢慢變多</text>
  <text class="tick zh" x="34" y="116">下表固定深度 50，只改變兩群的期望 VAF</text>

  <text class="tick bold zh end" x="250" y="150">兩群的期望 VAF</text>
  <text class="tick bold zh" x="270" y="150">頻率譜需要幾個變異才分得開</text>

  <rect class="bar ok" x="270" y="168" width="13" height="24" rx="4"/>
  <text class="tick zh end" x="250" y="186">0.20 對 0.10</text>
  <text class="tick zh" x="295" y="186">約 4 個</text>

  <rect class="bar warn" x="270" y="206" width="67" height="24" rx="4"/>
  <text class="tick zh end" x="250" y="224">0.20 對 0.15</text>
  <text class="tick zh" x="349" y="224">約 20 個</text>

  <rect class="bar bad" x="270" y="244" width="400" height="24" rx="4"/>
  <text class="tick zh end" x="250" y="262">0.20 對 0.18</text>
  <text class="tick zh" x="682" y="262">約 120 個</text>

  <rect class="bar bad" x="270" y="282" width="560" height="24" rx="4"/>
  <line class="conn bad thick" x1="830" y1="294" x2="880" y2="294" marker-end="url(#arrow)"/>
  <text class="tick zh end" x="250" y="300">0.20 對 0.20</text>
  <text class="tick bold zh bad" x="892" y="300">永遠不夠</text>

  <text class="tick zh" x="270" y="332">兩群的期望 VAF 相同時，把任何一個變異改指派到另一群，直方圖完全不變。</text>

  <!-- 換成共現 -->
  <rect class="box accent" x="18" y="368" width="964" height="230" rx="8"/>
  <text class="lbl bold zh" x="34" y="402">同一批 read，換成「它們在不在同一條分子上」</text>

  <rect class="box sunken" x="34" y="420" width="440" height="130" rx="6"/>
  <text class="tick zh" x="50" y="448">若這三個突變<tspan class="bold">不</tspan>共存，20 條分子裡預期</text>
  <text class="anno bold zh mid bad" x="254" y="502" style="font-size:40px">0.2 條</text>
  <text class="tick zh mid" x="254" y="534">錯誤地板 1% × 20 條</text>

  <rect class="box sunken" x="506" y="420" width="442" height="130" rx="6"/>
  <text class="tick zh" x="522" y="448">實際觀測到</text>
  <text class="anno bold zh mid ok" x="727" y="502" style="font-size:40px">5 條</text>
  <text class="tick zh mid" x="727" y="534">同時帶三個突變的分子</text>

  <text class="tick zh" x="34" y="578">不需要門檻，也不需要統計檢定：預期 0.2、實際 5，結論就出來了。</text>
</svg>
