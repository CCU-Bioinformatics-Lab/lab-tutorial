<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620">
  <title>同一批 read 摘要成邊際計數只值 1.3 nats，摘要成共現值 11.9 nats</title>
  <desc>把三個數字畫在同一根以 nats 為單位的尺上，所以它們可以直接比較。
        共同設定是：一支只在這個視窗裡與母群體不同的 lineage，帶三個體細胞變異，
        母群體細胞比例 0.20、這支 0.15、該處深度 50、跨越這三個位點的分子 20 條。
        兩條路線看的是同一批讀序，差別只在把它們摘要成什麼統計量。
        尺上有一條垂直虛線立在 8.0 nats 的位置，那是在頻率譜上多開一群要付的代價，
        等於二分之一乘以參數兩個再乘以三千的自然對數。
        第一根長條是全域路線：把三個變異摘要成各自的邊際等位頻率，合計只有 1.3 nats，
        停在虛線左邊很遠的地方，差了 6.7 nats，所以這一群開不出來。
        第二根長條是局部路線：同樣三個變異，改看它們在同一條分子上的共現，
        三者共現的狀態在二十條跨越分子中出現五條，對照就地估到的錯誤地板，
        對數似然比是 11.9 nats，遠遠越過那條虛線。
        結論是：差別不在資料量，而在同一份證據能不能寫進那條似然。
        以邊際等位頻率為觀測的那一系方法只吃邊際計數，共現進不去。
        但這不是所有全域方法的通則，PairClone 與 TreeClone 就把成對共現寫進了全域似然。</desc>

  <text class="ttl zh" x="20" y="36">同一批 read，兩種摘要方式，差一個數量級</text>

  <!-- 共同設定 -->
  <rect class="box sunken" x="18" y="56" width="964" height="76" rx="8"/>
  <text class="tick bold zh" x="34" y="86">共同設定：一支只在這個視窗裡與母群體不同的 lineage，帶三個體細胞變異</text>
  <text class="tick zh" x="34" y="112">母群體 0.20 · 這支 0.15 · 深度 50 · 跨越這三個位點的分子 20 條 · 兩條路線看的是同一批 read</text>

  <!-- 同一根尺 -->
  <rect class="box" x="18" y="152" width="964" height="310" rx="8"/>
  <text class="lbl bold zh" x="34" y="186">兩種摘要方式，畫在同一根尺上</text>

  <text class="tick bold zh mid" x="661" y="216">多開一群的門檻 8.0 nats</text>
  <text class="tick zh mid" x="661" y="238">½ × 參數 2 × ln(3000)</text>

  <rect class="bar bad" x="230" y="280" width="70" height="30" rx="4"/>
  <rect class="bar ok" x="230" y="330" width="641" height="30" rx="4"/>

  <line class="guide somatic" x1="661" y1="248" x2="661" y2="392"/>

  <text class="tick bold zh end" x="215" y="286">全域：邊際 VAF</text>
  <text class="tick zh end" x="215" y="308">三個變異合計</text>
  <text class="tick mono bad" x="310" y="292">1.3 nats</text>
  <text class="tick zh bad" x="424" y="292">差 6.7 nats，開不出來</text>

  <text class="tick bold zh end" x="215" y="336">局部：分子上的共現</text>
  <text class="tick zh end" x="215" y="358">同樣三個變異</text>
  <text class="tick mono ok" x="881" y="350">11.9 nats</text>

  <line class="axis" x1="230" y1="390" x2="930" y2="390"/>
  <line class="axis" x1="230" y1="390" x2="230" y2="397"/>
  <line class="axis" x1="338" y1="390" x2="338" y2="397"/>
  <line class="axis" x1="445" y1="390" x2="445" y2="397"/>
  <line class="axis" x1="553" y1="390" x2="553" y2="397"/>
  <line class="axis" x1="661" y1="390" x2="661" y2="397"/>
  <line class="axis" x1="769" y1="390" x2="769" y2="397"/>
  <line class="axis" x1="876" y1="390" x2="876" y2="397"/>
  <text class="tick mono mid" x="230" y="416">0</text>
  <text class="tick mono mid" x="338" y="416">2</text>
  <text class="tick mono mid" x="445" y="416">4</text>
  <text class="tick mono mid" x="553" y="416">6</text>
  <text class="tick mono mid" x="661" y="416">8</text>
  <text class="tick mono mid" x="769" y="416">10</text>
  <text class="tick mono mid" x="876" y="416">12</text>
  <text class="tick zh" x="34" y="416">單位：nats</text>

  <text class="tick zh" x="34" y="446">左邊那根停在門檻前面 —— 同一支 lineage 在頻率譜上開不出一群；右邊那根越過門檻。</text>

  <!-- 結論 -->
  <rect class="box accent" x="18" y="482" width="964" height="118" rx="8"/>
  <text class="lbl bold zh" x="34" y="516">差別不在資料量，在同一份證據能不能寫進那條似然</text>
  <text class="anno zh" x="34" y="548">以邊際 VAF 為觀測的那一系（PyClone、PhyloWGS、Pairtree）只吃邊際計數，共現進不去。</text>
  <text class="anno zh warn" x="34" y="580">但這不是全域方法的通則 —— PairClone／TreeClone 把成對共現寫進了全域似然。</text>
</svg>
