  <text class="anno bold zh" x="24" y="368">① 逐<tspan class="bad">位點</tspan>數 → VAF</text>
  <text class="tick mono" x="24" y="398">VAF(A) = VAF(B) = VAF(C) = 7/20 = 0.35</text>
  <text class="tick mono" x="24" y="422">VAF(D) = VAF(E) = VAF(F) = 4/20 = 0.20</text>
  <text class="tick zh" x="24" y="450">六個位點 → 六個數字</text>

  <text class="anno bold zh" x="532" y="368">② 逐<tspan class="ok">單倍型</tspan>數 → 單倍型頻率</text>
  <text class="tick mono" x="532" y="398">HP1   = 9/20 = 0.45</text>
  <text class="tick mono" x="532" y="422">HP1-1 = 7/20 = 0.35</text>
  <text class="tick mono" x="532" y="446">HP1-2 = 4/20 = 0.20</text>
  <text class="tick zh" x="532" y="472">三條單倍型 → 三個數字</text>

  <rect class="box accent" x="24" y="486" width="952" height="36" rx="8"/>
  <text class="tick zh" x="48" y="510">沒有分子同時帶 A B C 與 D E F，所以 HP1-1 與 HP1-2 是<tspan class="bold">兄弟</tspan> —— 而這只有在一條分子跨得過這六個位點時才數得出來。</text>
