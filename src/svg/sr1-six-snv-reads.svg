<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 530">
  <title>20 條分子在六個位點上的等位組合</title>
  <desc>一個區域裡有六個 somatic 位點，由左到右標為 A 到 F，共二十條分子跨過全部六個位點。
        二十條分成三群。第一群九條，六個位點全是參考型，佔四成五。
        第二群七條，在 A、B、C 三個位點是變異型，D、E、F 是參考型，佔三成五。
        第三群四條，反過來在 D、E、F 是變異型，A、B、C 是參考型，佔兩成。
        關鍵是沒有任何一條分子同時帶著 A B C 與 D E F 這兩組。
        下半列出同一批分子的兩種數法。
        第一種逐位點數，得到 A、B、C 的 VAF 都是七除以二十等於零點三五，
        D、E、F 都是四除以二十等於零點二。
        第二種逐單倍型數，得到沒有變異的那群佔九除以二十等於零點四五，
        帶 A B C 的那群佔零點三五，帶 D E F 的那群佔零點二。
        最下方指出：因為沒有分子同時帶兩組，帶 A B C 與帶 D E F 的兩群是兄弟不是祖孫，
        而這件事只有在一條分子跨得過這六個位點時才數得出來。
        讀法是：兩種頻率譜的數字都從這一張圖來，差別只在數的時候把什麼當成一個單位。</desc>

  <text class="ttl zh" x="20" y="36">先看原始的 read</text>
  <text class="anno zh" x="20" y="64">一個區域、六個 somatic 位點、20 條跨得過全部六個位點的分子。</text>

