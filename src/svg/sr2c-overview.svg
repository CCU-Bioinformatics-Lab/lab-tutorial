<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 818">
  <title>整條路線的總覽：從原始 read 到兩份交付物</title>
  <desc>由上而下四層，每一層都畫出該階段實際處理的東西。
        第一層是階段 0 的前處理，沿用既有工具：
        左邊是四條來源未知的原始 read，以虛線外框表示；
        中間是定相與體細胞標記之後的同一批 read，已依兩條單倍型分成兩組並帶上變異標記；
        右邊是由它們整理出來的稀疏狀態表，畫成一格一格的方陣，
        深色格代表帶有該位點的變異，淺色格代表參考型。
        第二層是把位點切成兩堆：一條全基因體長條上散布著變異，
        多數是孤立的，屬於 S1；少數幾處聚在一起並用虛線框起來，屬於 S2。
        兩堆的 read 沒有交集，因此下方有兩支箭頭分別把 S1 送進階段 G、把 S2 送進階段 L。
        第三層左邊是階段 G，畫成一張變異等位頻率的直方圖，
        上面有幾個峰，峰頂各標一個圓點代表被定出來的 CCF 原子；
        右邊是階段 L，畫出某一個單位的四條分子，
        每條分子上有三個位點，實心代表帶有變異、空心代表參考型，
        右方由這些分子推出一棵小小的局部系譜。
        兩者之間有一支由左指向右的箭頭，標著單向：階段 G 的結果只當作階段 L 的先驗，局部不回饋全域。
        最下層是兩份交付物：
        左邊是逐單位目錄，畫成數列，每一列是一棵小樹加上幾個顏色不同的旗標；
        右邊是給 somatic caller 的特徵，畫成一疊通道，
        上面三條是本規格新增的三層特徵，下面三條是 caller 原本就有的。</desc>

