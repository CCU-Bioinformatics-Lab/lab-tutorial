<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500">
  <title>兩種「沒看到」：真的沒有那種細胞，與沒有 read 跨得到</title>
  <desc>左邊是跨越深度隨距離衰減的曲線。
        兩個位點靠得愈近，同時蓋到它們的 read 就愈多；距離接近讀長時，跨越深度掉到接近零。
        圖上標出真實例子的三個位點對，跨越深度分別是二十、十七與三。
        右邊說明問題所在：演算法看到某個狀態沒有出現，有兩種完全不同的原因。
        第一種是真的沒有細胞帶著那個組合，那是生物學結論。
        第二種是無 read 同時覆蓋該二位點，屬於未觀測。
        目前的做法把兩者當成同一件事，於是把看不到當成不存在。
        最下方是修正方式：每一個位點對先用自己的跨越深度算檢定力，
        檢定力不足的對標成未定，不允許它去約束樹的形狀，並且在報告裡列出來。
        讀法是：缺席要有足夠的觀測撐著，才能當成證據。</desc>

  <text class="ttl zh" x="20" y="36">兩種「沒看到」</text>

  <!-- 左：跨越深度衰減 -->
  <text class="lbl bold zh" x="20" y="76">跨越深度隨距離掉得很快</text>
  <line class="axis" x1="80" y1="270" x2="440" y2="270"/>
  <line class="axis" x1="80" y1="270" x2="80" y2="100"/>
  <text class="tick zh mid" x="260" y="296">兩個位點的距離 →</text>
  <text class="tick zh" x="20" y="96">跨越深度</text>

  <path class="conn thick ok" style="fill:none"
        d="M80,112 C150,130 200,180 260,214 C320,246 380,262 430,266"/>

  <circle class="pt tp" cx="140" cy="140" r="5"/>
  <text class="tick mono" x="152" y="136">n=20</text>
  <circle class="pt tp" cx="196" cy="178" r="5"/>
  <text class="tick mono" x="208" y="174">n=17</text>
  <circle class="pt fp" cx="372" cy="261" r="5"/>
  <text class="tick mono bad" x="300" y="252">n=3</text>

  <line class="guide muted" x1="80" y1="238" x2="440" y2="238"/>
  <text class="tick zh bad" x="86" y="232">檢定力門檻</text>

  <!-- 右：兩種原因 -->
  <text class="lbl bold zh" x="500" y="76">同樣是「這個狀態沒出現」</text>

  <rect class="box ok" x="500" y="94" width="476" height="82" rx="8"/>
  <text class="anno bold zh ok" x="524" y="126">① 真的沒有細胞帶著那個組合</text>
  <text class="anno zh" x="524" y="158">這是生物學結論，可以拿來決定樹的形狀。</text>

  <rect class="box bad" x="500" y="190" width="476" height="82" rx="8"/>
  <text class="anno bold zh bad" x="524" y="222">② 無 read 同時覆蓋該二位點</text>
  <text class="anno zh" x="524" y="254">這只是看不到，不能拿來決定任何事。</text>

  <path class="conn bad" d="M738,282 L738,306" marker-end="url(#arrow-sm)"/>
  <text class="anno zh bad mid" x="738" y="330">目前的做法把兩者當成同一件事</text>

  <!-- 修正 -->
  <rect class="box accent" x="24" y="352" width="952" height="128" rx="8"/>
  <text class="lbl bold zh accent" x="48" y="384">修正：每一對先過檢定力這一關</text>
  <text class="anno zh" x="48" y="416">用該位點對自己的跨越深度算檢定力；不足的標成「未定」，</text>
  <text class="anno zh" x="48" y="444">不允許它的「缺席」去約束樹，並且在報告裡逐條列出來。</text>
  <text class="tick zh" x="48" y="470">預期效果：目前被歸進「單層無分支」的單位，會有一部分正確地移到「未解析」。</text>
</svg>
