<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470">
  <title>validation loss 最低的 epoch 不等於任務目標最好的 epoch</title>
  <desc>兩個上下並排、共用同一條 epoch 橫軸的曲線。
        上面那條是 validation loss，越低越好：它一路下降，在第 22 個 epoch 附近才到最低點。
        下面那條是任務導向分數，越高越好：它在第 12 個 epoch 就到最高點，之後就開始下滑。
        兩個最高／最低點落在不同的 epoch，中間相差十個 epoch。
        右側說明那個分數怎麼算：成功移除的假陽性，減去 λ 倍的誤刪真陽性，再除以假陽性總數，
        λ 約為 1.45，由驗證集的正負比例估出，λ 越大表示越不容忍誤刪真陽性。
        因此模型選的是第 12 個 epoch：那時 loss 還在下降，但任務目標已經開始變差。</desc>

  <text class="lbl bold zh" x="20" y="32">同一次訓練，兩個指標的最佳點不在同一個 epoch</text>

  <!-- ══════ ① validation loss ══════ -->
  <text class="anno bold zh warn" x="20" y="58">① validation loss —— 越低越好</text>

  <line class="axis" x1="100" y1="68" x2="100" y2="168"/>
  <line class="guide muted" x1="100" y1="168" x2="620" y2="168"/>

  <path class="conn warn thick" d="M100,82 Q152,105 204,120 Q258,136 308,142
                                   Q362,152 412,155 Q448,159 481,160
                                   Q518,157 551,152 Q588,146 620,143"/>
  <circle class="mark ref" cx="481" cy="160" r="7"/>
  <text class="tick zh warn" x="500" y="182">最低點在這裡</text>

  <!-- ══════ ② 任務導向分數 ══════ -->
  <text class="anno bold zh ok" x="20" y="196">② 任務分數 —— 越高越好</text>

  <line class="axis" x1="100" y1="204" x2="100" y2="304"/>
  <line class="axis" x1="100" y1="304" x2="640" y2="304"/>

  <path class="conn ok thick" d="M100,293 Q152,257 204,240 Q258,224 308,218
                                 Q362,226 412,232 Q447,238 481,243
                                 Q516,249 551,254 Q586,260 620,265"/>
  <circle class="mark ref" cx="308" cy="218" r="7"/>
  <text class="tick zh ok" x="326" y="214">最高點在這裡</text>

  <!-- 兩個 epoch 的對齊虛線 -->
  <line class="guide" x1="308" y1="68" x2="308" y2="304"/>
  <line class="guide" x1="481" y1="68" x2="481" y2="304"/>

  <!-- 橫軸刻度 -->
  <text class="tick mid" x="100" y="324">0</text>
  <text class="tick mid" x="273" y="324">10</text>
  <text class="tick mid" x="457" y="324">20</text>
  <text class="tick mid" x="620" y="324">30</text>
  <text class="tick zh" x="654" y="324">epoch</text>

  <text class="anno bold zh ok mid" x="308" y="352">↑ epoch 12：任務分數最高</text>
  <text class="anno bold zh warn mid" x="481" y="376">↑ epoch 22：loss 最低</text>

  <!-- ══════ 右：那個分數是什麼 ══════ -->
  <rect class="box plain" x="660" y="68" width="320" height="236" rx="8"/>
  <text class="anno bold zh" x="676" y="96">它改用什麼分數挑 epoch</text>

  <text class="tick zh" x="676" y="126">成功移除的 FP − λ × 誤刪的 TP</text>
  <line class="guide muted" x1="676" y1="138" x2="960" y2="138"/>
  <text class="tick zh" x="676" y="160">FP 總數</text>

  <text class="tick zh" x="676" y="196">λ ≈ 1.45，由正負比例算出</text>
  <text class="tick zh" x="676" y="220">λ 越大 → 越不容忍誤刪 TP</text>

  <text class="anno bold zh ok" x="676" y="258">結果選 epoch 12</text>
  <text class="tick zh" x="676" y="284">loss 還在降，目標已經變差</text>

  <!-- ══════ 結論 ══════ -->
  <rect class="box warn" x="20" y="396" width="960" height="60" rx="8"/>
  <text class="anno zh" x="42" y="422">loss 衡量的是平均分類誤差；任務要的是「少刪真的、多刪假的」。兩者不是同一件事。</text>
  <text class="anno zh bold" x="42" y="446">所以模型選擇的標準要跟任務目標對齊，不是跟 loss 對齊。</text>
</svg>
