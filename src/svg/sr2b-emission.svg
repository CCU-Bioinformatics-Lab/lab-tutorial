<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 720">
  <title>生成模型：從全域的 clone 一路長到一條 read 上看到的字母</title>
  <desc>五層，上排三格下排兩格，每一層只做一件事，中間沒有自由參數。
        第一層是全域物件：一棵 clone tree、每個 clone 的細胞比例，以及每個突變掛在哪個 clone 上。
        全基因體只有這一份，所有單位共用。
        第二層把全域物件投影到一個單位上。一個單位是一個區域乘一個單倍型家族，
        所以只看得到一條染色體拷貝，另一條拷貝屬於另一個單位。
        投影的結果是每個 clone 在這個單位上的局部基因型，
        例如全參考、只帶第二個突變、三個都帶。
        第三層把細胞比例換成分子比例：一個細胞貢獻幾條分子，取決於它在這裡有幾份拷貝，
        所以權重是細胞比例乘上該家族的拷貝數，再除以全部分子數。正常細胞只落在全參考那一格。
        第四層是觀測通道，有兩個入口：逐個位點的定序錯誤，一次只改一個字母；
        以及整條分子的家族誤標，一次把所有位點一起換成另一個家族的樣子。
        兩者的形狀不同，所以不能用同一個參數描述。
        第五層是一條 read：它只覆蓋到部分位點，沒覆蓋到的位點被邊際化掉，
        不是被當成參考型。所以一條只看到第一與第三個位點的 read，
        會同時支持所有第一與第三位點相符的完整狀態。
        右下角說明 k 等於一時這整條路徑退化成什麼：只有兩格，
        第三層的比例就是期望 VAF，第五層沒有部分覆蓋的問題，得到的正是 beta-binomial。
        最下方標注：所有單位共用第一層，這就是合併發生的地方，不需要任何對齊步驟；
        而局部表格不是第二批資料，同一批 read 不可以在兩邊各算一次。
        讀法是：局部看到的每一個數字，都是同一組全域參數投影下來的。</desc>

  <text class="ttl zh" x="20" y="36">生成模型：全域 clone → 單位 → 分子 → 通道 → 一條 read</text>

  <!-- ① 全域 -->
  <rect class="box accent" x="18" y="58" width="308" height="212" rx="8"/>
  <text class="lbl bold zh accent" x="34" y="88">① 全域參數</text>
  <text class="tick zh" x="34" y="112">只有一份，所有單位共用</text>
  <circle class="mark somatic" cx="90" cy="150" r="11"/>
  <circle class="mark somatic" cx="150" cy="192" r="11"/>
  <circle class="mark somatic" cx="90" cy="234" r="11"/>
  <circle class="mark germline" cx="210" cy="234" r="11"/>
  <line class="conn" x1="97" y1="158" x2="143" y2="184"/>
  <line class="conn" x1="143" y1="200" x2="97" y2="226"/>
  <line class="conn" x1="157" y1="200" x2="203" y2="226"/>
  <text class="tick zh" x="238" y="156">clone tree</text>
  <text class="tick zh" x="238" y="180">細胞比例 w</text>
  <text class="tick zh" x="238" y="204">突變指派 z</text>

  <!-- ② 投影 -->
  <rect class="box" x="346" y="58" width="308" height="212" rx="8"/>
  <text class="lbl bold zh" x="362" y="88">② 投影到一個單位</text>
  <text class="tick zh" x="362" y="112">單位 ＝ 區域 × 單倍型家族</text>
  <rect class="read hp1" x="362" y="130" width="180" height="20" rx="10"/>
  <text class="tick mono" x="370" y="145">000</text>
  <text class="tick zh" x="556" y="145">正常</text>
  <rect class="read hp1" x="362" y="160" width="180" height="20" rx="10"/>
  <text class="tick mono" x="370" y="175">010</text>
  <text class="tick zh" x="556" y="175">clone A</text>
  <rect class="read hp1" x="362" y="190" width="180" height="20" rx="10"/>
  <text class="tick mono" x="370" y="205">111</text>
  <text class="tick zh" x="556" y="205">clone B</text>
  <text class="tick bold zh" x="362" y="238">只看得到一條拷貝</text>
  <text class="tick zh" x="362" y="260">另一條在另一個單位裡</text>

  <!-- ③ 分子 -->
  <rect class="box" x="674" y="58" width="308" height="212" rx="8"/>
  <text class="lbl bold zh" x="690" y="88">③ 細胞 → 分子</text>
  <text class="tick mono" x="690" y="114">η = w·A ／ Σ w·CN</text>
  <rect class="bar normal" x="690" y="132" width="120" height="18"/>
  <text class="tick mono" x="822" y="147">000</text>
  <rect class="bar hp1" x="690" y="162" width="88" height="18"/>
  <text class="tick mono" x="822" y="177">010</text>
  <rect class="bar hp2" x="690" y="192" width="58" height="18"/>
  <text class="tick mono" x="822" y="207">111</text>
  <text class="tick bold zh" x="690" y="238">拷貝數在這裡進來</text>
  <text class="tick zh" x="690" y="260">不是事後乘上去的</text>

  <!-- ④ 通道 -->
  <rect class="box warn" x="18" y="300" width="470" height="196" rx="8"/>
  <text class="lbl bold zh warn" x="34" y="330">④ 觀測通道（兩個入口）</text>
  <text class="tick zh" x="34" y="360">逐位點錯誤：一次只改一個字母</text>
  <text class="tick mono" x="34" y="386">000 → 0<tspan class="bad">1</tspan>0　　機率 ε</text>
  <line class="guide" x1="34" y1="404" x2="470" y2="404"/>
  <text class="tick zh" x="34" y="430">家族誤標：整條分子一起搬過來</text>
  <text class="tick mono" x="34" y="456">另一家族的 111　　機率 η</text>
  <text class="tick bold zh bad" x="34" y="482">形狀不同，不能共用一個參數</text>

  <!-- ⑤ read -->
  <rect class="box" x="512" y="300" width="470" height="196" rx="8"/>
  <text class="lbl bold zh" x="528" y="330">⑤ 一條 read</text>
  <rect class="read hp0" x="528" y="348" width="200" height="22" rx="11"/>
  <text class="tick mono" x="536" y="364">1 <tspan class="muted">–</tspan> 1</text>
  <text class="tick zh" x="746" y="364">只覆蓋第 1、3 個位點</text>
  <text class="tick bold zh bad" x="528" y="396">沒覆蓋的位點要邊際化</text>
  <text class="tick zh" x="528" y="420">不是填成參考型</text>
  <text class="tick mono" x="528" y="452">P = q(101) + q(111)</text>
  <text class="tick zh" x="528" y="482">一條中立的 read，不是反對票</text>

  <path class="conn" d="M326,164 L344,164" marker-end="url(#arrow-sm)"/>
  <path class="conn" d="M654,164 L672,164" marker-end="url(#arrow-sm)"/>
  <path class="conn" d="M828,270 L500,296" marker-end="url(#arrow-sm)"/>
  <path class="conn" d="M488,398 L510,398" marker-end="url(#arrow-sm)"/>

  <!-- k=1 -->
  <rect class="box ok" x="18" y="516" width="470" height="130" rx="8"/>
  <text class="lbl bold zh ok" x="34" y="546">k ＝ 1 時退化成什麼</text>
  <text class="tick zh" x="34" y="576">只有兩格（參考／變異），</text>
  <text class="tick zh" x="34" y="600">③ 的比例就是期望 VAF，</text>
  <text class="tick zh" x="34" y="624">⑤ 沒有部分覆蓋的問題。</text>
  <text class="anno bold zh accent" x="264" y="600">＝ beta-binomial</text>

  <!-- 合併 -->
  <rect class="box sunken" x="512" y="516" width="470" height="130" rx="8"/>
  <text class="lbl bold zh" x="528" y="546">合併在哪裡發生</text>
  <text class="tick zh" x="528" y="576">每個單位各自跑完 ②③④⑤，</text>
  <text class="tick zh" x="528" y="600">但都由同一組 ① 算出來，</text>
  <text class="tick bold zh accent" x="528" y="624">相乘即完成，不需要對齊步驟。</text>

  <text class="anno bold zh bad" x="18" y="678">局部表格不是第二批資料：它與 95% 區域的 VAF 由同一組參數產生。</text>
  <text class="tick zh" x="18" y="706">所以同一批 read 不可以在兩邊各算一次 —— 多變異單位的邊際 VAF 已含在它的聯合表裡。</text>
</svg>
