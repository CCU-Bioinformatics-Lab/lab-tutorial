<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640">
  <title>生成模型：從全域的 clone 一路長到一條 read 上看到的字母</title>
  <desc>由左而右五層，每一層只做一件事。
        第一層是全域物件：一棵 clone tree、每個 clone 的細胞比例，以及每個突變掛在哪個 clone 上。
        全基因體只有這一份，所有單位共用。
        第二層把全域物件投影到一個單位上。一個單位是一個區域乘一個單倍型家族，
        所以只看得到一條染色體拷貝。投影的結果是每個 clone 在這個單位上的局部基因型，
        例如全參考、只帶第二個突變、三個都帶。
        第三層把細胞比例換成分子比例：一個細胞貢獻幾條分子，取決於它在這裡有幾份拷貝，
        所以權重是細胞比例乘上該家族的拷貝數，再除以全部分子數。正常細胞只落在全參考那一格。
        第四層是觀測通道，有兩個入口：逐個位點的定序錯誤，一次只改一個字母；
        以及整條分子的家族誤標，一次把所有位點一起換成另一個家族的樣子。
        兩者的形狀不同，所以不能用同一個參數描述。
        第五層是一條 read：它只覆蓋到部分位點，沒覆蓋到的位點被邊際化掉，
        不是被當成參考型。所以一條只看到第一與第三個位點的 read，
        會同時支持所有第一與第三位點相符的完整狀態。
        最下方標注：所有單位共用第一層，這就是「合併」發生的地方，不需要任何對齊步驟。
        讀法是：局部看到的每一個數字，都是同一組全域參數投影下來的，
        所以局部表格不是新的資料，而是同一組參數的另一個觀測窗口。</desc>

  <text class="ttl zh" x="20" y="36">生成模型：全域 clone → 單位 → 分子 → 通道 → 一條 read</text>

  <!-- ① 全域 -->
  <rect class="box accent" x="18" y="66" width="182" height="196" rx="8"/>
  <text class="lbl bold zh accent" x="30" y="94">① 全域（只有一份）</text>
  <circle class="mark somatic" cx="60" cy="126" r="10"/>
  <circle class="mark somatic" cx="108" cy="170" r="10"/>
  <circle class="mark somatic" cx="60" cy="214" r="10"/>
  <circle class="mark germline" cx="156" cy="214" r="10"/>
  <line class="conn" x1="66" y1="134" x2="102" y2="162"/>
  <line class="conn" x1="102" y1="178" x2="66" y2="206"/>
  <line class="conn" x1="116" y1="178" x2="150" y2="206"/>
  <text class="tick zh" x="30" y="244">clone tree　＋　各 clone 細胞比例</text>

  <!-- ② 投影到單位 -->
  <rect class="box" x="212" y="66" width="182" height="196" rx="8"/>
  <text class="lbl bold zh" x="224" y="94">② 投影到一個單位</text>
  <text class="tick zh" x="224" y="118">單位 ＝ 區域 × 單倍型家族</text>
  <rect class="read hp1" x="224" y="132" width="158" height="18" rx="9"/>
  <text class="tick mono" x="230" y="146">000</text>
  <rect class="read hp1" x="224" y="160" width="158" height="18" rx="9"/>
  <text class="tick mono" x="230" y="174">010</text>
  <rect class="read hp1" x="224" y="188" width="158" height="18" rx="9"/>
  <text class="tick mono" x="230" y="202">111</text>
  <text class="tick zh" x="224" y="232">只看得到<tspan class="bold">一條</tspan>拷貝；</text>
  <text class="tick zh" x="224" y="252">另一條在另一個單位裡</text>

  <!-- ③ 分子權重 -->
  <rect class="box" x="406" y="66" width="182" height="196" rx="8"/>
  <text class="lbl bold zh" x="418" y="94">③ 細胞 → 分子</text>
  <text class="tick mono" x="418" y="126">η = w · A ／ Σ w·A</text>
  <rect class="bar normal" x="418" y="142" width="76" height="16"/>
  <text class="tick zh" x="502" y="155">正常 → 全 0</text>
  <rect class="bar hp1" x="418" y="168" width="58" height="16"/>
  <text class="tick mono" x="502" y="181">010</text>
  <rect class="bar hp2" x="418" y="194" width="40" height="16"/>
  <text class="tick mono" x="502" y="207">111</text>
  <text class="tick zh" x="418" y="238">拷貝數在這裡進來，</text>
  <text class="tick zh" x="418" y="256">不是事後乘上去的</text>

  <!-- ④ 觀測通道 -->
  <rect class="box warn" x="600" y="66" width="182" height="196" rx="8"/>
  <text class="lbl bold zh warn" x="612" y="94">④ 觀測通道（兩個）</text>
  <text class="tick zh" x="612" y="124">逐位點錯誤：一次改一個字母</text>
  <text class="tick mono" x="612" y="148">000 → 0<tspan class="bad">1</tspan>0</text>
  <line class="guide" x1="612" y1="164" x2="770" y2="164"/>
  <text class="tick zh" x="612" y="190">家族誤標：整條分子一起換</text>
  <text class="tick mono" x="612" y="214">另一家族的 111 → 落進這裡</text>
  <text class="tick zh bad" x="612" y="248">兩者形狀不同，</text>
  <text class="tick zh bad" x="612" y="266">不能共用一個參數</text>

  <!-- ⑤ 一條 read -->
  <rect class="box" x="794" y="66" width="188" height="196" rx="8"/>
  <text class="lbl bold zh" x="806" y="94">⑤ 一條 read</text>
  <rect class="read hp0" x="806" y="118" width="130" height="20" rx="10"/>
  <text class="tick mono" x="812" y="133">1 <tspan class="muted">–</tspan> 1</text>
  <text class="tick zh" x="806" y="164">只覆蓋第 1 與第 3 個位點</text>
  <text class="tick zh" x="806" y="192">沒覆蓋的位點<tspan class="bold bad">邊際化</tspan>，</text>
  <text class="tick zh" x="806" y="212">不是填成參考型</text>
  <text class="tick mono" x="806" y="244">P = q(101) + q(111)</text>

  <path class="conn" d="M200,164 L210,164" marker-end="url(#arrow-sm)"/>
  <path class="conn" d="M394,164 L404,164" marker-end="url(#arrow-sm)"/>
  <path class="conn" d="M588,164 L598,164" marker-end="url(#arrow-sm)"/>
  <path class="conn" d="M782,164 L792,164" marker-end="url(#arrow-sm)"/>

  <!-- 共用說明 -->
  <rect class="box sunken" x="18" y="292" width="964" height="150" rx="8"/>
  <text class="lbl bold zh" x="34" y="322">數百個單位共用第 ① 層 —— 這就是「合併」發生的地方</text>
  <text class="anno zh" x="34" y="356">每個單位各自跑完 ②③④⑤，得到自己那張表的機率。</text>
  <text class="anno zh" x="34" y="384">所有表的機率都由同一棵樹、同一組細胞比例算出來，</text>
  <text class="anno zh" x="34" y="412">所以把它們相乘就完成了合併，<tspan class="bold accent">不需要任何對齊步驟</tspan>。</text>

  <rect class="box ok" x="530" y="308" width="436" height="118" rx="8"/>
  <text class="lbl bold zh ok" x="548" y="338">k ＝ 1 時這整條路徑退化成什麼</text>
  <text class="tick zh" x="548" y="368">只有兩格（參考／變異），③ 的比例就是期望 VAF，</text>
  <text class="tick zh" x="548" y="392">⑤ 沒有部分覆蓋的問題 —— 得到的正是 beta-binomial。</text>
  <text class="tick zh bold accent" x="548" y="416">所以單變異區域用的不是另一個模型，是同一個模型的邊界情形。</text>

  <text class="anno bold zh" x="18" y="486">局部表格不是第二批資料。</text>
  <text class="anno zh" x="18" y="516">它與 95% 區域的 VAF 由同一組 {w, T, z} 產生，只是觀測窗口不同 ——</text>
  <text class="anno zh" x="18" y="546">一邊看到的是一個位點的邊際計數，另一邊看到的是好幾個位點的聯合計數。</text>
  <text class="anno bold zh bad" x="18" y="584">因此同一批 read 不可以在兩邊各算一次。多變異單位的邊際 VAF 已經含在它的聯合表裡。</text>
  <text class="tick zh" x="18" y="616">讀法：局部看到的每一個數字，都是同一組全域參數投影下來的。</text>
</svg>
