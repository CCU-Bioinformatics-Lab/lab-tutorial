<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500">
  <title>一個 k＝2 連鎖區段的聯合計數表只會落入三類：串接、分岔、不相容</title>
  <desc>三欄各是一個分析單位的聯合計數表，表格是二乘二，
        行代表第一個位點是參考型或變異型，列代表第二個位點是參考型或變異型。
        三欄的邊際計數刻意做成一樣，差別只在四個格子怎麼分配。
        左欄是串接：只有全參考、只帶第一個、兩個都帶三種分子，
        沒有任何分子只帶第二個，所以第二個變異一定發生在第一個變異的後代裡，樹是一條線。
        中欄是分岔：只帶第二個那一格有分子，兩個都帶那一格是空的，
        所以兩群細胞互不包含，樹分岔。
        右欄是不相容：四個格子都有分子，這在每個變異只發生一次的假設下不可能，
        代表某個變異判定是假的，或有 read 被分到錯的單倍型家族。
        右欄因此不是生物學結果，而是品質指標，可以反過來估計分型錯誤率。
        讀法是：三欄的邊際完全一樣，只有聯合計數分得出來。</desc>

  <text class="ttl zh" x="20" y="36">同一組邊際，三種聯合計數表</text>
  <text class="anno zh" x="20" y="66">三欄的邊際計數刻意相同 —— 重點正是「光看邊際分不出來」。</text>

  <!-- ── 左：串接 ─────────────────────────────────────────────── -->
  <rect class="box ghost" x="24" y="84" width="296" height="330" rx="8"/>
  <text class="lbl bold zh ok mid" x="172" y="114">串接 chain</text>
  <text class="tick mid" x="136" y="150">S2 = R</text>
  <text class="tick mid" x="212" y="150">S2 = A</text>
  <text class="tick end" x="90" y="194">S1 = R</text>
  <text class="tick end" x="90" y="246">S1 = A</text>
  <rect class="box plain" x="100" y="166" width="72" height="44" rx="6"/>
  <rect class="box plain" x="176" y="166" width="72" height="44" rx="6"/>
  <rect class="box plain" x="100" y="218" width="72" height="44" rx="6"/>
  <rect class="box plain" x="176" y="218" width="72" height="44" rx="6"/>
  <text class="lbl mono mid" x="136" y="196">41</text>
  <text class="lbl mono mid ok" x="212" y="196">0</text>
  <text class="lbl mono mid" x="136" y="248">22</text>
  <text class="lbl mono mid" x="212" y="248">17</text>
  <circle class="mark ref" cx="172" cy="292" r="8"/>
  <line class="conn" x1="172" y1="300" x2="172" y2="326"/>
  <circle class="mark somatic" cx="172" cy="334" r="8"/>
  <line class="conn" x1="172" y1="342" x2="172" y2="368"/>
  <circle class="mark somatic" cx="172" cy="376" r="8"/>
  <text class="tick zh mid" x="172" y="402">S2 長在 S1 的後代裡</text>

  <!-- ── 中：分岔 ─────────────────────────────────────────────── -->
  <rect class="box ghost" x="352" y="84" width="296" height="330" rx="8"/>
  <text class="lbl bold zh accent mid" x="500" y="114">分岔 fork</text>
  <text class="tick mid" x="464" y="150">S2 = R</text>
  <text class="tick mid" x="540" y="150">S2 = A</text>
  <text class="tick end" x="418" y="194">S1 = R</text>
  <text class="tick end" x="418" y="246">S1 = A</text>
  <rect class="box plain" x="428" y="166" width="72" height="44" rx="6"/>
  <rect class="box plain" x="504" y="166" width="72" height="44" rx="6"/>
  <rect class="box plain" x="428" y="218" width="72" height="44" rx="6"/>
  <rect class="box plain" x="504" y="218" width="72" height="44" rx="6"/>
  <text class="lbl mono mid" x="464" y="196">41</text>
  <text class="lbl mono mid" x="540" y="196">17</text>
  <text class="lbl mono mid" x="464" y="248">22</text>
  <text class="lbl mono mid accent" x="540" y="248">0</text>
  <circle class="mark ref" cx="500" cy="292" r="8"/>
  <line class="conn" x1="500" y1="300" x2="452" y2="330"/>
  <line class="conn" x1="500" y1="300" x2="548" y2="330"/>
  <circle class="mark somatic" cx="448" cy="338" r="8"/>
  <circle class="mark somatic" cx="552" cy="338" r="8"/>
  <text class="tick zh mid" x="500" y="378">兩群細胞互不包含</text>
  <text class="tick zh mid" x="500" y="402">S2 另外長出來</text>

  <!-- ── 右：不相容 ───────────────────────────────────────────── -->
  <rect class="box ghost bad" x="680" y="84" width="296" height="330" rx="8"/>
  <text class="lbl bold zh bad mid" x="828" y="114">不相容 incompatible</text>
  <text class="tick mid" x="792" y="150">S2 = R</text>
  <text class="tick mid" x="868" y="150">S2 = A</text>
  <text class="tick end" x="746" y="194">S1 = R</text>
  <text class="tick end" x="746" y="246">S1 = A</text>
  <rect class="box plain" x="756" y="166" width="72" height="44" rx="6"/>
  <rect class="box plain" x="832" y="166" width="72" height="44" rx="6"/>
  <rect class="box plain" x="756" y="218" width="72" height="44" rx="6"/>
  <rect class="box plain" x="832" y="218" width="72" height="44" rx="6"/>
  <text class="lbl mono mid" x="792" y="196">38</text>
  <text class="lbl mono mid bad" x="868" y="196">15</text>
  <text class="lbl mono mid" x="792" y="248">20</text>
  <text class="lbl mono mid bad" x="868" y="248">9</text>
  <text class="ttl bad mid" x="828" y="316">✗</text>
  <text class="tick zh mid bad" x="828" y="352">四格全滿 —— 在「每個變異</text>
  <text class="tick zh mid bad" x="828" y="376">只發生一次」下不可能</text>
  <text class="tick zh mid" x="828" y="402">這是品質指標，不是生物學</text>

  <text class="anno zh" x="24" y="450">右欄的出現率可以反過來估計單倍型分型的錯誤率 —— 模型因此自帶一個校正用的觀測量。</text>
  <text class="anno zh" x="24" y="482">分類要用似然比檢定，不是對原始計數設門檻：在偵測極限附近，兩種假設只差幾條 read。</text>
</svg>
