<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620">
  <title>同樣的兩個 VAF，短讀留下兩棵樹，長讀只剩一棵</title>
  <desc>左右兩半用的是同一顆腫瘤、同樣兩個 somatic 位點、同樣十條分子，
        兩邊算出來的 VAF 也完全一樣：S1 是零點五零，S2 是零點三零。
        差別只在讀長。
        左半是短讀：兩個位點相距三 kb，沒有任何一條 read 同時蓋得到，
        所以每條 read 只在一個位點上有值。能算出來的就只有那兩個 VAF。
        這兩個數字同時相容於兩棵樹：一棵是 S2 長在 S1 的細胞裡，另一棵是兩者各自從起點長出來。
        兩棵都通過檢查，所以分不出來。
        右半是長讀：一條分子就跨過兩個位點，所以每條 read 在兩個位點上都有值，
        可以直接數出組合。十條裡面，兩個位點都是參考型的有五條，
        只帶 S1 的有兩條，兩個都帶的有三條，而只帶 S2 的一條也沒有。
        只帶 S2 的分子不存在這件事，直接排除掉「兩者各自長出」那棵樹，
        因為那棵樹必須要有只帶 S2 的細胞。於是只剩下一棵。
        最下方點出關鍵：多出來的不是精度，是一種新的觀測 ——
        邊際頻率永遠不會告訴你哪一格是空的，而空的那一格才是決定樹形的東西。
        讀法是：兩邊的 VAF 刻意做成一模一樣，所以差別只可能來自組合。</desc>

  <text class="ttl zh" x="20" y="36">同樣的兩個 VAF，短讀留下兩棵樹，長讀只剩一棵</text>
  <text class="anno zh" x="20" y="64">兩邊是同一顆腫瘤、同樣十條分子。VAF 刻意做成完全一樣，所以差別只可能來自「組合看不看得到」。</text>

