  <circle class="mark ref" cx="850" cy="196" r="4"/>
  <circle class="mark ref" cx="850" cy="208" r="4"/>
  <circle class="mark ref" cx="850" cy="220" r="4"/>
  <circle class="mark ref" cx="850" cy="232" r="4"/>
  <circle class="mark ref" cx="850" cy="244" r="4"/>
  <circle class="mark somatic" cx="850" cy="256" r="4"/>
