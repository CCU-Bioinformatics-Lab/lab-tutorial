  <!-- ══ 關鍵 ══ -->
  <rect class="box accent" x="24" y="548" width="952" height="60" rx="8"/>
  <text class="anno zh" x="48" y="576">長讀多給的不是精度，是<tspan class="bold">一種新的觀測</tspan>：哪一種組合是<tspan class="bold">空的</tspan>。</text>
  <text class="anno zh" x="48" y="600">邊際頻率永遠不會告訴你這件事 —— 而空掉的那一格，正是決定樹形的那一格。</text>
</svg>
