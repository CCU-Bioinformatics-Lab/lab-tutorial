  <text class="lbl bold zh mid" x="742" y="110">長讀：一條跨過兩個位點</text>

  <text class="tick mid" x="634" y="138">S1</text>
  <text class="tick zh mid" x="742" y="138">相距 3 kb</text>
  <text class="tick mid" x="850" y="138">S2</text>
  <line class="axis" x1="544" y1="150" x2="940" y2="150"/>
  <line class="guide" x1="634" y1="144" x2="634" y2="156"/>
  <line class="guide" x1="850" y1="144" x2="850" y2="156"/>

