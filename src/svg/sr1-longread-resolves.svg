  <text class="anno mono mid" x="742" y="312">VAF(S1) = 5/10 = 0.50</text>
  <text class="anno mono mid" x="742" y="334">VAF(S2) = 3/10 = 0.30</text>
  <text class="tick zh mid ok" x="742" y="360">一模一樣，但還數得出組合：只帶 S2 的 0 條</text>

  <text class="tick zh mid" x="742" y="390">相容的樹</text>

  <text class="tick zh mid" x="624" y="414">S2 長在 S1 裡</text>
  <circle class="mark ref" cx="624" cy="434" r="9"/>
  <line class="conn" x1="624" y1="443" x2="624" y2="459"/>
  <circle class="mark somatic" cx="624" cy="468" r="9"/>
