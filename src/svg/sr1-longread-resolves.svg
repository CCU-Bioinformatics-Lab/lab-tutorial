  <rect class="read hp0" x="342" y="264" width="48" height="8" rx="4"/>
  <rect class="read hp0" x="342" y="276" width="48" height="8" rx="4"/>
  <circle class="mark ref" cx="366" cy="172" r="4"/>
  <circle class="mark ref" cx="366" cy="184" r="4"/>
  <circle class="mark ref" cx="366" cy="196" r="4"/>
  <circle class="mark ref" cx="366" cy="208" r="4"/>
  <circle class="mark ref" cx="366" cy="220" r="4"/>
  <circle class="mark ref" cx="366" cy="232" r="4"/>
  <circle class="mark ref" cx="366" cy="244" r="4"/>
  <circle class="mark somatic" cx="366" cy="256" r="4"/>
  <circle class="mark somatic" cx="366" cy="268" r="4"/>
  <circle class="mark somatic" cx="366" cy="280" r="4"/>

  <text class="anno mono mid" x="258" y="312">VAF(S1) = 5/10 = 0.50</text>
  <text class="anno mono mid" x="258" y="334">VAF(S2) = 3/10 = 0.30</text>
  <text class="tick zh mid bad" x="258" y="360">能算的就只有這兩個數字 —— 組合看不到</text>

  <text class="tick zh mid" x="258" y="390">相容的樹</text>

  <text class="tick zh mid" x="140" y="414">S2 長在 S1 裡</text>
  <circle class="mark ref" cx="140" cy="434" r="9"/>
  <line class="conn" x1="140" y1="443" x2="140" y2="459"/>
  <circle class="mark somatic" cx="140" cy="468" r="9"/>
  <line class="conn" x1="140" y1="477" x2="140" y2="493"/>
  <circle class="mark somatic" cx="140" cy="502" r="9"/>
  <text class="lbl bold ok" x="176" y="474">✓</text>

  <text class="tick zh mid" x="376" y="414">兩者各自長出</text>
  <circle class="mark ref" cx="376" cy="434" r="9"/>
  <line class="conn" x1="368" y1="442" x2="344" y2="462"/>
  <line class="conn" x1="384" y1="442" x2="408" y2="462"/>
  <circle class="mark somatic" cx="338" cy="470" r="9"/>
  <circle class="mark somatic" cx="414" cy="470" r="9"/>
  <text class="lbl bold ok" x="440" y="474">✓</text>

  <!-- ══ 右：長讀 ══ -->
