  <rect class="read hp0" x="126" y="276" width="48" height="8" rx="4"/>
  <circle class="mark ref" cx="150" cy="172" r="4"/>
  <circle class="mark ref" cx="150" cy="184" r="4"/>
  <circle class="mark ref" cx="150" cy="196" r="4"/>
  <circle class="mark ref" cx="150" cy="208" r="4"/>
  <circle class="mark ref" cx="150" cy="220" r="4"/>
  <circle class="mark somatic" cx="150" cy="232" r="4"/>
  <circle class="mark somatic" cx="150" cy="244" r="4"/>
  <circle class="mark somatic" cx="150" cy="256" r="4"/>
  <circle class="mark somatic" cx="150" cy="268" r="4"/>
  <circle class="mark somatic" cx="150" cy="280" r="4"/>

  <rect class="read hp0" x="342" y="168" width="48" height="8" rx="4"/>
  <rect class="read hp0" x="342" y="180" width="48" height="8" rx="4"/>
  <rect class="read hp0" x="342" y="192" width="48" height="8" rx="4"/>
  <rect class="read hp0" x="342" y="204" width="48" height="8" rx="4"/>
