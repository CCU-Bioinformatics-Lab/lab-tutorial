<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520">
  <title>完整流程：現行實作已具備的四步與須新增的四步</title>
  <desc>八個步驟由上而下。
        淺色的四步是現行實作已經做完的：
        把腫瘤與正常配對資料的分子標上單倍型；
        在每個體細胞變異位點上算出五個計數；
        用四道濾波把低信心的變異去掉；
        以及相位區塊本身，它直接就是分段的單位，不需要另外切。
        深色的四步是要新增的：
        在生殖系異型合子位點上算單倍型深度比，這是目前完全沒有用到的通道；
        算出單倍型內的體細胞佔比，它的兩個計數都已經在輸出裡，只差沒有相除；
        依每段的拷貝數把這些位點分層，再一起最佳化細胞比例與各段的拷貝數；
        最後輸出四個量以及各自的區間。
        右邊標出被取代的部分：現行流程在算完五個計數之後，
        取分布的中位數與四分位距，再用迴歸換成一個純量，這整段被取代掉。
        讀法是：新增的工作集中在後半，前半的原料已經在了。</desc>

  <text class="ttl zh" x="20" y="36">完整流程</text>
  <text class="anno zh" x="20" y="66">淺色為現行實作已具備者，深色為須新增者。右側為被取代的部分。</text>

  <!-- ══ 已具備 ══ -->
  <text class="anno bold zh" x="20" y="112">已具備</text>

  <rect class="box plain" x="150" y="96" width="420" height="34" rx="6"/>
  <text class="tick zh mid" x="360" y="118">① 對腫瘤與正常配對資料進行單倍型標記</text>
  <line class="flow" x1="360" y1="130" x2="360" y2="146" marker-end="url(#arrow)"/>

  <rect class="box plain" x="150" y="150" width="420" height="34" rx="6"/>
  <text class="tick zh mid" x="360" y="172">② 每個 somatic 位點的五個計數</text>
  <line class="flow" x1="360" y1="184" x2="360" y2="200" marker-end="url(#arrow)"/>

  <rect class="box plain" x="150" y="204" width="420" height="34" rx="6"/>
  <text class="tick zh mid" x="360" y="226">③ 四道低信心變異濾波</text>
  <line class="flow" x1="360" y1="238" x2="360" y2="254" marker-end="url(#arrow)"/>

  <rect class="box plain" x="150" y="258" width="420" height="34" rx="6"/>
  <text class="tick zh mid" x="360" y="280">④ 以 phase block 為分段單位</text>
  <line class="flow" x1="360" y1="292" x2="360" y2="308" marker-end="url(#arrow)"/>

  <!-- ══ 須新增 ══ -->
  <text class="anno bold zh" x="20" y="330">須新增</text>

  <rect class="box accent" x="150" y="312" width="420" height="34" rx="6"/>
  <text class="tick bold zh mid" x="360" y="334">⑤ germline 位點的單倍型深度比（目前未使用）</text>
  <line class="flow" x1="360" y1="346" x2="360" y2="362" marker-end="url(#arrow)"/>

  <rect class="box accent" x="150" y="366" width="420" height="34" rx="6"/>
  <text class="tick bold zh mid" x="360" y="388">⑥ 單倍型內 somatic 佔比（兩個計數已在，未相除）</text>
  <line class="flow" x1="360" y1="400" x2="360" y2="416" marker-end="url(#arrow)"/>

  <rect class="box accent" x="150" y="420" width="420" height="34" rx="6"/>
  <text class="tick bold zh mid" x="360" y="442">⑦ 依 n₁ 分層，聯合最佳化 p 與各段拷貝數</text>
  <line class="flow" x1="360" y1="454" x2="360" y2="470" marker-end="url(#arrow)"/>

  <rect class="box ok" x="150" y="474" width="420" height="34" rx="6"/>
  <text class="tick bold zh mid" x="360" y="496">⑧ 輸出 p、κ、各段拷貝數、f 及其區間</text>

  <!-- ══ 被取代者 ══ -->
  <rect class="box ghost bad" x="620" y="150" width="360" height="150" rx="8"/>
  <text class="anno bold bad zh mid" x="800" y="180">被取代的部分</text>
  <text class="tick zh mid" x="800" y="212">取 GHIR 分布的中位數與四分位距</text>
  <text class="tick zh mid" x="800" y="240">以二階多項式迴歸換為一個純量</text>
  <text class="tick bad zh mid" x="800" y="272">輸出只有 f，且係數需訓練</text>

  <line class="conn bad" x1="570" y1="172" x2="616" y2="190" style="stroke-dasharray:5 4"/>

  <rect class="box ghost" x="620" y="330" width="360" height="178" rx="8"/>
  <text class="anno bold zh mid" x="800" y="360">新增工作的性質</text>
  <text class="tick zh" x="644" y="392">⑤ 需重新掃一次 germline VCF，</text>
  <text class="tick zh" x="644" y="414">　 但標記結果已在 BAM 上</text>
  <text class="tick zh" x="644" y="444">⑥ 只是兩個既有計數相除</text>
  <text class="tick zh" x="644" y="474">⑦ 為本路線的主要新增工作，</text>
  <text class="tick zh" x="644" y="496">　 其收斂性尚待模擬檢驗</text>
</svg>
