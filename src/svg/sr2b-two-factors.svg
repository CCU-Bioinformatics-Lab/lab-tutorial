<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 630">
  <title>相加為什麼不是 likelihood：看兩項的取用範圍就知道</title>
  <desc>圖用一條按比例畫的長條代表全部一萬五千五百個變異。
        左邊較長的一段是自己獨佔一個連鎖視窗的變異，約一萬四千個；
        右邊那一小段是落在多變異視窗裡的變異，約一千五百個，約佔一成。
        每一項的取用範圍畫成長條上方或下方的一條細帶。
        上半是相加的寫法：第一項的細帶蓋住整條長條，第二項的細帶只蓋住右邊那一小段，
        兩條細帶在右段上下對齊、範圍重疊，該欄因此被標成紅色 ——
        那一成變異的 read 被兩項各用了一次。
        這就是為什麼那個和不是 likelihood，也是權重存在的唯一理由：稀釋這段重疊。
        下半是相乘的寫法：同一條長條先被切開成沒有交集的兩段，中間留出可見的空隙，
        兩條細帶因此不再上下重疊。
        圖最下方用讀圖示表示兩段各留下什麼資料：左段只留一個位點的 alt 與 ref 計數，
        右段留下逐條 read 跨越多個位點的聯合狀態與覆蓋遮罩。
        因此兩個因子可以直接相乘得到完整的 likelihood，權重也就不需要存在。</desc>

  <text class="ttl zh" x="20" y="42">相加為什麼不是 likelihood：看取用範圍就知道</text>

  <!-- ══════════════ 上半：相加 ══════════════ -->
  <text class="lbl bold zh bad" x="20" y="86">✗ 相加：兩項的取用範圍<tspan class="bold">重疊</tspan></text>

  <!-- 第①項的取用範圍：蓋住全部 -->
  <text class="tick zh" x="20" y="126">① 每個位點的 alt／ref 計數</text>
  <rect class="bar ok" x="300" y="116" width="650" height="14" rx="7"/>

  <!-- 變異長條（按比例：14,025 ＋ 1,475） -->
  <rect class="bar" x="300" y="146" width="588" height="48" rx="4"/>
  <rect class="bar somatic" x="888" y="146" width="62" height="48" rx="4"/>
  <text class="tick zh mid" x="594" y="176">獨佔一個視窗的變異　14,025</text>
  <text class="tick zh end" x="950" y="214">1,475</text>

  <!-- 第②項的取用範圍：只蓋住右段 -->
  <text class="tick zh" x="20" y="246">② 同一條 read 上的共現</text>
  <line class="guide muted" x1="212" y1="241" x2="880" y2="241"/>
  <rect class="bar warn" x="888" y="234" width="62" height="14" rx="7"/>

  <!-- ★ 重疊高亮：務必畫在長條之後，否則會被填色蓋掉 ★ -->
  <rect class="region bad" x="888" y="110" width="62" height="144"/>
  <rect class="region bad" x="888" y="110" width="62" height="144"/>
  <rect class="box ghost bad" x="888" y="110" width="62" height="144" rx="4"/>

  <path class="conn bad" d="M919,258 L919,276" marker-end="url(#arrow-sm)"/>
  <text class="lbl bold zh bad end" x="950" y="302">這一欄被兩項各用了一次</text>

  <text class="tick zh" x="20" y="336">同一批 read 算了兩次 → 那個和不是 likelihood；權重存在的唯一理由，就是事後稀釋這段重疊。</text>

  <!-- ══════════════ 下半：相乘 ══════════════ -->
  <text class="lbl bold zh ok" x="20" y="384">✓ 相乘：先把資料切開，兩個因子各管一段</text>

  <text class="tick zh" x="20" y="424">兩個因子的取用範圍</text>
  <rect class="bar ok" x="300" y="414" width="574" height="14" rx="7"/>
  <rect class="bar warn" x="888" y="414" width="62" height="14" rx="7"/>

  <rect class="bar" x="300" y="444" width="574" height="48" rx="4"/>
  <rect class="bar somatic" x="888" y="444" width="62" height="48" rx="4"/>

  <!-- 中間的空隙：兩段沒有交集 -->
  <rect class="box ghost" x="874" y="408" width="14" height="90" rx="3"/>

  <text class="tick zh" x="300" y="516">S₁　14,025 個變異</text>
  <text class="tick zh end" x="950" y="516">S₂　1,475 個變異</text>

  <!-- 兩段各留下什麼資料：用讀圖示表示，文字放在圖示下方 -->
  <rect class="read hp0" x="300" y="532" width="150" height="14" rx="7"/>
  <circle class="mark somatic" cx="375" cy="539" r="6"/>
  <text class="tick zh" x="300" y="578">只留一個位點的 alt／ref 計數</text>

  <rect class="read hp0" x="700" y="526" width="150" height="14" rx="7"/>
  <rect class="read hp0" x="730" y="546" width="150" height="14" rx="7"/>
  <circle class="mark somatic" cx="740" cy="533" r="6"/>
  <circle class="mark somatic" cx="800" cy="533" r="6"/>
  <circle class="mark somatic" cx="800" cy="553" r="6"/>
  <circle class="mark ref" cx="860" cy="553" r="6"/>
  <text class="tick zh end" x="950" y="578">留逐條 read 的聯合狀態與遮罩</text>

  <text class="lbl bold zh ok" x="20" y="616">兩段沒有交集 → 相乘就是完整的 likelihood → 權重不必存在</text>
</svg>
