<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470">
  <title>同樣是 30 比 28，畫面可以完全不同</title>
  <desc>兩邊的計數完全一樣：30 條 read 支持參考鹼基 A、28 條支持 G。
        左半部畫出一種與真 heterozygous 相容的畫面：支持 G 的 read 正反股都有，
        鹼基品質高，附近序列沒有對齊困難。右半部畫出另一種畫面：支持 G 的 read 全部落在同一股，
        鹼基品質低，而且候選位置緊鄰一段同型多聚體。兩者的支持數相同，
        因此僅依數量無法區分，必須看每個觀測本身帶的品質與比對資訊。</desc>

  <!-- ══════════════ 左：與真變異相容的畫面 ══════════════ -->
  <text class="lbl bold zh" x="16" y="44">同一組計數，畫面 A</text>
  <rect class="box ok" x="16" y="60" width="472" height="326" rx="10"/>

  <rect class="bar" x="40" y="84" width="180" height="22" rx="4"/>
  <text class="tick mid bold" x="130" y="100">30 條支持 A</text>
  <rect class="bar" x="40" y="112" width="168" height="22" rx="4"/>
  <text class="tick mid bold" x="124" y="128">28 條支持 G</text>
  <text class="tick zh" x="240" y="100">計數 30 : 28</text>
  <text class="tick zh" x="240" y="126">兩邊完全一樣</text>

  <line class="guide" x1="40" y1="146" x2="464" y2="146"/>

