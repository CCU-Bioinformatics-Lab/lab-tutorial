  <!-- ══════════════ 結論 ══════════════ -->
  <line class="axis" x1="20" y1="406" x2="980" y2="406"/>
  <text class="anno zh bold" x="20" y="438">數量一樣，畫面不一樣 —— caller 判斷的是後者。</text>
  <text class="anno zh" x="20" y="466">所以 30 比 28 只能提出候選；每一個觀測還帶著品質、股向與鄰近序列，這些才是判定的依據。</text>
