  <text class="tick mid bold" x="620" y="128">28 條支持 G</text>
  <text class="tick zh" x="736" y="100">計數 30 : 28</text>
  <text class="tick zh" x="736" y="126">跟左邊一模一樣</text>

  <line class="guide" x1="536" y1="146" x2="960" y2="146"/>

