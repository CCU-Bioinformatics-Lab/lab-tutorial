<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 550">
  <title>tumor purity 越低，同一個突變在 read 上的訊號越淡</title>
  <desc>五個檢體帶有同一個 clonal、diploid 的 somatic 變異，每個腫瘤細胞在這個位置的兩份 DNA 中有一份帶突變，
        差別只在腫瘤細胞佔的比例。
        由左到右腫瘤細胞比例為五分之一到五分之五，對應的 VAF 依序為 0.10、0.20、0.30、0.40、0.50。
        在十條 read 的示意圖中，帶變異的 read 數依序為一到五條。
        換算到 50 倍覆蓋度，期望的支持 read 數依序為 5、10、15、20、25 條。
        最左側以紅色底標示：purity 0.2 時只期望看到約五條支持 read，
        與隨機定序錯誤偶然湊出的支持數量同一個量級，因此過濾參數必須隨 purity 調整。</desc>

  <text class="lbl bold zh" x="20" y="32">purity 越低，同一個突變在 read 上的訊號就越淡</text>
  <text class="tick zh" x="20" y="58">五個檢體帶有同一個 clonal 變異（腫瘤細胞的 2 份裡有 1 份帶突變），只有腫瘤細胞的比例不同。</text>

