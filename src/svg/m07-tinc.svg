  <text class="anno mid bold zh ok" x="172" y="344">保留為 somatic 候選</text>
  <text class="tick zh" x="42" y="384">腫瘤有、正常沒有 ——</text>
  <text class="tick zh" x="42" y="406">這是最單純的情況</text>

