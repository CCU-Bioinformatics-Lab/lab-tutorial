<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620">
  <title>同一個位置，在配對正常樣本裡看到訊號，有三種完全不同的意思</title>
  <desc>三欄的腫瘤樣本完全相同：24 條 read 裡有 6 條帶變異，VAF 都是 0.25。
        差別只在配對正常樣本。左欄正常樣本一條都沒有，這是最單純的 somatic。
        中欄正常樣本有 1 條，VAF 0.04 —— 這是正常組織裡混進了腫瘤細胞（tumour-in-normal
        contamination），變異仍然是 somatic，但「normal 有訊號就排除」的規則會把它刪掉。
        右欄正常樣本有 12 條，VAF 0.50，那是 heterozygous germline 該有的樣子，應該排除。
        所以判斷依據不是「normal 有沒有訊號」，而是「訊號有多強」，需要一個門檻；
        門檻放得太低會刪掉被污染樣本裡的真 somatic，放得太高會留下 germline。</desc>

  <text class="lbl bold zh" x="16" y="36">同一個位置，normal 裡的訊號強度說明三種不同的事</text>

  <!-- ① 乾淨的正常樣本 -->
