<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 486">
  <title>甲基化資料在程式裡的形狀：read × CpG 的 0／1 表</title>
  <desc>左：一個區域內的六條 read，每條 read 在五個 CpG 位點上各有一個甲基化狀態，
        實心表示已甲基化、空心表示未甲基化。
        中：同一份資料寫成矩陣，列是 read、欄是 CpG 位點，實心記為 1、空心記為 0。
        右：把每條 read 看成一個 0／1 向量後，可以計算兩條 read 之間的差異，
        得到 read 對 read 的距離矩陣，再用一般的階層式分群把 read 分成兩群。
        本圖說明後面兩種用法共用同一份資料形狀，
        而分群這一步是純粹的向量距離計算，與基因體座標無關。</desc>

  <text class="lbl bold zh" x="20" y="32">在程式裡，甲基化就是一張 0／1 表</text>
  <text class="tick zh" x="20" y="58">一列是一條 read，一欄是一個 CpG 位點。實心＝已甲基化（1），空心＝未甲基化（0）。</text>

