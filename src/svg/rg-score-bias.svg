<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480">
  <title>read-AF 差值總和有形狀偏誤：星狀永遠得零分，串接永遠贏</title>
  <desc>目前排序候選樹的分數，是把樹上每一組「祖先與後代」的 read-AF 相減再全部加起來。
        問題在於相加的項數本身由樹的形狀決定。
        圖上三個形狀由左到右：三個突變串成一條線、一條線加一個分支、三個都從根長出來的星狀。
        它們的祖先後代配對數分別是三、一、零。
        因此串接的分數是第一個減第三個的兩倍，中間的形狀只有一項，
        而星狀因為沒有任何祖先後代配對，分數恆等於零。
        結論寫在下方：只要 read-AF 不完全相等，串接的分數就是正的，
        而星狀永遠是零，所以當最小成本候選裡同時有這兩種形狀時，分支永遠贏不了。
        觀測到的最多的類別正好是多層無分支，佔三成八到五成三，
        這個偏誤剛好往那個方向推。
        最下方是替代方案：改用機率模型比較各個形狀解釋同一組 read-AF 的能力，
        而不是加總差值。
        讀法是：分數要能跨形狀比較，才不會讓形狀自己決定勝負。</desc>

  <text class="ttl zh" x="20" y="36">分數的形狀偏誤</text>
  <text class="anno zh" x="20" y="66">分數＝把樹上每一組「祖先→後代」的 read-AF 相減，全部加起來。項數由形狀決定。</text>

  <!-- 串接 -->
  <rect class="box ghost" x="24" y="88" width="300" height="230" rx="8"/>
  <text class="anno bold zh mid" x="174" y="118">串接</text>
  <circle class="mark somatic" cx="174" cy="150" r="10"/>
  <line class="conn" x1="174" y1="160" x2="174" y2="188"/>
  <circle class="mark somatic" cx="174" cy="198" r="10"/>
  <line class="conn" x1="174" y1="208" x2="174" y2="236"/>
  <circle class="mark somatic" cx="174" cy="246" r="10"/>
  <text class="tick zh mid" x="174" y="278">祖先後代配對：3 組</text>
  <text class="lbl mono mid ok" x="174" y="306">2(a₁ − a₃)</text>

  <!-- 一線一分支 -->
  <rect class="box ghost" x="350" y="88" width="300" height="230" rx="8"/>
  <text class="anno bold zh mid" x="500" y="118">一線加一分支</text>
  <circle class="mark somatic" cx="500" cy="150" r="10"/>
  <line class="conn" x1="492" y1="158" x2="452" y2="190"/>
  <line class="conn" x1="508" y1="158" x2="548" y2="190"/>
  <circle class="mark somatic" cx="446" cy="198" r="10"/>
  <circle class="mark somatic" cx="554" cy="198" r="10"/>
  <line class="conn" x1="446" y1="208" x2="446" y2="236"/>
  <circle class="mark somatic" cx="446" cy="246" r="10"/>
  <text class="tick zh mid" x="500" y="278">祖先後代配對：1 組</text>
  <text class="lbl mono mid" x="500" y="306">a₁ − a₂</text>

  <!-- 星狀 -->
  <rect class="box ghost bad" x="676" y="88" width="300" height="230" rx="8"/>
  <text class="anno bold zh mid" x="826" y="118">星狀（全分支）</text>
  <circle class="mark somatic" cx="826" cy="150" r="10"/>
  <line class="conn" x1="818" y1="158" x2="756" y2="192"/>
  <line class="conn" x1="826" y1="160" x2="826" y2="188"/>
  <line class="conn" x1="834" y1="158" x2="896" y2="192"/>
  <circle class="mark somatic" cx="750" cy="198" r="10"/>
  <circle class="mark somatic" cx="826" cy="198" r="10"/>
  <circle class="mark somatic" cx="902" cy="198" r="10"/>
  <text class="tick zh mid" x="826" y="278">祖先後代配對：0 組</text>
  <text class="lbl mono mid bad" x="826" y="306">恆等於 0</text>

  <rect class="box bad" x="24" y="336" width="952" height="60" rx="8"/>
  <text class="anno zh" x="48" y="364">只要 read-AF 不完全相等，串接就是正分，星狀恆為 0 ——</text>
  <text class="anno zh bad" x="48" y="388">所以最小成本候選裡同時有這兩種形狀時，<tspan class="bold">分支永遠贏不了</tspan>。</text>

  <text class="anno zh" x="24" y="428">觀測到最多的類別正好是「多層無分支」（38–53%），而這個偏誤剛好往那個方向推。</text>
  <text class="anno zh ok" x="24" y="458">替代方案：用機率模型比較各形狀解釋同一組 read-AF 的能力，而不是加總差值。</text>
</svg>
