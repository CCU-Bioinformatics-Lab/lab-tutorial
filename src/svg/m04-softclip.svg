<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560">
  <title>soft clip：read 端部未可靠對齊參考序列時的示意</title>
  <desc>最上方一列是參考基因體序列，每個字母一格。
        第二列示意左端 soft clipping：紅框表示未納入對齊的 read 端，圖中以 GCT…概略表示，
        對應的 CIGAR 為 10S；該序列仍保留在檔案中。右側另示意 2D，表示參考序列存在而 read 沒有。
        第三列示意右端 soft clipping，方向相反。
        下方比較兩種情況：clipping 可分散於不同 read 的端部；若多條 read 的 clipping 位置集中，
        可作為結構變異斷點候選，仍需結合其他證據確認。</desc>

  <!-- ══════ 參考基因體 ══════ -->
  <text class="anno bold zh" x="20" y="52">參考基因體</text>
  <text class="tick zh" x="20" y="76">（比對的基準）</text>

  <g>
    <rect class="box plain" x="300" y="32" width="28" height="28" rx="3"/><text class="base c mono mid" x="314" y="53" font-size="17">C</text>
    <rect class="box plain" x="334" y="32" width="28" height="28" rx="3"/><text class="base a mono mid" x="348" y="53" font-size="17">A</text>
    <rect class="box plain" x="368" y="32" width="28" height="28" rx="3"/><text class="base c mono mid" x="382" y="53" font-size="17">C</text>
    <rect class="box plain" x="402" y="32" width="28" height="28" rx="3"/><text class="base a mono mid" x="416" y="53" font-size="17">A</text>
    <rect class="box plain" x="436" y="32" width="28" height="28" rx="3"/><text class="base t mono mid" x="450" y="53" font-size="17">T</text>
    <rect class="box plain" x="470" y="32" width="28" height="28" rx="3"/><text class="base t mono mid" x="484" y="53" font-size="17">T</text>
    <rect class="box plain" x="504" y="32" width="28" height="28" rx="3"/><text class="base a mono mid" x="518" y="53" font-size="17">A</text>
    <rect class="box plain" x="538" y="32" width="28" height="28" rx="3"/><text class="base g mono mid" x="552" y="53" font-size="17">G</text>
    <rect class="box plain" x="572" y="32" width="28" height="28" rx="3"/><text class="base g mono mid" x="586" y="53" font-size="17">G</text>
    <rect class="box plain" x="606" y="32" width="28" height="28" rx="3"/><text class="base c mono mid" x="620" y="53" font-size="17">C</text>
    <rect class="box plain" x="640" y="32" width="28" height="28" rx="3"/><text class="base t mono mid" x="654" y="53" font-size="17">T</text>
    <rect class="box plain" x="674" y="32" width="28" height="28" rx="3"/><text class="base a mono mid" x="688" y="53" font-size="17">A</text>
    <rect class="box plain" x="708" y="32" width="28" height="28" rx="3"/><text class="base t mono mid" x="722" y="53" font-size="17">T</text>
    <rect class="box plain" x="742" y="32" width="28" height="28" rx="3"/><text class="base a mono mid" x="756" y="53" font-size="17">A</text>
  </g>

  <line class="guide" x1="300" y1="70" x2="300" y2="330"/>
  <text class="tick zh accent" x="306" y="86">比對從這裡開始</text>

  <!-- ══════ 左端被剪的 read ══════ -->
  <text class="anno bold zh artifact" x="20" y="140">左端被剪的 read</text>
  <text class="tick zh" x="20" y="164">前端未可靠對齊</text>

  <g>
    <!-- 被剪掉的部分：虛線紅框 -->
    <rect class="box ghost" x="198" y="120" width="96" height="28" rx="3" stroke="var(--artifact)" stroke-dasharray="5 3"/>
    <text class="mono mid artifact" x="246" y="140" font-size="15">GCT…</text>
    <!-- 對上的部分 -->
    <rect class="box plain" x="300" y="120" width="28" height="28" rx="3"/><text class="base a mono mid" x="314" y="141" font-size="17">A</text>
    <rect class="box plain" x="334" y="120" width="28" height="28" rx="3"/><text class="base t mono mid" x="348" y="141" font-size="17">T</text>
    <rect class="box plain" x="368" y="120" width="28" height="28" rx="3"/><text class="base t mono mid" x="382" y="141" font-size="17">T</text>
    <rect class="box plain" x="402" y="120" width="28" height="28" rx="3"/><text class="base a mono mid" x="416" y="141" font-size="17">A</text>
    <rect class="box plain" x="436" y="120" width="28" height="28" rx="3"/><text class="base g mono mid" x="450" y="141" font-size="17">G</text>
    <!-- 缺失：read 沒有這兩格 -->
    <rect class="box ghost" x="470" y="120" width="62" height="28" rx="3"/>
    <text class="tick mid" x="501" y="140">– –</text>
    <rect class="box plain" x="538" y="120" width="28" height="28" rx="3"/><text class="base t mono mid" x="552" y="141" font-size="17">T</text>
  </g>

  <!-- CIGAR -->
  <text class="tick zh" x="20" y="192">此 read 的 CIGAR</text>
  <text class="anno mono bold artifact mid" x="246" y="192">10S</text>
  <text class="anno mono bold mid" x="382" y="192">5M</text>
  <text class="anno mono bold hp2 mid" x="501" y="192">2D</text>
  <text class="anno mono bold mid" x="552" y="192">1M</text>

  <text class="tick zh" x="600" y="140">序列仍保留於檔案</text>
  <text class="tick zh" x="600" y="164">不計入對齊區段</text>
  <text class="tick zh hp2" x="600" y="192">2D＝參考有、read 沒有</text>

  <!-- ══════ 右端被剪的 read ══════ -->
  <text class="anno bold zh artifact" x="20" y="256">右端被剪的 read</text>
  <text class="tick zh" x="20" y="280">後端未可靠對齊</text>

  <g>
    <rect class="box plain" x="300" y="236" width="28" height="28" rx="3"/><text class="base a mono mid" x="314" y="257" font-size="17">A</text>
    <rect class="box plain" x="334" y="236" width="28" height="28" rx="3"/><text class="base t mono mid" x="348" y="257" font-size="17">T</text>
    <rect class="box plain" x="368" y="236" width="28" height="28" rx="3"/><text class="base t mono mid" x="382" y="257" font-size="17">T</text>
    <rect class="box plain" x="402" y="236" width="28" height="28" rx="3"/><text class="base a mono mid" x="416" y="257" font-size="17">A</text>
    <rect class="box plain" x="436" y="236" width="28" height="28" rx="3"/><text class="base g mono mid" x="450" y="257" font-size="17">G</text>
    <rect class="box plain" x="470" y="236" width="28" height="28" rx="3"/><text class="base g mono mid" x="484" y="257" font-size="17">G</text>
    <rect class="box plain" x="504" y="236" width="28" height="28" rx="3"/><text class="base c mono mid" x="518" y="257" font-size="17">C</text>
    <rect class="box plain" x="538" y="236" width="28" height="28" rx="3"/><text class="base t mono mid" x="552" y="257" font-size="17">T</text>
    <rect class="box ghost" x="572" y="236" width="96" height="28" rx="3" stroke="var(--artifact)" stroke-dasharray="5 3"/>
    <text class="mono mid artifact" x="620" y="256" font-size="15">AGC…</text>
  </g>

  <text class="tick zh" x="20" y="308">此 read 的 CIGAR</text>
  <text class="anno mono bold mid" x="430" y="308">8M</text>
  <text class="anno mono bold artifact mid" x="620" y="308">10S</text>

  <!-- ══════ 為什麼重要 ══════ -->
  <line class="axis" x1="20" y1="342" x2="980" y2="342"/>
  <text class="lbl bold zh" x="20" y="374">單一 read 的 clipping 可見於技術或比對現象；若多條在<tspan class="bold somatic">同一位置</tspan>出現 ——</text>

  <!-- 左：散落的 clipping（正常） -->
  <rect class="box ok" x="20" y="392" width="466" height="148" rx="8"/>
  <text class="anno bold zh ok" x="42" y="420">位置分散：可見於一般現象</text>

  <rect class="read hp0" x="60" y="436" width="150" height="11" rx="5.5"/>
  <rect class="box ghost" x="46" y="436" width="14" height="11" rx="2" stroke="var(--artifact)" stroke-dasharray="3 2"/>
  <rect class="read hp0" x="140" y="452" width="160" height="11" rx="5.5"/>
  <rect class="read hp0" x="90" y="468" width="170" height="11" rx="5.5"/>
  <rect class="box ghost" x="260" y="468" width="14" height="11" rx="2" stroke="var(--artifact)" stroke-dasharray="3 2"/>
  <rect class="read hp0" x="200" y="484" width="180" height="11" rx="5.5"/>
  <rect class="read hp0" x="120" y="500" width="200" height="11" rx="5.5"/>
  <rect class="box ghost" x="320" y="500" width="14" height="11" rx="2" stroke="var(--artifact)" stroke-dasharray="3 2"/>

  <text class="tick zh" x="42" y="530">clipping 可分散於不同 read 的端部</text>

  <!-- 右：集中的 clipping（斷點） -->
  <rect class="box bad" x="510" y="392" width="470" height="148" rx="8"/>
  <text class="anno bold zh bad" x="532" y="420">位置集中：結構變異斷點候選</text>

  <line class="axis" x1="742" y1="428" x2="742" y2="516" stroke="var(--bad)" stroke-width="3"/>

  <rect class="read hp0" x="592" y="436" width="150" height="11" rx="5.5"/>
  <rect class="box ghost" x="742" y="436" width="16" height="11" rx="2" stroke="var(--artifact)" stroke-dasharray="3 2"/>
  <rect class="read hp0" x="576" y="452" width="166" height="11" rx="5.5"/>
  <rect class="box ghost" x="742" y="452" width="16" height="11" rx="2" stroke="var(--artifact)" stroke-dasharray="3 2"/>
  <rect class="read hp0" x="604" y="468" width="138" height="11" rx="5.5"/>
  <rect class="box ghost" x="742" y="468" width="16" height="11" rx="2" stroke="var(--artifact)" stroke-dasharray="3 2"/>
  <rect class="read hp0" x="586" y="484" width="156" height="11" rx="5.5"/>
  <rect class="box ghost" x="742" y="484" width="16" height="11" rx="2" stroke="var(--artifact)" stroke-dasharray="3 2"/>
  <rect class="read hp0" x="598" y="500" width="144" height="11" rx="5.5"/>
  <rect class="box ghost" x="742" y="500" width="16" height="11" rx="2" stroke="var(--artifact)" stroke-dasharray="3 2"/>

  <text class="tick zh bad bold" x="532" y="530">read 與參考序列的對齊可能不一致，需進一步確認</text>
</svg>
