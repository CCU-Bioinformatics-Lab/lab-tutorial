<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480">
  <title>三層資訊：全基因體只有邊際、phase block 知道 cis／trans、read 跨距內才數得到共現</title>
  <desc>三層由下而上代表資訊愈來愈完整，但涵蓋範圍愈來愈小。
        最下層是全基因體，任何兩個位點之間都只有各自的邊際頻率，沒有共現關係。
        中間層是 phase block，典型長度一到五個 Mb，在這個範圍內兩個位點是在同一條染色體
        還是分開在兩條，是已知的，即使沒有任何一條 read 同時蓋到它們。
        最上層是 read 跨距，典型二十個 kb，只有在這個範圍內才數得出「同時帶有兩個變異的分子有幾條」。
        右側標出每一層在一個典型樣本裡各有多少筆可用觀測：
        read 跨距內的聯合計數約數百到數萬筆，phase block 內的 cis／trans 判定約多一百倍，
        全基因體邊際則涵蓋全部變異。
        讀法是：read 長度限制的是「數得到共現」，phase block 限制的是「知道在不在同一條染色體上」，
        這兩件事的範圍差了兩個數量級，常被混為一談。</desc>

  <text class="ttl zh" x="20" y="36">三層資訊：範圍愈小，資訊愈完整</text>

  <!-- 第三層：全基因體 -->
  <rect class="box" x="24" y="330" width="700" height="86" rx="8"/>
  <text class="lbl bold zh" x="44" y="362">③ 全基因體</text>
  <text class="anno zh" x="44" y="392">只有邊際頻率（VAF、β）—— 傳統路線整個住在這一層</text>
  <text class="anno zh mid" x="860" y="362">全部變異</text>
  <text class="tick zh mid" x="860" y="390">數百萬筆</text>

  <!-- 第二層：phase block -->
  <rect class="box accent" x="24" y="216" width="520" height="86" rx="8"/>
  <text class="lbl bold zh" x="44" y="248">② phase block（1–5 Mb）</text>
  <text class="anno zh" x="44" y="278">cis／trans 已知，但數不到共現分子數</text>
  <text class="anno zh mid" x="860" y="248">cis／trans 判定</text>
  <text class="tick zh mid" x="860" y="276">約 7 萬筆</text>

  <!-- 第一層：read 跨距 -->
  <rect class="box ok" x="24" y="102" width="240" height="86" rx="8"/>
  <text class="lbl bold zh" x="44" y="134">① read 跨距（20 kb）</text>
  <text class="anno zh" x="44" y="164">聯合計數看得到</text>
  <text class="anno zh mid" x="860" y="134">聯合計數</text>
  <text class="tick zh mid" x="860" y="162">數百到數萬筆</text>

  <line class="guide muted" x1="600" y1="120" x2="740" y2="120"/>
  <line class="guide muted" x1="600" y1="234" x2="740" y2="234"/>
  <line class="guide muted" x1="740" y1="348" x2="740" y2="348"/>

  <path class="conn thick ok" d="M290,145 L560,145" marker-end="url(#arrow)"/>
  <text class="tick zh ok" x="300" y="130">資訊最完整</text>
  <path class="conn thick" d="M570,259 L700,259" marker-end="url(#arrow)"/>
  <text class="tick zh" x="580" y="244">涵蓋最廣</text>

  <text class="anno zh bad" x="24" y="450">最常見的誤解：把 ① 與 ② 當成同一件事。read 長度限制的是「數得到共現」，</text>
  <text class="tick zh bad" x="24" y="472">phase block 限制的是「知不知道在同一條染色體上」—— 兩者範圍差約一百倍。</text>
</svg>
