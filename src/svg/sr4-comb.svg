<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500">
  <title>單倍型內 somatic 佔比的可能值構成一組齒，依拷貝數分層之後才對得上</title>
  <desc>細胞比例固定在零點五。
        上排是不分層的情形：把所有體細胞變異位點的佔比畫在同一條軸上。
        因為多重度必須是不超過該單倍型拷貝數的正整數，
        佔比只能落在幾個特定位置，形成一排齒，分別是零點二五、零點三三、
        零點五、零點六七與零點七五。
        但不同拷貝數的齒混在一起，而且拷貝數一份多重度一份的那一齒，
        和拷貝數三份多重度兩份的那一齒，恰好都落在零點五，兩者重合。
        所以直接在這條軸上找最高峰，找到的不一定是細胞比例。
        下排是分層之後：拷貝數由前兩個通道就地取得，
        位點依所在區段的拷貝數分成三層。
        每一層的齒位是已知的有限集合，重合消失。
        最上面那一層拷貝數是一份，多重度只能是一份，
        所以佔比就等於細胞比例乘上帶原細胞比例，
        它的上包絡就是細胞比例，依據是主幹變異一定存在。
        每一齒往左的灰色拖尾，是帶原細胞比例小於一的次群變異。
        讀法是：先分層再讀，不要直接找峰。</desc>

  <text class="ttl zh" x="20" y="36">先分層，再讀 s 的上包絡</text>
  <text class="anno zh" x="20" y="66">純度固定為 <tspan class="mono">0.50</tspan>。齒位由 <tspan class="mono">(n₁, μ)</tspan> 決定，其中 <tspan class="mono">μ</tspan> 為不超過 <tspan class="mono">n₁</tspan> 的正整數。</text>

  <!-- ══ 上：未分層 ══ -->
  <rect class="box ghost bad" x="20" y="88" width="960" height="150" rx="8"/>
  <text class="anno bold zh" x="44" y="118">未分層：三種拷貝數的齒混在同一條軸上</text>

  <line class="axis bad" x1="120" y1="200" x2="900" y2="200"/>
  <text class="tick mid" x="120" y="222">0</text>
  <text class="tick mid" x="315" y="222">0.25</text>
  <text class="tick mid" x="510" y="222">0.50</text>
  <text class="tick mid" x="705" y="222">0.75</text>
  <text class="tick mid" x="900" y="222">1.00</text>

  <rect class="bar somatic" x="307" y="164" width="16" height="36"/>
  <rect class="bar somatic" x="372" y="152" width="16" height="48"/>
  <rect class="bar somatic" x="502" y="140" width="16" height="60"/>
  <rect class="bar somatic" x="632" y="152" width="16" height="48"/>
  <rect class="bar somatic" x="697" y="164" width="16" height="36"/>

  <text class="tick bad zh mid" x="510" y="134">此齒為兩組重合</text>

  <!-- ══ 下：分層 ══ -->
  <rect class="box ghost ok" x="20" y="250" width="960" height="196" rx="8"/>
  <text class="anno bold zh" x="44" y="280">依 <tspan class="mono">n₁</tspan> 分層：各層的齒位為已知的有限集合</text>

  <text class="tick mono" x="44" y="316">n₁ = 1</text>
  <line class="axis ok" x1="120" y1="316" x2="900" y2="316"/>
  <rect class="box ghost" x="300" y="304" width="202" height="12" rx="3"/>
  <rect class="bar ok" x="502" y="292" width="16" height="24"/>
  <text class="tick ok zh" x="530" y="310">唯一的齒，其上包絡即為純度</text>

  <text class="tick mono" x="44" y="366">n₁ = 2</text>
  <line class="axis" x1="120" y1="366" x2="900" y2="366"/>
  <rect class="bar somatic" x="372" y="342" width="16" height="24"/>
  <rect class="bar somatic" x="632" y="342" width="16" height="24"/>
  <text class="tick zh" x="676" y="360">兩齒：μ 為 1 或 2</text>

  <text class="tick mono" x="44" y="416">n₁ = 3</text>
  <line class="axis" x1="120" y1="416" x2="900" y2="416"/>
  <rect class="bar somatic" x="307" y="392" width="16" height="24"/>
  <rect class="bar somatic" x="502" y="392" width="16" height="24"/>
  <rect class="bar somatic" x="697" y="392" width="16" height="24"/>
  <text class="tick zh" x="741" y="410">三齒：μ 為 1、2 或 3</text>

  <text class="tick mid" x="120" y="440">0</text>
  <text class="tick mid" x="510" y="440">0.50</text>
  <text class="tick mid" x="900" y="440">1.00</text>

  <!-- 結論 -->
  <rect class="box accent" x="20" y="458" width="960" height="34" rx="8"/>
  <text class="anno zh" x="40" y="482">灰色拖尾為 <tspan class="mono">c &lt; 1</tspan> 的 subclonal 變異，故每一齒實為<tspan class="bold">上界</tspan>；<tspan class="mono">n₁</tspan> 由通道一與通道二就地取得，不需另行猜測。</text>
</svg>
