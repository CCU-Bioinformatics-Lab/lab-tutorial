<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700">
  <title>數百個單位的局部拓撲形狀不同是預期結果：它們是同一棵 clone tree 在不同變異子集上的投影</title>
  <desc>上排是三個不同的分析單位，各自的局部拓撲形狀完全不同。
        單位甲含有屬於 clone A 與 clone B 的變異，局部拓撲是一條線；
        單位乙含有屬於 clone B 與 clone C 的變異，兩者互不包含，局部拓撲是分岔；
        單位丙含有三個都屬於 clone C 的變異，局部拓撲只有一個節點。
        中排說明它們為何不互相矛盾：每個單位只裝得下落在該視窗內的那幾個變異，
        所以每個局部拓撲都是同一棵全基因體 clone tree 在不同變異子集上的投影。
        形狀不同是因為子集不同，不是因為證據衝突。
        右排是那棵全域的 clone tree，A 分支到 B 與 C。
        下排標出兩件事。左邊：可以合併的是約束，不可以合併的是標籤 ——
        局部的 HP1-1 只在該區域內有定義，跨區域的同名標籤並非同一條，
        所以永遠不要把局部拓撲拼起來，要合併的是它們對全域變數的限制。
        右邊：真正的矛盾不是形狀不同，而是約束集合找不到任何一組
        指派與樹能同時滿足，具體有三種形式 ——
        直接對立、違反傳遞性、以及祖先關係成環。</desc>

  <text class="ttl zh" x="20" y="38">局部拓撲形狀不同，不等於互相矛盾</text>
  <text class="anno zh" x="20" y="66">每個單位只裝得下落在該視窗內的變異，所以它看到的是同一棵樹的<tspan class="bold">一個子集</tspan>。</text>
  <line class="axis" x1="20" y1="86" x2="980" y2="86"/>

  <!-- ══════════ 左：三個單位，三種形狀 ══════════ -->
  <text class="lbl bold zh" x="20" y="118">三個單位各自看到的</text>

  <rect class="box plain" x="20" y="134" width="300" height="88" rx="8"/>
  <text class="tick bold zh" x="36" y="158">單位甲　變異屬於 A 與 B</text>
  <circle class="mark germline" cx="60" cy="190" r="12"/><text class="tick mid" x="60" y="195">A</text>
  <path class="conn" d="M73,190 L101,190" marker-end="url(#arrow-sm)"/>
  <circle class="mark hp1" cx="114" cy="190" r="12"/><text class="tick mid" x="114" y="195">B</text>
  <text class="tick zh" x="140" y="195">→ 串接，給出祖先關係</text>

  <rect class="box plain" x="20" y="234" width="300" height="106" rx="8"/>
  <text class="tick bold zh" x="36" y="258">單位乙　變異屬於 B 與 C</text>
  <circle class="mark hp1" cx="70" cy="292" r="12"/><text class="tick mid" x="70" y="297">B</text>
  <circle class="mark hp2" cx="126" cy="292" r="12"/><text class="tick mid" x="126" y="297">C</text>
  <path class="conn bad" d="M84,292 L112,292"/>
  <path class="conn bad" d="M91,285 L105,299"/>
  <text class="tick zh" x="152" y="297">→ 分岔，給出不可同群</text>
  <text class="tick zh" x="36" y="326">（此單位沒有 A 的變異，故 A 不在圖上）</text>

  <rect class="box plain" x="20" y="352" width="300" height="88" rx="8"/>
  <text class="tick bold zh" x="36" y="376">單位丙　三個變異都屬於 C</text>
  <circle class="mark hp2" cx="70" cy="408" r="12"/><text class="tick mid" x="70" y="413">C</text>
  <text class="tick zh" x="96" y="413">→ 單一節點，不產生關係約束</text>

  <path class="conn" d="M330,288 L370,288" marker-end="url(#arrow)"/>

  <!-- ══════════ 中：為什麼不矛盾 ══════════ -->
  <text class="lbl bold zh" x="384" y="118">為什麼不矛盾</text>
  <rect class="box sunken" x="384" y="134" width="286" height="306" rx="8"/>

  <text class="anno zh" x="402" y="170">三張圖形狀不同，是因為</text>
  <text class="anno zh bold" x="402" y="198">它們裝的變異子集不同，</text>
  <text class="anno zh bold" x="402" y="226">不是因為證據互相衝突。</text>

  <line class="guide" x1="402" y1="248" x2="652" y2="248"/>

  <text class="anno zh" x="402" y="282">每個局部拓撲都是同一棵</text>
  <text class="anno zh" x="402" y="310">全域 clone tree 在該子集</text>
  <text class="anno zh" x="402" y="338">上的<tspan class="bold">投影</tspan>。</text>

  <text class="tick zh" x="402" y="378">甲看到 {A, B}，乙看到 {B, C}，</text>
  <text class="tick zh" x="402" y="402">丙只看到 {C} —— 三者的投影</text>
  <text class="tick zh" x="402" y="426">合起來才還原出右邊那棵樹。</text>

  <path class="conn" d="M680,288 L720,288" marker-end="url(#arrow)"/>

  <!-- ══════════ 右：全域 clone tree ══════════ -->
  <text class="lbl bold zh ok" x="734" y="118">全域的 clone tree</text>
  <rect class="box ok" x="734" y="134" width="246" height="306" rx="8"/>

  <circle class="mark germline" cx="857" cy="200" r="18"/><text class="lbl mid" x="857" y="207">A</text>
  <path class="conn thick" d="M857,220 L805,268" marker-end="url(#arrow-sm)"/>
  <path class="conn thick" d="M857,220 L909,268" marker-end="url(#arrow-sm)"/>
  <circle class="mark hp1" cx="797" cy="282" r="18"/><text class="lbl mid" x="797" y="289">B</text>
  <circle class="mark hp2" cx="917" cy="282" r="18"/><text class="lbl mid" x="917" y="289">C</text>

  <text class="tick zh mid" x="857" y="334">只有這一棵是全域的，</text>
  <text class="tick zh mid" x="857" y="358">而且是<tspan class="bold">估計式的輸出</tspan>，</text>
  <text class="tick zh mid" x="857" y="382">不是把三張局部圖拼出來的。</text>

  <!-- ══════════ 下：兩個要點 ══════════ -->
  <line class="axis" x1="20" y1="470" x2="980" y2="470"/>

  <rect class="box warn" x="20" y="492" width="470" height="188" rx="8"/>
  <text class="lbl bold zh warn" x="40" y="524">可以合併的是約束，不是標籤</text>
  <text class="anno zh" x="40" y="558">局部標籤（HP1-1）<tspan class="bold">只在該區域內有定義</tspan>，</text>
  <text class="anno zh" x="40" y="586">跨區域的同名標籤並不是同一條。</text>
  <text class="tick zh" x="40" y="618">所以永遠不要把局部拓撲拼起來 ——</text>
  <text class="tick zh" x="40" y="642">要合併的是它們對全域變數 z 與 T 的限制，</text>
  <text class="tick zh" x="40" y="666">而 z 與 T 本來就只有一份。</text>

  <rect class="box bad" x="510" y="492" width="470" height="188" rx="8"/>
  <text class="lbl bold zh bad" x="530" y="524">真正的矛盾長這樣</text>
  <text class="anno zh" x="530" y="558">不是形狀不同，而是<tspan class="bold">找不到任何一組 (z, T)</tspan></text>
  <text class="anno zh" x="530" y="586">能同時滿足全部約束。三種形式：</text>
  <text class="tick zh" x="530" y="618">① 直接對立：一邊不可同群、另一邊必定同群</text>
  <text class="tick zh" x="530" y="642">② 違反傳遞性：i＝j、j＝k，卻又 i≠k</text>
  <text class="tick zh" x="530" y="666">③ 祖先關係成環：a → b → c → a</text>
</svg>
