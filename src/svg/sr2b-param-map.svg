<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400">
  <title>二十幾個符號，真正在搜尋的只有中間那五個</title>
  <desc>圖由左至右是一條決定關係的鏈。
        左欄是進模型前就要備妥的量：拷貝數、過度離散度、逐位點錯誤率、家族誤標率、
        有效資訊量與覆蓋遮罩，共六個。它們被一個紅色虛線框圈起來，
        因為這一側估偏時不會有任何錯誤訊息，模型照樣收斂，只是收斂到錯的群數與錯的樹。
        中欄是主模型真正在搜尋的東西，只有五個：群數、clone tree、突變指派、
        逐拷貝基因型，以及一組細胞比例。
        右欄是沿箭頭算出來的推導量：純度、CCF、multiplicity、預期 VAF 與分子比例、
        錯誤地板總量，它們不是額外的自由參數。
        兩支粗箭頭標出方向：左欄餵進來，右欄算出去。
        所以符號雖多，待估的只有中間那一欄。</desc>

  <text class="ttl zh" x="20" y="38">二十幾個符號，真正在搜尋的只有五個</text>

  <!-- ══ 左：進模型前備妥 ══ -->
  <rect class="box ghost bad" x="28" y="76" width="240" height="278" rx="10"/>
  <text class="lbl bold zh" x="36" y="70">① 進模型前備妥</text>

  <rect class="box sunken" x="36" y="84" width="224" height="36" rx="8"/>
  <text class="lbl bold zh" x="50" y="108">CN<tspan style="font-size:15px" dy="4">m</tspan></text>
  <text class="tick zh" x="126" y="108">拷貝數</text>

  <rect class="box sunken" x="36" y="128" width="224" height="36" rx="8"/>
  <text class="lbl bold zh" x="50" y="152">φ</text>
  <text class="tick zh" x="126" y="152">過度離散度</text>

  <rect class="box sunken" x="36" y="172" width="224" height="36" rx="8"/>
  <text class="lbl bold zh" x="50" y="196">ε</text>
  <text class="tick zh" x="126" y="196">逐位點錯誤</text>

  <rect class="box sunken" x="36" y="216" width="224" height="36" rx="8"/>
  <text class="lbl bold zh" x="50" y="240">ξ<tspan style="font-size:15px" dy="4">v</tspan></text>
  <text class="tick zh" x="126" y="240">家族誤標</text>

  <rect class="box sunken" x="36" y="260" width="224" height="36" rx="8"/>
  <text class="lbl bold zh" x="50" y="284">M<tspan style="font-size:15px" dy="4">eff</tspan></text>
  <text class="tick zh" x="126" y="284">有效資訊量</text>

  <rect class="box sunken" x="36" y="304" width="224" height="36" rx="8"/>
  <text class="lbl bold zh" x="50" y="328">遮罩</text>
  <text class="tick zh" x="126" y="328">覆蓋幾何</text>

  <text class="tick zh bad" x="30" y="376">估偏時不會報錯，只是安靜收斂到錯的 K</text>

  <!-- 餵進來 -->
  <path class="conn thick" d="M270,212 L322,212" marker-end="url(#arrow-sm)"/>
  <text class="tick zh mid" x="296" y="200">餵進來</text>

  <!-- ══ 中：主模型自由估 ══ -->
  <rect class="box ok" x="330" y="112" width="250" height="252" rx="10"/>
  <text class="lbl bold zh ok" x="338" y="70">② 主模型自由估</text>
  <text class="tick zh ok" x="338" y="100">只有這五個在搜尋</text>

  <rect class="box sunken" x="346" y="122" width="218" height="34" rx="8"/>
  <text class="lbl bold zh" x="360" y="146">K</text>
  <text class="tick zh" x="418" y="146">群數</text>

  <rect class="box sunken" x="346" y="164" width="218" height="34" rx="8"/>
  <text class="lbl bold zh" x="360" y="188">T</text>
  <text class="tick zh" x="418" y="188">clone tree</text>

  <rect class="box sunken" x="346" y="206" width="218" height="34" rx="8"/>
  <text class="lbl bold zh" x="360" y="230">z</text>
  <text class="tick zh" x="418" y="230">突變指派</text>

  <rect class="box sunken" x="346" y="248" width="218" height="34" rx="8"/>
  <text class="lbl bold zh" x="360" y="272">G</text>
  <text class="tick zh" x="418" y="272">逐拷貝基因型</text>

  <rect class="box sunken" x="346" y="290" width="218" height="34" rx="8"/>
  <text class="lbl bold zh" x="360" y="314">w</text>
  <text class="tick zh" x="418" y="314">細胞比例</text>

  <text class="tick zh ok" x="346" y="348">自由度 K 個，定義域是一個 simplex</text>

  <!-- 算出來 -->
  <path class="conn thick" d="M586,212 L682,212" marker-end="url(#arrow-sm)"/>
  <text class="tick zh mid" x="634" y="200">算出來</text>

  <!-- ══ 右：推導量 ══ -->
  <text class="lbl bold zh" x="700" y="70">③ 沿箭頭算出來</text>
  <text class="tick zh" x="700" y="100">不是額外的參數</text>

  <rect class="box sunken" x="700" y="112" width="260" height="36" rx="8"/>
  <text class="lbl bold zh" x="714" y="136">ρ</text>
  <text class="tick zh" x="772" y="136">純度 ＝ 1 − w₀</text>

  <rect class="box sunken" x="700" y="156" width="260" height="36" rx="8"/>
  <text class="lbl bold zh" x="714" y="180">c<tspan style="font-size:15px" dy="4">k</tspan></text>
  <text class="tick zh" x="772" y="180">CCF</text>

  <rect class="box sunken" x="700" y="200" width="260" height="36" rx="8"/>
  <text class="lbl bold zh" x="714" y="224">μ<tspan style="font-size:15px" dy="4">m</tspan></text>
  <text class="tick zh" x="772" y="224">multiplicity</text>

  <rect class="box sunken" x="700" y="244" width="260" height="36" rx="8"/>
  <text class="lbl bold zh" x="714" y="268">θ、q</text>
  <text class="tick zh" x="800" y="268">預期 VAF 與分子比例</text>

  <rect class="box sunken" x="700" y="288" width="260" height="36" rx="8"/>
  <text class="lbl bold zh" x="714" y="312">δ<tspan style="font-size:15px" dy="4">v</tspan></text>
  <text class="tick zh" x="772" y="312">錯誤地板總量</text>
</svg>
