  <text class="base c mono" x="521" y="260" font-size="15">C</text>
  <text class="base t mono" x="547" y="260" font-size="15">T</text>
  <text class="base g mono" x="573" y="260" font-size="15">G</text>
  <text class="base a mono" x="599" y="260" font-size="15">A</text>

  <text class="anno zh bold" x="638" y="152">每一條長得都一樣。</text>
  <text class="anno zh" x="638" y="184">哪些來自正常細胞、</text>
  <text class="anno zh" x="638" y="212">哪些來自癌細胞、</text>
  <text class="anno zh" x="638" y="240">哪個字母是機器讀錯的 ——</text>
  <text class="anno zh bold bad" x="638" y="268">資料本身沒有標。</text>

  <path class="flow" d="M500,282 L500,310" marker-end="url(#arrow)"/>

  <!-- ══════════ ② 軟體 ══════════ -->
  <rect class="box accent" x="16" y="314" width="968" height="82" rx="10"/>
  <text class="lbl mid bold zh" x="500" y="348">② 這個實驗室寫的軟體</text>
  <text class="anno mid zh" x="500" y="378">C++ 程式：從這堆字串反推出每一條的來源</text>

  <path class="flow" d="M500,398 L500,426" marker-end="url(#arrow)"/>

  <!-- ══════════ ③ 輸出 ══════════ -->
  <rect class="box ok" x="16" y="430" width="968" height="222" rx="10"/>
  <text class="lbl bold zh" x="40" y="464">③ 軟體要算出來的東西</text>

  <text class="lbl bold hp1 zh" x="46" y="512">第 1 份 DNA</text>
  <text class="lbl bold hp2 zh" x="46" y="600">第 2 份 DNA</text>
  <text class="tick zh" x="46" y="634">編號只是標籤，沒有先後之分</text>

  <!-- 標出癌細胞才有的那一欄 -->
  <rect class="region bad" x="482" y="514" width="26" height="56"/>

  <rect class="read hp1" x="300" y="486" width="312" height="22" rx="6"/>
  <text class="base a mono" x="313" y="502" font-size="15">A</text>
  <text class="base t mono" x="339" y="502" font-size="15">T</text>
