<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 668">
  <title>這個實驗室在寫什麼軟體</title>
  <desc>由上而下三層。第一層是輸入：一管檢體裡同時有正常細胞與癌細胞，定序機把 DNA 打斷成片段逐條讀出，
        得到一堆長得一樣的字串；字串本身沒有標記來源，也沒有標記哪個字母是機器讀錯的。
        第二層是本實驗室開發的 C++ 軟體。第三層是輸出：每一條片段被判回它屬於哪一份 DNA，
        哪些變異是癌細胞才有的，以及這管檢體裡癌細胞佔多少比例。</desc>

  <!-- ══════════ ① 輸入 ══════════ -->
  <rect class="box" x="16" y="40" width="968" height="240" rx="10"/>
  <text class="lbl bold zh" x="40" y="74">① 定序機丟給你的東西</text>

  <!-- 檢體 -->
  <rect class="box plain" x="40" y="92" width="196" height="160" rx="10"/>
  <text class="anno mid bold zh" x="138" y="120">一管檢體</text>
  <circle class="cell normal" cx="74"  cy="156" r="14"/>
  <circle class="cell tumor"  cx="110" cy="156" r="14"/>
  <circle class="cell normal" cx="146" cy="156" r="14"/>
  <circle class="cell normal" cx="182" cy="156" r="14"/>
  <circle class="cell tumor"  cx="74"  cy="194" r="14"/>
  <circle class="cell normal" cx="110" cy="194" r="14"/>
  <circle class="cell tumor"  cx="146" cy="194" r="14"/>
  <circle class="cell normal" cx="182" cy="194" r="14"/>
  <text class="tick mid zh" x="138" y="234">正常細胞與癌細胞混在一起</text>

  <!-- 定序箭頭 -->
  <path class="flow" d="M244,172 L286,172" marker-end="url(#arrow)"/>
  <text class="tick mid zh" x="265" y="150">定序</text>

  <!-- read 堆：所有 read 都是 hp0（來源未知） -->
  <text class="anno zh" x="300" y="118">機器讀出來的片段</text>

  <rect class="read hp0" x="300" y="132" width="312" height="22" rx="6"/>
  <text class="base a mono" x="313" y="148" font-size="15">A</text>
  <text class="base t mono" x="339" y="148" font-size="15">T</text>
  <text class="base g mono" x="365" y="148" font-size="15">G</text>
  <text class="base a mono" x="391" y="148" font-size="15">A</text>
  <text class="base c mono" x="417" y="148" font-size="15">C</text>
  <text class="base t mono" x="443" y="148" font-size="15">T</text>
  <text class="base g mono" x="469" y="148" font-size="15">G</text>
  <text class="base a mono" x="495" y="148" font-size="15">A</text>
  <text class="base c mono" x="521" y="148" font-size="15">C</text>
  <text class="base t mono" x="547" y="148" font-size="15">T</text>
  <text class="base g mono" x="573" y="148" font-size="15">G</text>
  <text class="base a mono" x="599" y="148" font-size="15">A</text>

  <rect class="read hp0" x="300" y="160" width="312" height="22" rx="6"/>
  <text class="base a mono" x="313" y="176" font-size="15">A</text>
  <text class="base t mono" x="339" y="176" font-size="15">T</text>
  <text class="base g mono" x="365" y="176" font-size="15">G</text>
  <text class="base g mono" x="391" y="176" font-size="15">G</text>
  <text class="base c mono" x="417" y="176" font-size="15">C</text>
  <text class="base t mono" x="443" y="176" font-size="15">T</text>
  <text class="base g mono" x="469" y="176" font-size="15">G</text>
  <text class="base a mono" x="495" y="176" font-size="15">A</text>
  <text class="base c mono" x="521" y="176" font-size="15">C</text>
  <text class="base t mono" x="547" y="176" font-size="15">T</text>
  <text class="base g mono" x="573" y="176" font-size="15">G</text>
  <text class="base a mono" x="599" y="176" font-size="15">A</text>

  <rect class="read hp0" x="300" y="188" width="312" height="22" rx="6"/>
  <text class="base a mono" x="313" y="204" font-size="15">A</text>
  <text class="base t mono" x="339" y="204" font-size="15">T</text>
  <text class="base g mono" x="365" y="204" font-size="15">G</text>
  <text class="base a mono" x="391" y="204" font-size="15">A</text>
  <text class="base c mono" x="417" y="204" font-size="15">C</text>
  <text class="base t mono" x="443" y="204" font-size="15">T</text>
  <text class="base g mono" x="469" y="204" font-size="15">G</text>
