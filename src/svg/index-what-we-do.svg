  <text class="base a mono" x="313" y="232" font-size="15">A</text>
  <text class="base t mono" x="339" y="232" font-size="15">T</text>
  <text class="base g mono" x="365" y="232" font-size="15">G</text>
  <text class="base g mono" x="391" y="232" font-size="15">G</text>
  <text class="base c mono" x="417" y="232" font-size="15">C</text>
  <text class="base t mono" x="443" y="232" font-size="15">T</text>
  <text class="base g mono" x="469" y="232" font-size="15">G</text>
  <text class="base a mono" x="495" y="232" font-size="15">A</text>
  <text class="base c mono" x="521" y="232" font-size="15">C</text>
  <text class="base c mono" x="547" y="232" font-size="15">C</text>
  <text class="base g mono" x="573" y="232" font-size="15">G</text>
  <text class="base a mono" x="599" y="232" font-size="15">A</text>

  <rect class="read hp0" x="300" y="244" width="312" height="22" rx="6"/>
  <text class="base a mono" x="313" y="260" font-size="15">A</text>
  <text class="base t mono" x="339" y="260" font-size="15">T</text>
  <text class="base g mono" x="365" y="260" font-size="15">G</text>
  <text class="base a mono" x="391" y="260" font-size="15">A</text>
  <text class="base c mono" x="417" y="260" font-size="15">C</text>
  <text class="base t mono" x="443" y="260" font-size="15">T</text>
  <text class="base g mono" x="469" y="260" font-size="15">G</text>
