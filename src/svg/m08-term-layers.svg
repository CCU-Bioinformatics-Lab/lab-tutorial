  <circle class="mark ref" cx="767" cy="248" r="4"/>
  <rect class="read" x="708" y="256" width="118" height="10" rx="5"/>
  <circle class="mark ref" cx="767" cy="261" r="4"/>
  <rect class="read" x="708" y="269" width="118" height="10" rx="5"/>
  <circle class="mark ref" cx="767" cy="274" r="4"/>
  <rect class="read" x="834" y="152" width="118" height="10" rx="5"/>
  <circle class="mark ref" cx="893" cy="157" r="4"/>
  <rect class="read" x="834" y="165" width="118" height="10" rx="5"/>
  <circle class="mark ref" cx="893" cy="170" r="4"/>
  <rect class="read" x="834" y="178" width="118" height="10" rx="5"/>
  <circle class="mark ref" cx="893" cy="183" r="4"/>
  <rect class="read" x="834" y="191" width="118" height="10" rx="5"/>
  <circle class="mark ref" cx="893" cy="196" r="4"/>
  <rect class="read" x="834" y="204" width="118" height="10" rx="5"/>
  <circle class="mark ref" cx="893" cy="209" r="4"/>
  <rect class="read" x="834" y="217" width="118" height="10" rx="5"/>
  <circle class="mark ref" cx="893" cy="222" r="4"/>
  <rect class="read" x="834" y="230" width="118" height="10" rx="5"/>
  <circle class="mark ref" cx="893" cy="235" r="4"/>
  <rect class="read" x="834" y="243" width="118" height="10" rx="5"/>
  <circle class="mark ref" cx="893" cy="248" r="4"/>
  <rect class="read" x="834" y="256" width="118" height="10" rx="5"/>
  <circle class="mark ref" cx="893" cy="261" r="4"/>
  <rect class="read" x="834" y="269" width="118" height="10" rx="5"/>
  <circle class="mark ref" cx="893" cy="274" r="4"/>
  <text class="tick zh" x="708" y="308">20 條 read，3 條帶變異</text>
  <text class="anno bold mono somatic" x="708" y="338">VAF = 3 ÷ 20 = 0.15</text>

  <rect class="box accent" x="708" y="356" width="256" height="104" rx="8"/>
  <text class="anno bold zh" x="728" y="384">VAF 變異等位基因頻率</text>
  <text class="tick zh" x="728" y="410">帶變異的 read ÷ 全部 read</text>
  <text class="tick zh bold" x="728" y="436">唯一能直接數出來的一層</text>

  <rect class="box warn" x="708" y="472" width="256" height="104" rx="8"/>
  <text class="anno bold zh warn" x="728" y="500">read 不等於細胞</text>
  <text class="tick zh" x="728" y="526">一條 read 是一個 DNA 分子</text>
  <text class="tick zh" x="728" y="552">同一個細胞會給出很多條</text>

  <path class="flow" d="M320,320 L344,320" marker-end="url(#arrow)"/>
  <path class="flow" d="M656,320 L680,320" marker-end="url(#arrow)"/>

  <!-- ══════════════ 結論：方向不對稱 ══════════════ -->
  <line class="axis" x1="20" y1="616" x2="980" y2="616"/>
  <text class="lbl bold zh" x="20" y="648">由上往下算，答案唯一；由下往上反推，答案不唯一。</text>
  <text class="anno zh" x="20" y="678">腫瘤佔 0.6、其中一半帶突變、每個細胞 2 份裡有 1 份帶突變 → VAF 一定是 0.15。</text>
  <text class="anno zh" x="20" y="706">但只拿到 VAF = 0.15 時，上面兩層有很多組合都能算出同一個數字。</text>
</svg>
