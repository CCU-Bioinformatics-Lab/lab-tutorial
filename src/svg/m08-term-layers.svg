  <rect class="bar" x="476" y="252" width="11" height="22"/>
  <rect class="bar" x="489" y="252" width="11" height="22"/>
  <rect class="bar" x="502" y="252" width="11" height="22"/>
  <rect class="bar" x="515" y="252" width="11" height="22"/>
  <rect class="bar" x="528" y="252" width="11" height="22"/>
  <rect class="bar" x="541" y="252" width="11" height="22"/>
  <rect class="bar" x="554" y="252" width="11" height="22"/>
  <rect class="bar" x="567" y="252" width="11" height="22"/>
  <rect class="bar" x="580" y="252" width="11" height="22"/>
  <rect class="bar" x="593" y="252" width="11" height="22"/>
  <rect class="bar" x="606" y="252" width="11" height="22"/>
  <rect class="bar" x="619" y="252" width="11" height="22"/>
  <path class="axis" d="M372,284 L526,284"/>
  <path class="axis" d="M528,284 L630,284"/>
  <text class="tick mid zh" x="449" y="304">腫瘤細胞 12 份</text>
  <text class="tick mid zh" x="579" y="304">正常 8 份</text>
  <text class="tick zh" x="372" y="330">整個檢體 20 份，3 份帶突變</text>

  <rect class="box plain" x="372" y="350" width="256" height="62" rx="8"/>
  <text class="anno bold zh" x="392" y="376">copy number 拷貝數</text>
  <text class="tick zh" x="392" y="402">這個位置有幾份 → 這裡是 2</text>
  <rect class="box plain" x="372" y="424" width="256" height="62" rx="8"/>
  <text class="anno bold zh" x="392" y="450">multiplicity 佔幾份</text>
  <text class="tick zh" x="392" y="476">突變在其中幾份 → 這裡是 1</text>
  <rect class="box plain" x="372" y="498" width="256" height="62" rx="8"/>
  <text class="anno bold zh" x="392" y="524">ploidy 倍性</text>
  <text class="tick zh" x="392" y="550">整個基因體平均的拷貝數</text>

  <!-- ══════════════ ③ read 層：數 read ══════════════ -->
  <rect class="box plain" x="688" y="76" width="296" height="514" rx="10"/>
  <text class="anno bold zh mid" x="836" y="106">③ read 層</text>
  <text class="tick mid zh" x="836" y="130">數的是「read」</text>

  <line class="guide" x1="767" y1="146" x2="767" y2="288"/>
  <line class="guide" x1="893" y1="146" x2="893" y2="288"/>
  <rect class="read" x="708" y="152" width="118" height="10" rx="5"/>
  <circle class="mark somatic" cx="767" cy="157" r="4"/>
  <rect class="read" x="708" y="165" width="118" height="10" rx="5"/>
  <circle class="mark somatic" cx="767" cy="170" r="4"/>
