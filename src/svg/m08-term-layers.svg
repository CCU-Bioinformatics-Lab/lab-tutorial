<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 726">
  <title>purity、CCF、copy number、multiplicity 與 VAF 各自在數什麼</title>
  <desc>用同一個玩具檢體（10 個細胞、每個細胞在這個位置有 2 份 DNA）把五個名詞對齊在三個計數層級上。
        細胞層：purity 是腫瘤細胞佔全部細胞的比例，6 除以 10 等於 0.6；
        CCF 是帶有這個突變的腫瘤細胞佔全部腫瘤細胞的比例，3 除以 6 等於 0.5，兩者的分母不同。
        拷貝層：copy number 是一個細胞在這個位置有幾份 DNA，此例為 2；
        multiplicity 是突變坐落在其中幾份，此例為 1；ploidy 是整個基因體平均的 copy number。
        整個檢體在這個位置共 20 份 DNA，腫瘤細胞貢獻 12 份、正常細胞貢獻 8 份，其中 3 份帶突變。
        read 層：VAF 是帶變異的 read 佔全部 read 的比例，3 除以 20 等於 0.15，
        也是這五個數字中唯一可以由定序資料直接數出來的。
        由上往下計算答案唯一，但由 VAF 往上反推並不唯一。
        另外提醒：一條 read 是一個 DNA 分子，不是一個細胞，同一個細胞會給出很多條 read。</desc>

  <text class="lbl bold zh" x="20" y="32">這一章的名詞，其實是在三個不同層級上數東西</text>
  <text class="tick zh" x="20" y="58">玩具檢體：10 個細胞，每個細胞在這個位置有 2 份 DNA</text>

  <!-- ══════════════ ① 細胞層：數細胞 ══════════════ -->
  <rect class="box plain" x="16" y="76" width="296" height="514" rx="10"/>
  <text class="anno bold zh mid" x="164" y="106">① 細胞層</text>
  <text class="tick mid zh" x="164" y="130">數的是「細胞」</text>

  <rect class="box ghost" x="42" y="148" width="118" height="82" rx="8"/>
  <circle class="cell tumor" cx="62" cy="170" r="15"/><circle class="nucleus" cx="62" cy="170" r="7"/>
  <circle class="mark somatic" cx="62" cy="170" r="4"/>
  <circle class="cell tumor" cx="100" cy="170" r="15"/><circle class="nucleus" cx="100" cy="170" r="7"/>
  <circle class="mark somatic" cx="100" cy="170" r="4"/>
  <circle class="cell tumor" cx="138" cy="170" r="15"/><circle class="nucleus" cx="138" cy="170" r="7"/>
  <circle class="mark somatic" cx="138" cy="170" r="4"/>
  <circle class="cell tumor" cx="62" cy="208" r="15"/><circle class="nucleus" cx="62" cy="208" r="7"/>
  <circle class="cell tumor" cx="100" cy="208" r="15"/><circle class="nucleus" cx="100" cy="208" r="7"/>
  <circle class="cell tumor" cx="138" cy="208" r="15"/><circle class="nucleus" cx="138" cy="208" r="7"/>
  <rect class="box ghost" x="176" y="148" width="80" height="82" rx="8"/>
  <circle class="cell normal" cx="196" cy="170" r="15"/><circle class="nucleus" cx="196" cy="170" r="7"/>
  <circle class="cell normal" cx="234" cy="170" r="15"/><circle class="nucleus" cx="234" cy="170" r="7"/>
  <circle class="cell normal" cx="196" cy="208" r="15"/><circle class="nucleus" cx="196" cy="208" r="7"/>
  <circle class="cell normal" cx="234" cy="208" r="15"/><circle class="nucleus" cx="234" cy="208" r="7"/>
  <text class="tick mid zh" x="101" y="250">腫瘤細胞 6 個</text>
  <text class="tick mid zh" x="216" y="250">正常 4 個</text>
  <text class="tick zh" x="36" y="276">實心小點＝帶有這個突變（3 個）</text>

  <rect class="box accent" x="36" y="300" width="256" height="104" rx="8"/>
  <text class="anno bold zh" x="56" y="328">purity 腫瘤純度</text>
  <text class="tick zh" x="56" y="356">腫瘤細胞 ÷ 所有細胞</text>
  <text class="tick mono bold" x="56" y="384">6 ÷ 10 = 0.6</text>

  <rect class="box accent" x="36" y="416" width="256" height="104" rx="8"/>
  <text class="anno bold zh" x="56" y="444">CCF 癌細胞比例</text>
  <text class="tick zh" x="56" y="472">帶突變的腫瘤細胞 ÷ 腫瘤細胞</text>
  <text class="tick mono bold" x="56" y="500">3 ÷ 6 = 0.5</text>

  <text class="tick zh warn bold" x="36" y="552">兩個分數的分母不一樣</text>

  <!-- ══════════════ ② 拷貝層：數 DNA 份數 ══════════════ -->
  <rect class="box plain" x="352" y="76" width="296" height="514" rx="10"/>
  <text class="anno bold zh mid" x="500" y="106">② 拷貝層</text>
  <text class="tick mid zh" x="500" y="130">數的是「DNA 份數」</text>

  <circle class="cell tumor" cx="400" cy="178" r="16"/><circle class="nucleus" cx="400" cy="178" r="7"/>
  <circle class="mark somatic" cx="400" cy="178" r="4"/>
  <path class="conn" d="M420,178 L442,178" marker-end="url(#arrow-sm)"/>
  <g transform="translate(452,146) scale(0.8)">
    <path class="chr hp1" d="M10,2 C4,2 3,10 3,18 L3,34 C3,38 6,39 10,40
                             C14,39 17,38 17,34 L17,18 C17,10 16,2 10,2 Z"/>
    <path class="chr hp1" d="M10,78 C4,78 3,70 3,62 L3,46 C3,42 6,41 10,40
                             C14,41 17,42 17,46 L17,62 C17,70 16,78 10,78 Z"/>
  </g>
  <circle class="mark somatic" cx="460" cy="170" r="5"/>
  <g transform="translate(486,146) scale(0.8)">
    <path class="chr hp2" d="M10,2 C4,2 3,10 3,18 L3,34 C3,38 6,39 10,40
                             C14,39 17,38 17,34 L17,18 C17,10 16,2 10,2 Z"/>
    <path class="chr hp2" d="M10,78 C4,78 3,70 3,62 L3,46 C3,42 6,41 10,40
                             C14,41 17,42 17,46 L17,62 C17,70 16,78 10,78 Z"/>
  </g>
  <circle class="mark ref" cx="494" cy="170" r="5"/>
  <text class="tick zh" x="372" y="228">一個細胞 2 份，1 份帶突變</text>

  <!-- 整個檢體在這個位置的 20 份 DNA，其中 3 份帶突變 -->
  <rect class="bar somatic" x="372" y="252" width="11" height="22"/>
  <rect class="bar somatic" x="385" y="252" width="11" height="22"/>
  <rect class="bar somatic" x="398" y="252" width="11" height="22"/>
  <rect class="bar" x="411" y="252" width="11" height="22"/>
  <rect class="bar" x="424" y="252" width="11" height="22"/>
  <rect class="bar" x="437" y="252" width="11" height="22"/>
  <rect class="bar" x="450" y="252" width="11" height="22"/>
