<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430">
  <title>三個變異出現的先後順序，決定了哪些細胞群帶有它</title>
  <desc>左側是細胞分裂的譜系樹：正常細胞先獲得 S1，成為最早的腫瘤細胞群；
        這一群之後分成兩支，一支再獲得 S2，另一支再獲得 S3。
        右側把同一件事換成「哪些細胞群帶有這個變異」的橫條：
        S1 在分支之前就出現，所以三個腫瘤細胞群都有，合計佔樣本 50%；
        S2 與 S3 分別只在自己那一支裡，各佔 20% 與 10%。
        因此變異在樣本中佔的比例不是隨機的，而是由它出現在譜系樹的哪個位置決定：
        愈早出現的變異被愈多細胞群共享，看起來就愈常見。</desc>

  <!-- ══ 左：譜系樹 ══════════════════════════════════════════════ -->
  <text class="lbl bold zh" x="20" y="26">變異出現的先後</text>

  <!-- 正常細胞 -->
  <circle class="cell normal" cx="70" cy="100" r="20"/>
  <circle class="nucleus" cx="70" cy="100" r="9"/>
  <text class="tick mid zh" x="70" y="138">正常細胞</text>

  <!-- 正常 → founder -->
  <line class="conn" x1="94" y1="100" x2="196" y2="100" marker-end="url(#arrow-sm)"/>
  <circle class="mark somatic" cx="145" cy="82" r="7"/>
  <text class="tick mid somatic bold" x="145" y="68">S1</text>

  <!-- founder clone -->
  <circle class="cell tumor" cx="220" cy="100" r="20"/>
  <circle class="nucleus" cx="220" cy="100" r="9"/>
  <text class="tick mid zh somatic" x="220" y="138">最早腫瘤細胞群</text>
  <text class="tick mid" x="220" y="156">帶 S1</text>

  <!-- founder → 兩個分支 -->
  <line class="conn" x1="240" y1="90" x2="340" y2="60" marker-end="url(#arrow-sm)"/>
  <line class="conn" x1="240" y1="112" x2="340" y2="188" marker-end="url(#arrow-sm)"/>
  <circle class="mark somatic" cx="290" cy="73" r="7"/>
  <text class="tick mid somatic bold" x="290" y="60">S2</text>
  <circle class="mark somatic" cx="290" cy="150" r="7"/>
  <text class="tick mid somatic bold" x="290" y="178">S3</text>

  <!-- 分支 1 -->
  <circle class="cell clone1" cx="366" cy="56" r="20"/>
  <circle class="nucleus" cx="366" cy="56" r="9"/>
  <text class="tick zh hp1" x="392" y="52">後續分支 1</text>
  <text class="tick" x="392" y="70">帶 S1 + S2</text>

  <!-- 分支 2 -->
  <circle class="cell clone2" cx="366" cy="204" r="20"/>
  <circle class="nucleus" cx="366" cy="204" r="9"/>
  <text class="tick zh hp2" x="392" y="200">後續分支 2</text>
  <text class="tick" x="392" y="218">帶 S1 + S3</text>

  <text class="anno zh" x="20" y="268">分支之前發生的變異，會被之後所有細胞群繼承。</text>

  <!-- ══ 右：誰帶有它 ══════════════════════════════════════════════ -->
  <line class="guide" x1="530" y1="16" x2="530" y2="286"/>
  <text class="lbl bold zh" x="560" y="26">哪些細胞群帶有它</text>

  <!-- 刻度：整條 400px ＝ 100% 的細胞，所以 20% ＝ 80px、10% ＝ 40px -->
  <rect class="box sunken" x="560" y="42" width="400" height="18" rx="4"/>
  <text class="tick" x="560" y="78">0%</text>
  <text class="tick end" x="960" y="78">100% 的細胞</text>

  <!-- S1：三個腫瘤細胞群全都有。顏色刻意沿用左邊譜系樹的三個節點色 -->
  <text class="tick somatic bold" x="560" y="112">S1</text>
  <rect class="bar somatic" x="600" y="98" width="80" height="18" rx="3"/>
  <rect class="bar hp1" x="680" y="98" width="80" height="18" rx="3"/>
  <rect class="bar hp2" x="760" y="98" width="40" height="18" rx="3"/>
  <text class="tick bold" x="812" y="112">＝ 50%</text>
  <text class="tick mid" x="640" y="134">20%</text>
  <text class="tick mid" x="720" y="134">20%</text>
  <text class="tick mid" x="780" y="134">10%</text>

  <!-- S2 -->
  <text class="tick somatic bold" x="560" y="180">S2</text>
  <rect class="bar hp1" x="600" y="166" width="80" height="18" rx="3"/>
  <text class="tick bold" x="692" y="180">＝ 20%</text>
  <text class="tick zh" x="600" y="202">只有後續分支 1</text>

  <!-- S3 -->
  <text class="tick somatic bold" x="560" y="248">S3</text>
  <rect class="bar hp2" x="600" y="234" width="40" height="18" rx="3"/>
  <text class="tick bold" x="652" y="248">＝ 10%</text>
  <text class="tick zh" x="600" y="270">只有後續分支 2</text>

  <!-- ══ 底部結論 ══════════════════════════════════════════════ -->
  <line class="axis" x1="20" y1="300" x2="980" y2="300"/>
  <rect class="box accent" x="20" y="318" width="940" height="94" rx="8"/>
  <text class="lbl bold zh" x="44" y="352">愈早出現的變異，被愈多細胞群共享。</text>
  <text class="anno zh" x="44" y="382">所以「它佔多少比例」帶著「它多早出現」的訊息 ——</text>
  <text class="anno zh" x="44" y="404">這正是後面要從 VAF 反推腫瘤內部結構的依據。</text>
</svg>
