<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 530">
  <title>分析單位怎麼切出來：phase set → 區域 → 單倍型家族</title>
  <desc>三層，由上到下是切分的順序。
        第一層是 phase set。跨越兩個 phase set 之間沒有相位關係，所以分析不能跨過去。
        第二層在 phase set 內按 read 實際跨得到的距離切成區域，
        圖上是三個區域，各含 2 個或 3 個 somatic 位點，每個區域有五條 read。
        區域裡的 read 畫成虛線外框，代表這時候還不知道它們來自哪一條 haplotype。
        第三層把中間那個區域的五條 read 按單倍型家族分成兩堆，三條一堆、兩條一堆，
        外框改成實線，代表來源已經由程式判定。
        第三層每一條 read 的 x 座標與第二層完全相同，因為那是同一批 read，只是重新分組。
        讀法是：最小分析單位是「一個區域的一個單倍型家族」，不是整條染色體。</desc>

  <text class="lbl bold zh" x="20" y="32">最小分析單位：一個區域的一個單倍型家族</text>
  <text class="tick zh" x="20" y="58">上方小圓＝somatic 位點。虛線外框的 read ＝ 還不知道來自哪一條 haplotype。</text>

  <!-- ① phase set -->
  <text class="tick bold zh" x="24" y="119">① phase set</text>
  <rect class="box accent" x="140" y="104" width="460" height="20" rx="6"/>
  <text class="tick mid" x="370" y="119">phase set A</text>
  <rect class="box accent" x="640" y="104" width="320" height="20" rx="6"/>
  <text class="tick mid" x="800" y="119">phase set B</text>
  <path class="conn bad" d="M600,140 L616,128" marker-end="url(#arrow-sm)"/>
  <text class="tick zh bad" x="624" y="148">跨 phase set 之間沒有相位關係，分析不能跨過去</text>

  <!-- ② 區域 -->
  <text class="tick bold zh" x="24" y="210">② 切區域</text>
  <circle class="mark somatic" cx="200" cy="176" r="6"/>
  <circle class="mark somatic" cx="260" cy="176" r="6"/>
  <circle class="mark somatic" cx="380" cy="176" r="6"/>
  <circle class="mark somatic" cx="450" cy="176" r="6"/>
  <circle class="mark somatic" cx="520" cy="176" r="6"/>
  <circle class="mark somatic" cx="720" cy="176" r="6"/>
  <circle class="mark somatic" cx="790" cy="176" r="6"/>

  <rect class="read hp0" x="150" y="190" width="180" height="12" rx="6"/>
  <rect class="read hp0" x="350" y="190" width="230" height="12" rx="6"/>
  <rect class="read hp0" x="670" y="190" width="250" height="12" rx="6"/>
  <rect class="read hp0" x="170" y="208" width="170" height="12" rx="6"/>
  <rect class="read hp0" x="370" y="208" width="210" height="12" rx="6"/>
  <rect class="read hp0" x="690" y="208" width="230" height="12" rx="6"/>
  <rect class="read hp0" x="160" y="226" width="175" height="12" rx="6"/>
  <rect class="read hp0" x="360" y="226" width="225" height="12" rx="6"/>
  <rect class="read hp0" x="700" y="226" width="245" height="12" rx="6"/>
  <rect class="read hp0" x="155" y="244" width="178" height="12" rx="6"/>
  <rect class="read hp0" x="356" y="244" width="220" height="12" rx="6"/>
  <rect class="read hp0" x="676" y="244" width="255" height="12" rx="6"/>
  <rect class="read hp0" x="175" y="262" width="165" height="12" rx="6"/>
  <rect class="read hp0" x="366" y="262" width="215" height="12" rx="6"/>
  <rect class="read hp0" x="686" y="262" width="240" height="12" rx="6"/>

  <rect class="box ghost" x="146" y="184" width="190" height="96" rx="6"/>
  <rect class="box ghost" x="346" y="184" width="240" height="96" rx="6"/>
  <rect class="box ghost" x="666" y="184" width="280" height="96" rx="6"/>
  <text class="tick mid mono" x="241" y="298">W1 · k=2</text>
  <text class="tick mid mono" x="466" y="298">W2 · k=3</text>
  <text class="tick mid mono" x="806" y="298">W3 · k=2</text>

  <!-- ③ 單倍型家族 -->
  <text class="tick bold zh" x="24" y="366">③ 分家族</text>
  <text class="tick zh" x="140" y="326">把 W2 這五條 read 按單倍型家族分成兩堆（每一條的 x 座標與上方相同）</text>

  <rect class="read hp1" x="350" y="340" width="230" height="12" rx="6"/>
  <rect class="read hp1" x="370" y="360" width="210" height="12" rx="6"/>
  <rect class="read hp1" x="360" y="380" width="225" height="12" rx="6"/>
  <text class="tick bold hp1" x="610" y="366">HP1 family</text>
  <text class="tick zh" x="740" y="366">每一堆各自建樹</text>

  <line class="guide" x1="346" y1="396" x2="700" y2="396"/>

  <rect class="read hp2" x="356" y="406" width="220" height="12" rx="6"/>
  <rect class="read hp2" x="366" y="426" width="215" height="12" rx="6"/>
  <text class="tick bold hp2" x="610" y="422">HP2 family</text>
  <text class="tick zh" x="740" y="422">狀態空間小一半</text>

  <line class="axis" x1="20" y1="456" x2="980" y2="456"/>
  <text class="anno zh bold" x="20" y="486">somatic 變異只發生在其中一條 haplotype 上，所以先分家族既符合生物學，也讓問題變小。</text>
  <text class="anno zh" x="20" y="514">代價：兩個相距超過 read 跨距的位點之間，聯合分布仍然是未知的 —— 跟短讀時代一樣。</text>
</svg>
