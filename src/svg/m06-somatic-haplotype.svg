<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470">
  <title>germline haplotype 與 somatic haplotype 的層級示意</title>
  <desc>上層是由 germline SNP 區分的 HP1 與 HP2。
        中層示意帶有 somatic 變異且可判定來源的 read，可標為 HP1-1 或 HP2-1。
        下層示意尚未能可靠判定 germline 來源、但帶有 somatic signal 的 read 可標為 HP3；
        若同一 somatic allele 已有可靠的 haplotype assignment，流程可依條件重新分類部分 HP3 read。</desc>

  <!-- ══ 第一層：germline ══════════════════════════════════════ -->
  <text class="lbl bold zh" x="20" y="28">第一層　germline haplotype</text>
  <text class="anno zh" x="20" y="52">用 germline SNP（綠點）把 read 分成兩群</text>

  <rect class="read hp1" x="330" y="24" width="300" height="16" rx="8"/>
  <circle class="mark germline" cx="400" cy="32" r="6"/>
  <circle class="mark germline" cx="490" cy="32" r="6"/>
  <circle class="mark germline" cx="580" cy="32" r="6"/>
  <text class="lbl bold hp1" x="646" y="38">HP1</text>

  <rect class="read hp2" x="330" y="56" width="300" height="16" rx="8"/>
  <circle class="mark ref" cx="400" cy="64" r="6"/>
  <circle class="mark ref" cx="490" cy="64" r="6"/>
  <circle class="mark ref" cx="580" cy="64" r="6"/>
  <text class="lbl bold hp2" x="646" y="70">HP2</text>

  <!-- 分支箭頭 -->
  <path class="conn hp1" d="M480,80 L480,120" marker-end="url(#arrow)"/>
  <path class="conn hp2" d="M700,80 L700,120" marker-end="url(#arrow)"/>
  <text class="tick zh somatic" x="492" y="106">發生 somatic 突變</text>
  <text class="tick zh somatic" x="712" y="106">發生 somatic 突變</text>

  <!-- ══ 第二層：somatic ═══════════════════════════════════════ -->
  <text class="lbl bold zh" x="20" y="150">第二層　somatic haplotype</text>
  <text class="anno zh" x="20" y="174">在 germline haplotype 基礎上再細分</text>
  <text class="anno zh" x="20" y="198">圖示命名：來源 + 流水號</text>

  <rect class="read hp1" x="330" y="140" width="280" height="16" rx="8"/>
  <circle class="mark germline" cx="380" cy="148" r="6"/>
  <circle class="mark germline" cx="450" cy="148" r="6"/>
  <circle class="mark somatic" cx="530" cy="148" r="7"/>
  <text class="lbl bold hp1" x="626" y="154">HP1-1</text>
  <text class="tick zh" x="700" y="154">源自 HP1 的 somatic haplotype</text>

  <rect class="read hp2" x="330" y="176" width="280" height="16" rx="8"/>
  <circle class="mark ref" cx="380" cy="184" r="6"/>
  <circle class="mark ref" cx="450" cy="184" r="6"/>
  <circle class="mark somatic" cx="530" cy="184" r="7"/>
  <text class="lbl bold hp2" x="626" y="190">HP2-1</text>
  <text class="tick zh" x="700" y="190">源自 HP2 的 somatic haplotype</text>

  <!-- 再一層 -->
  <path class="conn somatic" d="M480,200 L480,232" marker-end="url(#arrow)"/>
  <rect class="read hp1" x="330" y="240" width="280" height="16" rx="8"/>
  <circle class="mark germline" cx="380" cy="248" r="6"/>
  <circle class="mark germline" cx="450" cy="248" r="6"/>
  <circle class="mark somatic" cx="530" cy="248" r="7"/>
  <circle class="mark somatic" cx="575" cy="248" r="7"/>
  <text class="lbl bold hp1" x="626" y="254">HP1-1-1</text>
  <text class="tick zh" x="710" y="254">再累積一個 somatic assignment</text>

  <!-- ══ 第三層：HP3 ═══════════════════════════════════════════ -->
  <line class="axis" x1="20" y1="284" x2="980" y2="284"/>
  <text class="lbl bold zh" x="20" y="316">第三層　無法判定來源的 read</text>
  <text class="anno zh" x="20" y="340">read 未涵蓋足夠的 germline informative SNP</text>

  <rect class="read hp0" x="470" y="304" width="150" height="16" rx="8"/>
  <circle class="mark somatic" cx="530" cy="312" r="7"/>
  <text class="lbl bold" x="636" y="318">HP3</text>
  <text class="tick zh" x="690" y="318">有 somatic signal，來源未定</text>

  <text class="anno zh" x="20" y="376">它帶有 somatic signal，但缺乏足夠的 germline 錨點或其他判定證據，</text>
  <text class="anno zh" x="20" y="400">因此尚無法可靠判斷源自 HP1 或 HP2。</text>

  <!-- 繼承 -->
  <path class="conn somatic" d="M560,330 L560,362" marker-end="url(#arrow)"/>
  <rect class="box accent" x="440" y="368" width="520" height="82" rx="8"/>
  <text class="anno bold zh" x="460" y="396">依既有 assignment 重新分類</text>
  <text class="tick zh" x="460" y="420">若同一 somatic allele 在其他 read 上已有可靠的 HP1-1 assignment，</text>
  <text class="tick zh" x="460" y="440">可在條件成立時將部分 HP3 read 重新分類為 HP1-1。</text>

  <text class="tick zh" x="20" y="440">圖示 LongPhase-S 流程的最後一步。</text>
</svg>
