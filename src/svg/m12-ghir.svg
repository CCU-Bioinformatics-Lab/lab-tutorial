<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 546">
  <title>GHIR 示意：haplotype 比例如何提供腫瘤 DNA fraction 的估計訊號</title>
  <desc>在簡化、無系統性偏差且拷貝數條件相近的示意下，上排三格比較兩條 haplotype 的 read 比例。
        正常情況下兩條 haplotype 的 read 各佔一半，比值 0.5。
        當腫瘤細胞在其中一條上發生突變，那部分 read 就被歸到新的分支，
        使原本兩條的比值偏離 0.5；在其他條件相近時，腫瘤 DNA fraction 越高，偏離可能越明顯。
        下排：把整個基因體所有位點的比值畫成直方圖，
        分布可能隨腫瘤 DNA fraction 改變而向右移動；此分布特徵可作為回歸模型的估計訊號之一。</desc>

  <!-- ══ 上排：三種平衡狀態 ══ -->
  <text class="lbl bold zh" x="20" y="28">單一位點上，兩條 haplotype 的 read 比例</text>

  <!-- 情況 1：平衡 -->
  <rect class="box plain" x="20" y="44" width="300" height="180" rx="8"/>
  <text class="anno mid bold zh" x="170" y="70">沒有腫瘤突變</text>

  <rect class="read hp1" x="46" y="88" width="120" height="14" rx="7"/>
  <rect class="read hp1" x="46" y="108" width="120" height="14" rx="7"/>
  <rect class="read hp1" x="46" y="128" width="120" height="14" rx="7"/>
  <text class="tick hp1 bold" x="174" y="118">HP1</text>

  <rect class="read hp2" x="46" y="156" width="120" height="14" rx="7"/>
  <rect class="read hp2" x="46" y="176" width="120" height="14" rx="7"/>
  <rect class="read hp2" x="46" y="196" width="120" height="14" rx="7"/>
  <text class="tick hp2 bold" x="174" y="186">HP2</text>

  <text class="lbl mid bold ok" x="258" y="146">0.50</text>
  <text class="tick mid zh" x="258" y="168">平衡</text>

  <!-- 情況 2：部分失衡 -->
  <rect class="box plain" x="348" y="44" width="300" height="180" rx="8"/>
  <text class="anno mid bold zh" x="498" y="70">少部分細胞突變</text>

  <rect class="read hp1" x="374" y="88" width="120" height="14" rx="7"/>
  <rect class="read hp1" x="374" y="108" width="120" height="14" rx="7"/>
  <rect class="read hp1" x="374" y="128" width="120" height="14" rx="7"/>
  <text class="tick hp1 bold" x="502" y="118">HP1</text>

  <rect class="read hp2" x="374" y="156" width="120" height="14" rx="7"/>
  <rect class="read hp2" x="374" y="176" width="120" height="14" rx="7"/>
  <text class="tick hp2 bold" x="502" y="176">HP2</text>
  <rect class="read hp2" x="374" y="196" width="120" height="14" rx="7"/>
  <circle class="mark somatic" cx="434" cy="203" r="6"/>
  <text class="tick somatic bold" x="502" y="208">HP2-1</text>

  <text class="lbl mid bold warn" x="586" y="146">0.60</text>
  <text class="tick mid zh" x="586" y="168">開始偏離</text>

  <!-- 情況 3：極度失衡 -->
  <rect class="box plain" x="676" y="44" width="300" height="180" rx="8"/>
  <text class="anno mid bold zh" x="826" y="70">腫瘤訊號占比較高</text>

  <rect class="read hp1" x="702" y="88" width="120" height="14" rx="7"/>
  <rect class="read hp1" x="702" y="108" width="120" height="14" rx="7"/>
  <rect class="read hp1" x="702" y="128" width="120" height="14" rx="7"/>
  <text class="tick hp1 bold" x="830" y="118">HP1</text>

  <rect class="read hp2" x="702" y="156" width="120" height="14" rx="7"/>
  <circle class="mark somatic" cx="762" cy="163" r="6"/>
  <rect class="read hp2" x="702" y="176" width="120" height="14" rx="7"/>
  <circle class="mark somatic" cx="762" cy="183" r="6"/>
  <rect class="read hp2" x="702" y="196" width="120" height="14" rx="7"/>
  <circle class="mark somatic" cx="762" cy="203" r="6"/>
  <text class="tick somatic bold" x="830" y="183">HP2-1</text>

  <text class="lbl mid bold bad" x="914" y="146">1.00</text>
  <text class="tick mid zh" x="914" y="168">HP1 佔優勢</text>

  <text class="anno zh" x="20" y="248">突變 read 被歸到新的分支後，不再計入原本分支；在此示意下，比值因此偏離 0.5。</text>

  <!-- ══ 下排：整個基因體的分布 ══ -->
  <line class="axis" x1="20" y1="272" x2="980" y2="272"/>
  <text class="lbl bold zh" x="20" y="302">把整個基因體所有位點的比值畫成直方圖</text>

  <!-- 三個直方圖 -->
  <g>
    <!-- 低腫瘤比例 -->
    <text class="anno mid zh" x="180" y="330">腫瘤比例低</text>
    <path class="axis" d="M60,440 L300,440"/>
    <rect class="bar hp1" x="70"  y="424" width="22" height="16"/>
    <rect class="bar hp1" x="96"  y="400" width="22" height="40"/>
    <rect class="bar hp1" x="122" y="356" width="22" height="84"/>
    <rect class="bar hp1" x="148" y="344" width="22" height="96"/>
    <rect class="bar hp1" x="174" y="368" width="22" height="72"/>
    <rect class="bar hp1" x="200" y="412" width="22" height="28"/>
    <rect class="bar hp1" x="226" y="428" width="22" height="12"/>
    <rect class="bar hp1" x="252" y="432" width="22" height="8"/>
    <rect class="bar hp1" x="278" y="430" width="22" height="10"/>
    <text class="tick mid" x="60"  y="460">0.5</text>
    <text class="tick mid" x="300" y="460">1.0</text>
    <text class="tick mid zh" x="180" y="484">集中在 0.5 附近</text>
    <text class="tick mid zh" x="180" y="504">跟正常樣本很像</text>
  </g>

  <g>
    <!-- 中等 -->
    <text class="anno mid zh" x="500" y="330">腫瘤比例中等</text>
    <path class="axis" d="M380,440 L620,440"/>
    <rect class="bar hp1" x="390" y="430" width="22" height="10"/>
    <rect class="bar hp1" x="416" y="416" width="22" height="24"/>
    <rect class="bar hp1" x="442" y="392" width="22" height="48"/>
    <rect class="bar hp1" x="468" y="376" width="22" height="64"/>
    <rect class="bar hp1" x="494" y="368" width="22" height="72"/>
    <rect class="bar hp1" x="520" y="372" width="22" height="68"/>
    <rect class="bar hp1" x="546" y="384" width="22" height="56"/>
    <rect class="bar hp1" x="572" y="396" width="22" height="44"/>
    <rect class="bar hp1" x="598" y="404" width="22" height="36"/>
    <text class="tick mid" x="380" y="460">0.5</text>
    <text class="tick mid" x="620" y="460">1.0</text>
    <text class="tick mid zh" x="500" y="484">分布可能向右移動</text>
  </g>

  <g>
    <!-- 高 -->
    <text class="anno mid zh" x="820" y="330">腫瘤比例高</text>
    <path class="axis" d="M700,440 L940,440"/>
    <rect class="bar somatic" x="710" y="434" width="22" height="6"/>
    <rect class="bar somatic" x="736" y="432" width="22" height="8"/>
    <rect class="bar somatic" x="762" y="428" width="22" height="12"/>
    <rect class="bar somatic" x="788" y="420" width="22" height="20"/>
    <rect class="bar somatic" x="814" y="408" width="22" height="32"/>
    <rect class="bar somatic" x="840" y="388" width="22" height="52"/>
    <rect class="bar somatic" x="866" y="360" width="22" height="80"/>
    <rect class="bar somatic" x="892" y="336" width="22" height="104"/>
    <rect class="bar somatic" x="918" y="328" width="22" height="112"/>
    <text class="tick mid" x="700" y="460">0.5</text>
    <text class="tick mid" x="940" y="460">1.0</text>
    <text class="tick mid zh" x="820" y="484">向 1.0 偏移</text>
  </g>

  <text class="anno zh bold" x="20" y="536">分布位移可作為估計腫瘤 DNA fraction 的特徵之一；實際關係需由驗證資料與模型定義。</text>
</svg>
