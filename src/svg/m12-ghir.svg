<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600">
  <title>GHIR 的定義：一個候選位點上兩條 germline haplotype 的 read 有多偏</title>
  <desc>GHIR 的定義是在一個候選 somatic 位點上，
        取 HP1 與 HP2 兩個 read 數的較大者，除以這兩者的總和。
        因此 0.5 表示兩條完全平衡，1.0 表示 read 全部偏向其中一條。
        三格由左到右示意 purity 由低到高：
        沒有腫瘤突變時 HP1 與 HP2 各三條，比值 0.5；
        少部分細胞帶突變時，帶突變的 read 被改標成 HP2-1、不再算進 HP2，比值升為 0.75；
        腫瘤細胞比例很高時 HP2 幾乎只剩 HP2-1，比值接近 1.0。
        下半部提醒第二個造成偏移的來源：腫瘤本身的拷貝數變化、LOH 與 aneuploidy
        也會讓某一條 haplotype 變多或消失，同樣把比值推向 1，
        因此需要先用 normal 樣本當基準把這類位點濾掉。</desc>

  <text class="lbl bold zh" x="20" y="32">GHIR：兩條 germline haplotype 的 read 有多偏</text>

  <rect class="box accent" x="20" y="50" width="960" height="70" rx="8"/>
  <text class="anno bold mono" x="44" y="80">GHIR = max(HP1 read 數, HP2 read 數) ÷ (HP1 read 數 + HP2 read 數)</text>
  <text class="tick zh" x="44" y="106">在每一個候選 somatic 位點上各算一次。0.5 ＝ 兩條完全平衡；1.0 ＝ read 全部偏向其中一條。</text>

  <!-- ══ 沒有腫瘤突變 ══ -->
  <rect class="box plain" x="16" y="140" width="304" height="290" rx="10"/>
  <text class="anno bold zh mid" x="168" y="170">沒有腫瘤突變</text>
  <rect class="read hp1" x="56" y="186" width="150" height="14" rx="7"/>
  <text class="tick hp1" x="214" y="198">HP1</text>
  <rect class="read hp1" x="56" y="210" width="150" height="14" rx="7"/>
  <text class="tick hp1" x="214" y="222">HP1</text>
  <rect class="read hp1" x="56" y="234" width="150" height="14" rx="7"/>
  <text class="tick hp1" x="214" y="246">HP1</text>
  <rect class="read hp2" x="56" y="258" width="150" height="14" rx="7"/>
  <text class="tick hp2" x="214" y="270">HP2</text>
  <rect class="read hp2" x="56" y="282" width="150" height="14" rx="7"/>
  <text class="tick hp2" x="214" y="294">HP2</text>
  <rect class="read hp2" x="56" y="306" width="150" height="14" rx="7"/>
  <text class="tick hp2" x="214" y="318">HP2</text>
  <text class="tick zh" x="56" y="356">HP1 = 3　HP2 = 3</text>
  <text class="tick mono" x="56" y="380">GHIR = 3 ÷ (3+3)</text>
  <text class="lbl bold mid ok" x="168" y="414">0.50</text>
  <text class="tick mid zh ok" x="266" y="414">平衡</text>

  <!-- ══ 少部分細胞帶突變 ══ -->
  <rect class="box plain" x="348" y="140" width="304" height="290" rx="10"/>
  <text class="anno bold zh mid" x="500" y="170">少部分細胞帶突變</text>
  <rect class="read hp1" x="388" y="186" width="150" height="14" rx="7"/>
  <text class="tick hp1" x="546" y="198">HP1</text>
  <rect class="read hp1" x="388" y="210" width="150" height="14" rx="7"/>
  <text class="tick hp1" x="546" y="222">HP1</text>
  <rect class="read hp1" x="388" y="234" width="150" height="14" rx="7"/>
  <text class="tick hp1" x="546" y="246">HP1</text>
  <rect class="read hp2" x="388" y="258" width="150" height="14" rx="7"/>
  <text class="tick hp2" x="546" y="270">HP2</text>
  <rect class="read hp2" x="388" y="282" width="150" height="14" rx="7"/>
  <circle class="mark somatic" cx="463" cy="289" r="5"/>
  <text class="tick somatic" x="546" y="294">HP2-1</text>
  <rect class="read hp2" x="388" y="306" width="150" height="14" rx="7"/>
  <circle class="mark somatic" cx="463" cy="313" r="5"/>
  <text class="tick somatic" x="546" y="318">HP2-1</text>
  <text class="tick zh" x="388" y="356">HP1 = 3　HP2 = 1</text>
  <text class="tick mono" x="388" y="380">GHIR = 3 ÷ (3+1)</text>
  <text class="lbl bold mid warn" x="500" y="414">0.75</text>
  <text class="tick mid zh warn" x="598" y="414">開始偏</text>

  <!-- ══ 腫瘤細胞比例很高 ══ -->
  <rect class="box plain" x="680" y="140" width="304" height="290" rx="10"/>
  <text class="anno bold zh mid" x="832" y="170">腫瘤細胞比例很高</text>
  <rect class="read hp1" x="720" y="186" width="150" height="14" rx="7"/>
  <text class="tick hp1" x="878" y="198">HP1</text>
  <rect class="read hp1" x="720" y="210" width="150" height="14" rx="7"/>
  <text class="tick hp1" x="878" y="222">HP1</text>
  <rect class="read hp1" x="720" y="234" width="150" height="14" rx="7"/>
  <text class="tick hp1" x="878" y="246">HP1</text>
  <rect class="read hp2" x="720" y="258" width="150" height="14" rx="7"/>
  <circle class="mark somatic" cx="795" cy="265" r="5"/>
  <text class="tick somatic" x="878" y="270">HP2-1</text>
  <rect class="read hp2" x="720" y="282" width="150" height="14" rx="7"/>
  <circle class="mark somatic" cx="795" cy="289" r="5"/>
  <text class="tick somatic" x="878" y="294">HP2-1</text>
  <rect class="read hp2" x="720" y="306" width="150" height="14" rx="7"/>
  <circle class="mark somatic" cx="795" cy="313" r="5"/>
  <text class="tick somatic" x="878" y="318">HP2-1</text>
  <text class="tick zh" x="720" y="356">HP1 = 3　HP2 = 0</text>
  <text class="tick mono" x="720" y="380">GHIR = 3 ÷ (3+0)</text>
  <text class="lbl bold mid bad" x="832" y="414">1.00</text>
  <text class="tick mid zh bad" x="930" y="414">完全偏一邊</text>

  <text class="tick zh somatic" x="20" y="452">帶 somatic allele 的 read 被改標成 HP2-1，就不再算進 HP2 —— 兩條的比例因此失衡。</text>

  <line class="axis" x1="20" y1="476" x2="980" y2="476"/>
  <text class="lbl bold zh" x="20" y="508">但失衡不只有一個來源。</text>
  <text class="anno zh" x="20" y="538">腫瘤本身的拷貝數變化、LOH 與 aneuploidy 也會讓某一條 haplotype 變多或整條消失，</text>
  <text class="anno zh" x="20" y="566">同樣把 GHIR 推向 1。所以要先用 <tspan class="bold">normal 樣本</tspan>當基準，把「本來就已經失衡」的位點濾掉。</text>
  <text class="anno zh bold warn" x="20" y="594">這個過濾步驟叫 LCVF，它決定了 GHIR 分布乾不乾淨。</text>
</svg>
