<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470">
  <title>理想化焦點統計量的無雜訊值與等位比例式逐項對應</title>
  <desc>兩條式子上下對齊，逐項比對。
        上面是上篇的等位比例式：分子是純度乘上某一個等位的拷貝數，
        再加上正常細胞貢獻的那一份；分母是這個位置讀到的全部 DNA。
        下面是理想化焦點統計量的無雜訊值，也就是假設這條 read 的跨距內只有焦點這一個體細胞變異時的值：分子的第一項一樣是純度乘上單倍型一的拷貝數，
        但要先扣掉被體細胞等位佔走的那一塊，也就是帶原細胞比例乘以多重度；
        加上正常細胞那一份；分母同樣是全部 DNA，同樣扣掉那一塊。
        差別只有兩處：被扣掉的那一塊，以及最外面多了一層取較大值。
        因為形式相同，上篇建立的整套機制都可以直接接上來：
        反解式、那一族給出相同觀測的參數、以及以離整數多遠為目標的擬合方式。
        讀法是：這不是一個新的統計量，它是舊的那一個，只是量在體細胞變異的位置上。</desc>

  <text class="ttl zh" x="20" y="36">兩式逐項對應</text>
  <text class="anno zh" x="20" y="66">上為上篇的等位比例式，下為本頁 GHIR 的期望值。四欄由左至右對齊比較。</text>

  <!-- 欄標 -->
  <text class="tick zh mid" x="150" y="106">外層</text>
  <text class="tick zh mid" x="400" y="106">分子的腫瘤項</text>
  <text class="tick zh mid" x="620" y="106">分子的正常項</text>
  <text class="tick zh mid" x="840" y="106">分母</text>

  <!-- ══ 上：等位比例式 ══ -->
  <rect class="box ghost" x="20" y="120" width="960" height="106" rx="8"/>
  <text class="anno bold zh" x="40" y="150">等位比例</text>

  <rect class="box plain" x="90" y="164" width="120" height="44" rx="6"/>
  <text class="tick zh mid" x="150" y="192">無</text>

  <rect class="box plain" x="300" y="164" width="200" height="44" rx="6"/>
  <text class="tick mono mid" x="400" y="192">ρ · n_B</text>

  <rect class="box plain" x="530" y="164" width="180" height="44" rx="6"/>
  <text class="tick mono mid" x="620" y="192">(1 − ρ)</text>

  <rect class="box plain" x="740" y="164" width="220" height="44" rx="6"/>
  <text class="tick mono mid" x="850" y="192">ρ(n_A+n_B) + 2(1−ρ)</text>

  <!-- ══ 下：GHIR ══ -->
  <rect class="box ghost ok" x="20" y="240" width="960" height="106" rx="8"/>
  <text class="anno bold zh" x="40" y="264">理想化焦點</text>
  <text class="tick zh" x="40" y="286">統計量</text>

  <rect class="box accent" x="90" y="284" width="120" height="44" rx="6"/>
  <text class="tick bold mono mid" x="150" y="312">max( · )</text>

  <rect class="box accent" x="300" y="284" width="200" height="44" rx="6"/>
  <text class="tick bold mono mid" x="400" y="312">p(n₁ − cμ)</text>

  <rect class="box plain" x="530" y="284" width="180" height="44" rx="6"/>
  <text class="tick mono mid" x="620" y="312">(1 − p)</text>

  <rect class="box accent" x="740" y="284" width="220" height="44" rx="6"/>
  <text class="tick bold mono mid" x="850" y="312">p(n₁+n₂−cμ) + 2(1−p)</text>

  <!-- 對應線 -->
  <line class="conn ok" x1="620" y1="212" x2="620" y2="280" style="stroke-dasharray:5 4"/>
  <text class="tick ok zh mid" x="620" y="238">完全相同</text>

  <!-- ══ 差異 ══ -->
  <rect class="box accent" x="20" y="362" width="470" height="92" rx="8"/>
  <text class="anno bold zh" x="44" y="392">差異一：被扣掉的 <tspan class="mono">cμ</tspan></text>
  <text class="tick zh" x="44" y="418">帶有 somatic 等位的分子離開了 germline 計數，</text>
  <text class="tick zh" x="44" y="442">故腫瘤側的拷貝數要扣掉這一塊。</text>

  <rect class="box accent" x="510" y="362" width="470" height="92" rx="8"/>
  <text class="anno bold zh" x="534" y="392">差異二：外層的 <tspan class="mono">max</tspan></text>
  <text class="tick zh" x="534" y="418">折疊，使值域為 0.5 至 1。作用與上篇隨機化</text>
  <text class="tick zh" x="534" y="442">等位標號相同，代價見下一節。</text>
</svg>
