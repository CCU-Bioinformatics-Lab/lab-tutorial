<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470">
  <title>latent node 是模型為了接通圖而補進去的狀態，不是還沒觀察到的細胞</title>
  <desc>左邊是資料實際看到的：兩個位置的組合只觀測到 0 0 與 1 1 兩種，各有 read 支持。
        中間是模型遇到的問題：這個模型規定每一條邊只能新增一個突變，
        但從 0 0 直接跳到 1 1 一次多了兩個突變，因此兩點接不起來。
        右邊是模型的處理方式：補一個沒有任何 read 支持的中間狀態，
        可以是 1 0 也可以是 0 1，圖才連得起來。這個補進去的節點就叫 latent node，
        圖上畫成虛線空心以示區別。
        下方是重點：兩種補法都能讓圖連通，資料本身無法分辨該用哪一個，
        所以 latent node 是模型的產物而不是資料的產物。
        換一組模型假設或補進新資料之後，它可能就不存在了。
        因此不能把它讀成「有一個還沒被發現的 subclone」。</desc>

  <text class="lbl bold zh" x="20" y="32">latent node：模型補上去的節點，不是資料看到的細胞</text>

  <!-- ══ ① 資料看到的 ══ -->
  <rect class="box plain" x="20" y="56" width="300" height="230" rx="10"/>
  <text class="anno bold zh" x="44" y="86">① 資料看到的</text>
  <text class="tick zh" x="44" y="112">兩個位置的組合，只觀測到兩種</text>

  <circle class="mark ref" cx="110" cy="170" r="26"/>
  <text class="anno mono mid bold germline" x="110" y="177" style="font-size:20px">00</text>
  <text class="tick mid zh" x="110" y="214">12 條 read</text>

  <circle class="mark ref" cx="230" cy="170" r="26"/>
  <text class="anno mono mid bold somatic" x="230" y="177" style="font-size:20px">11</text>
  <text class="tick mid zh" x="230" y="214">9 條 read</text>

  <text class="tick zh" x="44" y="256">兩種都有 read 撐著，</text>
  <text class="tick zh" x="44" y="278">這是實際的觀測。</text>

  <!-- ══ ② 模型遇到的問題 ══ -->
  <rect class="box warn" x="340" y="56" width="300" height="230" rx="10"/>
  <text class="anno bold zh" x="364" y="86">② 模型接不起來</text>
  <text class="tick zh" x="364" y="112">此模型規定：一條邊只能加一個突變</text>

  <circle class="mark ref" cx="430" cy="170" r="26"/>
  <text class="anno mono mid bold germline" x="430" y="177" style="font-size:20px">00</text>
  <circle class="mark ref" cx="550" cy="170" r="26"/>
  <text class="anno mono mid bold somatic" x="550" y="177" style="font-size:20px">11</text>

  <path class="conn bad" d="M458,170 L522,170" marker-end="url(#arrow)" style="stroke-dasharray:6 4"/>
  <text class="anno bold bad mid" x="490" y="150">✗</text>
  <text class="tick mid zh bad" x="490" y="214">一次多了兩個</text>

  <text class="tick zh" x="364" y="256">直接連會違反模型的規則，</text>
  <text class="tick zh" x="364" y="278">所以這張圖是斷的。</text>

  <!-- ══ ③ 模型補一個節點 ══ -->
  <rect class="box accent" x="660" y="56" width="320" height="230" rx="10"/>
  <text class="anno bold zh" x="684" y="86">③ 於是補一個中間狀態</text>
  <text class="tick zh" x="684" y="112">補上去之後，每條邊都只加一個</text>

  <circle class="mark ref" cx="726" cy="182" r="24"/>
  <text class="anno mono mid bold germline" x="726" y="189" style="font-size:18px">00</text>

  <circle class="mark ref" cx="820" cy="182" r="24" style="stroke-dasharray:5 3"/>
  <text class="anno mono mid bold" x="820" y="189" style="font-size:18px">10</text>

  <circle class="mark ref" cx="914" cy="182" r="24"/>
  <text class="anno mono mid bold somatic" x="914" y="189" style="font-size:18px">11</text>

  <path class="conn" d="M752,182 L794,182" marker-end="url(#arrow-sm)"/>
  <path class="conn" d="M846,182 L888,182" marker-end="url(#arrow-sm)"/>

  <text class="tick mid zh" x="820" y="232">0 條 read</text>
  <text class="anno mid zh bold" x="820" y="266">這一個就是 latent node</text>

  <!-- ══ 重點 ══ -->
  <line class="axis" x1="20" y1="308" x2="980" y2="308"/>

  <rect class="box bad" x="20" y="326" width="960" height="130" rx="10"/>
  <text class="anno bold zh bad" x="44" y="356">為什麼不能把它當成「還沒被發現的 subclone」</text>
  <text class="tick zh" x="44" y="388">補 <tspan class="mono bold">10</tspan> 可以接通，補 <tspan class="mono bold">01</tspan> 也一樣可以接通 —— <tspan class="bold">資料本身分不出該用哪一個</tspan>。</text>
  <text class="tick zh" x="44" y="414">會出現這個節點，是因為模型規定了「一條邊只能加一個突變」，不是因為看到了什麼。</text>
  <text class="tick zh" x="44" y="440">換一組假設、或補進新的 read，它可能就不見了。它是<tspan class="bold">模型的產物，不是資料的產物</tspan>。</text>
</svg>
