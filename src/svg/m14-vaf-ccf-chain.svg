<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520">
  <title>從 VAF 換算到 cancer cell fraction 要經過三個估計值</title>
  <desc>上半是換算式：CCF 等於 VAF 乘上一個分數，
        分子是純度乘腫瘤拷貝數再加上 2 乘以 1 減純度，分母是純度乘 multiplicity。
        式子裡有三個量不是直接量到的：純度與腫瘤拷貝數各自來自另一支程式，
        multiplicity 也就是變異位在幾份腫瘤拷貝上，通常只能在 1 與 2 之間猜。
        下半用同一個 VAF 0.30 示範三組假設的結果：
        純度 0.60、拷貝數 2、multiplicity 1 時 CCF 是 1.00，讀成所有腫瘤細胞都帶有；
        只把 multiplicity 改成 2，CCF 掉到 0.50，同一個變異就被讀成只有一半腫瘤細胞帶有；
        把拷貝數改成 3，CCF 變成 1.30，超過 1 表示這組假設本身不成立。
        讀法是：CCF 是三個估計值的商，其中 multiplicity 猜錯一格就足以讓 clonal 與 subclonal 互換。</desc>

  <text class="lbl bold zh" x="20" y="32">CCF 是三個估計值的商</text>
  <text class="tick zh" x="20" y="58">換算式的分母不是 2。三個量各自有誤差，其中一個通常只能猜。</text>

  <rect class="box plain" x="20" y="82" width="960" height="112" rx="8"/>
  <text class="lbl bold" x="40" y="150">CCF ＝ VAF ×</text>
  <text class="anno zh" x="200" y="132">純度 × 腫瘤拷貝數 ＋ 2 × (1 − 純度)</text>
  <line class="axis" x1="196" y1="142" x2="536" y2="142" style="stroke-width:1.5"/>
  <text class="anno zh" x="200" y="170">純度 × multiplicity</text>

  <text class="tick zh" x="560" y="116">純度：另一支程式估的</text>
  <text class="tick zh" x="560" y="142">腫瘤拷貝數：另一支程式估的</text>
  <text class="tick zh bad" x="560" y="168">multiplicity：通常只能在 1 與 2 之間猜</text>

  <text class="lbl bold zh" x="20" y="232">同一個 VAF ＝ 0.30，在三組假設下落在哪裡</text>

  <!-- CCF > 1 的無效區 -->
  <rect class="region bad" x="767" y="252" width="173" height="146"/>
  <text class="tick zh bad" x="775" y="270">CCF &gt; 1 → 假設不成立</text>

  <text class="tick bold zh" x="30"  y="292">純度</text>
  <text class="tick bold zh" x="130" y="292">腫瘤拷貝數</text>
  <text class="tick bold" x="270" y="292">multiplicity</text>
  <text class="tick bold" x="420" y="292">CCF</text>
  <line class="axis" x1="20" y1="300" x2="980" y2="300" style="stroke-width:1.5"/>

  <!-- 三列 -->
  <line class="guide" x1="420" y1="322" x2="940" y2="322"/>
  <text class="tick mono" x="30"  y="327">0.60</text>
  <text class="tick mono" x="130" y="327">2</text>
  <text class="tick mono" x="270" y="327">1</text>
  <circle class="pt tp" cx="767" cy="322" r="7"/>
  <text class="tick mono bold somatic" x="780" y="327">1.00</text>

  <line class="guide" x1="420" y1="356" x2="940" y2="356"/>
  <text class="tick mono" x="30"  y="361">0.60</text>
  <text class="tick mono" x="130" y="361">2</text>
  <text class="tick mono bold bad" x="270" y="361">2</text>
  <circle class="pt tp" cx="593" cy="356" r="7"/>
  <text class="tick mono bold somatic" x="606" y="361">0.50</text>

  <line class="guide" x1="420" y1="390" x2="940" y2="390"/>
  <text class="tick mono" x="30"  y="395">0.60</text>
  <text class="tick mono bold bad" x="130" y="395">3</text>
  <text class="tick mono" x="270" y="395">1</text>
  <circle class="pt fp" cx="871" cy="390" r="7"/>
  <text class="tick mono bold bad" x="884" y="395">1.30</text>

  <line class="axis" x1="420" y1="410" x2="940" y2="410"/>
  <text class="tick mid mono" x="420" y="432">0</text>
  <text class="tick mid mono" x="593" y="432">0.5</text>
  <text class="tick mid mono" x="767" y="432">1.0</text>
  <text class="tick mid mono" x="940" y="432">1.5</text>

  <line class="axis" x1="20" y1="452" x2="980" y2="452"/>
  <text class="anno zh bold" x="20" y="482">multiplicity 從 1 改成 2，CCF 就少一半 —— 剛好足以把一個 clonal 變異讀成 subclonal。</text>
  <text class="anno zh" x="20" y="510">前兩列都是<tspan class="bold">合理的讀法</tspan>，資料本身分不出來；只有第三列的 CCF &gt; 1 才是假設出錯。</text>
</svg>
