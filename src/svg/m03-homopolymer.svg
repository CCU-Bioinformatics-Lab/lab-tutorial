<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 460">
  <title>為什麼同一個鹼基連續重複的區段特別容易讀錯長度</title>
  <desc>奈米孔定序靠電流訊號判讀鹼基。
        當序列是各種不同鹼基交替時，每個鹼基造成的電流變化明顯，容易分辨。
        但當同一個鹼基連續重複時，電流會維持在同一個平台上，
        六個與七個造成的訊號差異可能很小，因此增加長度判讀錯誤。
        長度誤判可能形成表觀插入或缺失，是假陽性 indel 的常見來源之一。</desc>

  <!-- ══ 上：一般序列 ══ -->
  <rect class="box ok" x="16" y="16" width="472" height="196" rx="10"/>
  <text class="anno bold zh ok" x="38" y="46">一般序列：好判讀</text>

  <text class="tick zh" x="38" y="74">序列</text>
  <g class="mono" font-size="18">
    <text class="base a" x="130" y="78">A</text>
    <text class="base c" x="162" y="78">C</text>
    <text class="base g" x="194" y="78">G</text>
    <text class="base t" x="226" y="78">T</text>
    <text class="base a" x="258" y="78">A</text>
    <text class="base c" x="290" y="78">C</text>
    <text class="base t" x="322" y="78">T</text>
    <text class="base g" x="354" y="78">G</text>
  </g>

  <text class="tick zh" x="38" y="116">電流訊號</text>
  <line class="axis" x1="120" y1="180" x2="460" y2="180"/>
  <path class="conn thick ok" d="M120,150 L146,150 L146,120 L178,120 L178,164 L210,164
                              L210,134 L242,134 L242,156 L274,156 L274,126 L306,126
                              L306,170 L338,170 L338,140 L370,140 L370,158 L460,158" style="stroke-width:3"/>
  <text class="tick zh ok bold" x="38" y="204">每個鹼基造成明顯的高低變化 → 容易數</text>

  <!-- ══ 下：homopolymer ══ -->
  <rect class="box bad" x="512" y="16" width="472" height="196" rx="10"/>
  <text class="anno bold zh bad" x="534" y="46">連續重複：難判讀</text>

  <text class="tick zh" x="534" y="74">序列</text>
  <g class="mono" font-size="18">
    <text class="base t" x="626" y="78">T</text>
    <text class="base t" x="658" y="78">T</text>
    <text class="base t" x="690" y="78">T</text>
    <text class="base t" x="722" y="78">T</text>
    <text class="base t" x="754" y="78">T</text>
    <text class="base t" x="786" y="78">T</text>
    <text class="base t" x="818" y="78">T</text>
  </g>

  <text class="tick zh" x="534" y="116">電流訊號</text>
  <line class="axis" x1="616" y1="180" x2="956" y2="180"/>
  <path class="conn thick bad" d="M616,158 L640,158 L640,132 L840,132 L840,158 L956,158" style="stroke-width:3"/>
  <text class="tick mid zh" x="740" y="124">一路維持在同一個平台</text>
  <text class="tick zh bad bold" x="534" y="204">六個與七個差異可能很小 → 容易數錯</text>

  <!-- ══ 後果 ══ -->
  <line class="axis" x1="20" y1="240" x2="980" y2="240"/>
  <text class="lbl bold zh" x="20" y="272">數錯一個的後果：形成表觀插入或缺失</text>

  <!-- 參考 -->
  <text class="tick end zh" x="200" y="312">參考序列</text>
  <g class="mono" font-size="17">
    <text class="base a" x="224" y="312">A</text>
    <text class="base t" x="256" y="312">T</text>
    <text class="base t" x="288" y="312">T</text>
    <text class="base t" x="320" y="312">T</text>
    <text class="base t" x="352" y="312">T</text>
    <text class="base t" x="384" y="312">T</text>
    <text class="base t" x="416" y="312">T</text>
    <text class="base g" x="448" y="312">G</text>
  </g>
  <text class="tick zh" x="488" y="312">（六個 T）</text>

  <!-- 讀錯：多一個 -->
  <text class="tick end zh" x="200" y="352">讀出來</text>
  <g class="mono" font-size="17">
    <text class="base a" x="224" y="352">A</text>
    <text class="base t" x="256" y="352">T</text>
    <text class="base t" x="288" y="352">T</text>
    <text class="base t" x="320" y="352">T</text>
    <text class="base t" x="352" y="352">T</text>
    <text class="base t" x="384" y="352">T</text>
    <text class="base t" x="416" y="352">T</text>
    <text class="base t artifact" x="448" y="352">T</text>
    <text class="base g" x="480" y="352">G</text>
  </g>
  <rect class="box ghost artifact" x="436" y="334" width="26" height="24" rx="3" style="stroke-dasharray:4 2"/>
  <text class="tick zh artifact bold" x="520" y="352">多數了一個 → 報成一個「插入」</text>

  <rect class="box warn" x="20" y="380" width="960" height="66" rx="8"/>
  <text class="anno zh" x="42" y="408">這類假訊號單靠提高門檻未必能解決；僅憑目前資料可能難以與真實插入缺失區分。</text>
  <text class="anno zh bold" x="42" y="434">可加入序列以外的證據，例如檢查支持 reads 是否集中於一致的 haplotype。</text>
</svg>
