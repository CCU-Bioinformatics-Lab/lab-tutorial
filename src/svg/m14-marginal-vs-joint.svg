<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 596">
  <title>邊際頻率相同的兩種細胞組成，聯合計數與樹卻不同</title>
  <desc>左右兩種細胞組成的邊際頻率刻意做成完全一樣：S1 出現在 50% 的細胞裡，S2 出現在 30% 的細胞裡。
        左邊的組成是：3 個細胞同時帶有 S1 與 S2，2 個只帶 S1，5 個都沒有。
        右邊的組成是：5 個只帶 S1，3 個只帶 S2，2 個都沒有，沒有任何細胞同時帶有兩者。
        兩邊各自數出來的 S1 都是 5 個、S2 都是 3 個，所以邊際頻率相同。
        差別出現在聯合計數表，而且剛好互換：左邊「只帶 S2」的 01 是 0 個、11 是 3 個；
        右邊 01 是 3 個、11 是 0 個。
        因此左邊相容的樹是一條線，S2 出現在已經有 S1 的細胞裡；
        右邊的樹分岔，因為只帶 S2 的那群細胞必須另外從起點長出來。
        兩邊都是每個突變只發生一次就解釋得通的樹。
        要點：邊際頻率不提供 01 與 11 兩格各自的計數，而樹的形狀正取決於此二格。</desc>

  <text class="lbl bold zh" x="20" y="32">頻率是邊際分布，樹要的是聯合分布</text>
  <text class="tick zh" x="20" y="58">左右兩邊的邊際頻率刻意做成完全相同 —— 重點正是「光看這兩個數字分不出來」。</text>

