  <text class="tick zh" x="40" y="330">→ 與這張表相容的樹</text>

  <circle class="box plain" cx="100" cy="386" r="22"/>
  <text class="tick mid mono bold" x="100" y="391">00</text>
  <path class="conn somatic thick" d="M124,386 L216,386" marker-end="url(#arrow-sm)"/>
